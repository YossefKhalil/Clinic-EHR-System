<!DOCTYPE html>
<!--
  AI settings mock, second pass: compact.

  Rules for this pass:
    - no seeded keys, account IDs, model IDs, or selected provider values
    - provider tabs, one credentials row at a time
    - one ordered fallback list, each row picks its own provider
    - test per provider, validation on save
    - EN / AR, RTL, no em dashes
-->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI settings: preview</title>
<link id="bsLtr" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link id="bsRtl" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" disabled>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    body { background: #f8f9fa; font-family: system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif; }
    .page-container { max-width: 900px; }
    .preview-bar { position: sticky; top: 0; z-index: 1030; }
    .preview-bar .btn { --bs-btn-padding-y: .15rem; --bs-btn-padding-x: .55rem; --bs-btn-font-size: .78rem; }
    .nav-pills .nav-link { font-size: .88rem; padding: .4rem .5rem; }
    .provider-panel .form-label { margin-bottom: .2rem; }
    .chain-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .55rem 0; border-bottom: 1px solid #e9ecef; }
    .chain-row:last-child { border-bottom: 0; }
    .chain-row .chain-provider { width: 12.5rem; }
    .chain-row .chain-model { flex: 1 1 15rem; min-width: 12rem; }
    .chain-row .row-num { width: 1.7rem; }
    .chain-row .actions { margin-inline-start: auto; }
    .tab-ready { font-size: .72rem; }
    @media (max-width: 575.98px) {
        .chain-row .chain-provider { width: 100%; }
        .chain-row .chain-model { min-width: 100%; }
        .chain-row .actions { margin-inline-start: 0; }
    }
</style>
</head>
<body>

<div class="preview-bar bg-dark">
    <div class="container page-container py-2 d-flex align-items-center gap-2">
        <span class="text-white-50 small">Preview</span>
        <div class="btn-group ms-auto" role="group" aria-label="Language">
            <button type="button" class="btn btn-light" id="langEn">English</button>
            <button type="button" class="btn btn-outline-light" id="langAr">العربية</button>
        </div>
    </div>
</div>

<main class="container page-container py-4">
    <h2 class="text-secondary fw-bold mb-1">
        <i class="bi bi-stars text-primary me-1"></i><span data-i18n="page.title">AI Import Settings</span>
    </h2>
    <p class="text-muted small mb-4" data-i18n="page.subtitle">Providers, credentials, and a model fallback chain.</p>

    <div class="card shadow-sm border-0">
        <div class="card-body p-3 p-md-4">
            <div class="d-flex flex-wrap align-items-start gap-3">
                <div class="flex-grow-1">
                    <h5 class="mb-1" data-i18n="providers.title">Providers</h5>
                    <div class="small text-muted" data-i18n="providers.hint">Keys are encrypted on the server and never sent to the browser.</div>
                </div>
                <div class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="enabled">
                    <label class="form-check-label small" for="enabled" data-i18n="enable.label">Enable AI Import</label>
                </div>
            </div>

            <div class="nav nav-pills nav-fill bg-light rounded p-1 mt-3" role="tablist">
                <button type="button" class="nav-link active" data-provider="openrouter" role="tab" aria-selected="true">
                    <span data-i18n="provider.openrouter">OpenRouter</span><i class="bi bi-check-circle-fill text-success ms-1 tab-ready d-none" aria-hidden="true"></i>
                </button>
                <button type="button" class="nav-link" data-provider="cloudflare" role="tab" aria-selected="false">
                    <span data-i18n="provider.cloudflare">Cloudflare</span><i class="bi bi-check-circle-fill text-success ms-1 tab-ready d-none" aria-hidden="true"></i>
                </button>
                <button type="button" class="nav-link" data-provider="openai" role="tab" aria-selected="false">
                    <span data-i18n="provider.openai">OpenAI-compatible</span><i class="bi bi-check-circle-fill text-success ms-1 tab-ready d-none" aria-hidden="true"></i>
                </button>
            </div>

            <div class="mt-3">
                <div id="panel-openrouter" class="provider-panel">
                    <div class="row g-2 align-items-end">
                        <div class="col-12 col-md-8">
                            <label class="form-label small fw-semibold" for="orKey" data-i18n="cred.key">API key</label>
                            <input type="password" class="form-control" id="orKey" placeholder="Paste API key" data-i18n-ph="cred.keyPh" autocomplete="new-password" dir="ltr">
                        </div>
                        <div class="col-12 col-md-4 d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary" data-test="openrouter"><span data-i18n="cred.test">Test</span></button>
                            <span id="testResult-openrouter" class="small"></span>
                        </div>
                    </div>
                </div>

                <div id="panel-cloudflare" class="provider-panel d-none">
                    <div class="row g-2 align-items-end">
                        <div class="col-12 col-md-4">
                            <label class="form-label small fw-semibold" for="cfAccount" data-i18n="cred.account">Account ID</label>
                            <input type="text" class="form-control" id="cfAccount" placeholder="Account ID" data-i18n-ph="cred.accountPh" dir="ltr">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label small fw-semibold" for="cfToken" data-i18n="cred.token">API token</label>
                            <input type="password" class="form-control" id="cfToken" placeholder="API token" data-i18n-ph="cred.tokenPh" autocomplete="new-password" dir="ltr">
                        </div>
                        <div class="col-12 col-md-4 d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary" data-test="cloudflare"><span data-i18n="cred.test">Test</span></button>
                            <span id="testResult-cloudflare" class="small"></span>
                        </div>
                    </div>
                </div>

                <div id="panel-openai" class="provider-panel d-none">
                    <div class="row g-2 align-items-end">
                        <div class="col-12 col-md-5">
                            <label class="form-label small fw-semibold" for="oaBase" data-i18n="cred.baseUrl">Base URL</label>
                            <input type="text" class="form-control" id="oaBase" placeholder="https://your-endpoint/v1" data-i18n-ph="cred.baseUrlPh" dir="ltr">
                        </div>
                        <div class="col-12 col-md-4">
                            <label class="form-label small fw-semibold" for="oaKey" data-i18n="cred.key">API key</label>
                            <input type="password" class="form-control" id="oaKey" placeholder="Paste API key" data-i18n-ph="cred.keyPh" autocomplete="new-password" dir="ltr">
                        </div>
                        <div class="col-12 col-md-3 d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary" data-test="openai"><span data-i18n="cred.test">Test</span></button>
                            <span id="testResult-openai" class="small"></span>
                        </div>
                    </div>
                </div>
            </div>

            <hr class="my-4">

            <div>
                <h5 class="mb-1" data-i18n="chain.title">Fallback models</h5>
                <div class="small text-muted" data-i18n="chain.hint">Tried in order. Use a vision model for images and PDFs.</div>
            </div>

            <div id="chainRows" class="mt-2"></div>

            <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="addModel">
                <i class="bi bi-plus-lg me-1"></i><span data-i18n="chain.add">Add model</span>
            </button>

            <hr class="my-4">

            <div class="d-flex flex-wrap align-items-center justify-content-end gap-2">
                <button type="button" class="btn btn-link text-secondary text-decoration-none" id="discardBtn" data-i18n="btn.discard">Discard</button>
                <button type="button" class="btn btn-primary" id="saveBtn" data-i18n="btn.save">Save settings</button>
            </div>

            <div id="saveResult" class="alert py-2 px-3 mt-3 mb-0 d-none"><span id="saveResultText"></span></div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const I18N = {
    en: {
        'page.title': "AI Import Settings",
        'page.subtitle': "Providers, credentials, and a model fallback chain.",
        'providers.title': "Providers",
        'providers.hint': "Keys are encrypted on the server and never sent to the browser.",
        'enable.label': "Enable AI Import",
        'provider.openrouter': "OpenRouter",
        'provider.cloudflare': "Cloudflare",
        'provider.openai': "OpenAI-compatible",
        'cred.key': "API key",
        'cred.account': "Account ID",
        'cred.token': "API token",
        'cred.baseUrl': "Base URL",
        'cred.keyPh': "Paste API key",
        'cred.accountPh': "Account ID",
        'cred.tokenPh': "API token",
        'cred.baseUrlPh': "https://your-endpoint/v1",
        'cred.test': "Test",
        'cred.testing': "Testing...",
        'cred.testOk': "Connection OK",
        'cred.testMissing': "Add credentials first.",
        'chain.title': "Fallback models",
        'chain.hint': "Tried in order. Use a vision model for images and PDFs.",
        'chain.provider': "Provider",
        'chain.model': "Model",
        'chain.modelPh': "Model ID",
        'chain.add': "Add model",
        'chain.remove': "Remove",
        'chain.up': "Move up",
        'chain.down': "Move down",
        'chain.empty': "Add at least one provider and model.",
        'chain.incomplete': "Complete each row or remove it.",
        'chain.needsKey': "Add credentials for {provider}.",
        'btn.save': "Save settings",
        'btn.discard': "Discard",
        'save.ok': "Settings saved.",
        'discard.ok': "Changes discarded.",
    },
    ar: {
        'page.title': "إعدادات الاستيراد بالذكاء الاصطناعي",
        'page.subtitle': "المزوّدون وبيانات الاعتماد وسلسلة احتياط للنماذج.",
        'providers.title': "المزوّدون",
        'providers.hint': "تُشفَّر المفاتيح على الخادم ولا تُرسل إلى المتصفح.",
        'enable.label': "تفعيل الاستيراد بالذكاء الاصطناعي",
        'provider.openrouter': "OpenRouter",
        'provider.cloudflare': "Cloudflare",
        'provider.openai': "متوافق مع OpenAI",
        'cred.key': "مفتاح API",
        'cred.account': "معرّف الحساب",
        'cred.token': "رمز API",
        'cred.baseUrl': "عنوان URL الأساسي",
        'cred.keyPh': "ألصق مفتاح API",
        'cred.accountPh': "معرّف الحساب",
        'cred.tokenPh': "رمز API",
        'cred.baseUrlPh': "https://your-endpoint/v1",
        'cred.test': "اختبار",
        'cred.testing': "جارٍ الاختبار...",
        'cred.testOk': "الاتصال سليم",
        'cred.testMissing': "أضف بيانات الاعتماد أولًا.",
        'chain.title': "نماذج الاحتياط",
        'chain.hint': "تُجرَّب بالترتيب. استخدم نموذجًا يدعم الرؤية للصور وملفات PDF.",
        'chain.provider': "المزوّد",
        'chain.model': "النموذج",
        'chain.modelPh': "معرّف النموذج",
        'chain.add': "إضافة نموذج",
        'chain.remove': "إزالة",
        'chain.up': "نقل لأعلى",
        'chain.down': "نقل لأسفل",
        'chain.empty': "أضف مزوّدًا ونموذجًا واحدًا على الأقل.",
        'chain.incomplete': "أكمل كل صف أو أزله.",
        'chain.needsKey': "أضف بيانات الاعتماد لـ {provider}.",
        'btn.save': "حفظ الإعدادات",
        'btn.discard': "تجاهل",
        'save.ok': "تم حفظ الإعدادات.",
        'discard.ok': "تم تجاهل التغييرات.",
    },
};

let lang = 'en';
let selectedProvider = 'openrouter';
let chain = [
    { provider: '', model: '' },
    { provider: '', model: '' },
];
let lastResult = null;

const PROVIDERS = {
    openrouter: { label: 'provider.openrouter' },
    cloudflare: { label: 'provider.cloudflare' },
    openai: { label: 'provider.openai' },
};

function t(key, params = {}) {
    let value = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
    Object.keys(params).forEach((name) => {
        value = value.replace(new RegExp('\\{' + name + '\\}', 'g'), String(params[name]));
    });
    return value;
}

function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
}

function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[ch]));
}

function renderChain() {
    const host = document.getElementById('chainRows');
    host.innerHTML = chain.map((row, i) => {
        const options = Object.keys(PROVIDERS).map((key) => (
            '<option value="' + key + '"' + (row.provider === key ? ' selected' : '') + '>' +
            escapeHtml(t(PROVIDERS[key].label)) + '</option>'
        )).join('');
        return '<div class="chain-row" data-index="' + i + '">' +
            '<span class="badge rounded-pill text-bg-light border row-num">' + (i + 1) + '</span>' +
            '<select class="form-select form-select-sm chain-provider" data-act="provider" aria-label="' + escapeHtml(t('chain.provider')) + '">' +
                '<option value=""' + (row.provider === '' ? ' selected' : '') + '>' + escapeHtml(t('chain.provider')) + '</option>' +
                options +
            '</select>' +
            '<input type="text" class="form-control form-control-sm font-monospace chain-model" data-act="model" value="' + escapeHtml(row.model) + '" placeholder="' + escapeHtml(t('chain.modelPh')) + '" aria-label="' + escapeHtml(t('chain.model')) + '" autocomplete="off" spellcheck="false" dir="ltr">' +
            '<div class="btn-group btn-group-sm actions" role="group">' +
                '<button type="button" class="btn btn-outline-secondary" data-act="up" title="' + escapeHtml(t('chain.up')) + '" aria-label="' + escapeHtml(t('chain.up')) + '"' + (i === 0 ? ' disabled' : '') + '><i class="bi bi-arrow-up"></i></button>' +
                '<button type="button" class="btn btn-outline-secondary" data-act="down" title="' + escapeHtml(t('chain.down')) + '" aria-label="' + escapeHtml(t('chain.down')) + '"' + (i === chain.length - 1 ? ' disabled' : '') + '><i class="bi bi-arrow-down"></i></button>' +
                '<button type="button" class="btn btn-outline-danger" data-act="remove" title="' + escapeHtml(t('chain.remove')) + '" aria-label="' + escapeHtml(t('chain.remove')) + '"><i class="bi bi-trash"></i></button>' +
            '</div></div>';
    }).join('');
}

function setActiveProvider(provider) {
    selectedProvider = provider;
    document.querySelectorAll('[data-provider]').forEach((tab) => {
        const active = tab.dataset.provider === provider;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    ['openrouter', 'cloudflare', 'openai'].forEach((name) => {
        const panel = document.getElementById('panel-' + name);
        if (panel) panel.classList.toggle('d-none', name !== provider);
    });
}

function readProvider(provider) {
    if (provider === 'openrouter') return document.getElementById('orKey').value.trim() !== '';
    if (provider === 'cloudflare') return document.getElementById('cfAccount').value.trim() !== '' && document.getElementById('cfToken').value.trim() !== '';
    if (provider === 'openai') return document.getElementById('oaBase').value.trim() !== '' && document.getElementById('oaKey').value.trim() !== '';
    return false;
}

function updateReadyDots() {
    document.querySelectorAll('[data-provider]').forEach((tab) => {
        const dot = tab.querySelector('.tab-ready');
        if (dot) dot.classList.toggle('d-none', !readProvider(tab.dataset.provider));
    });
}

const testTimers = {};

function clearTest(provider) {
    if (testTimers[provider]) {
        clearTimeout(testTimers[provider]);
        testTimers[provider] = null;
    }
    const result = document.getElementById('testResult-' + provider);
    if (result) {
        result.textContent = '';
        result.className = 'small';
    }
    const button = document.querySelector('[data-test="' + provider + '"]');
    if (button) {
        button.disabled = false;
        const label = button.querySelector('span');
        if (label) label.textContent = t('cred.test');
    }
}

function clearAllTests() {
    ['openrouter', 'cloudflare', 'openai'].forEach(clearTest);
}

function testProvider(provider) {
    const button = document.querySelector('[data-test="' + provider + '"]');
    const result = document.getElementById('testResult-' + provider);
    if (!result || (button && button.disabled)) return;
    if (!readProvider(provider)) {
        result.className = 'small text-warning-emphasis';
        result.textContent = t('cred.testMissing');
        return;
    }
    const label = button ? button.querySelector('span') : null;
    if (button) button.disabled = true;
    if (label) label.textContent = t('cred.testing');
    result.className = 'small text-muted';
    result.textContent = '';
    testTimers[provider] = setTimeout(() => {
        testTimers[provider] = null;
        if (button) button.disabled = false;
        if (label) label.textContent = t('cred.test');
        result.className = 'small text-success';
        result.textContent = t('cred.testOk');
    }, 600);
}

function showResult(key, type, params) {
    const box = document.getElementById('saveResult');
    box.className = 'alert alert-' + type + ' py-2 px-3 mt-3 mb-0';
    document.getElementById('saveResultText').textContent = t(key, params || {});
}

function clearResult() {
    document.getElementById('saveResult').classList.add('d-none');
}

function clearInvalid() {
    document.querySelectorAll('#chainRows .is-invalid').forEach((el) => el.classList.remove('is-invalid'));
}

function markInvalid(index, field) {
    const row = document.querySelector('.chain-row[data-index="' + index + '"]');
    if (!row) return;
    const el = row.querySelector(field === 'provider' ? 'select' : 'input');
    if (el) el.classList.add('is-invalid');
}

function validate() {
    clearInvalid();
    const touched = [];
    chain.forEach((row, index) => {
        if (row.provider || row.model.trim()) touched.push({ ...row, index });
    });
    if (touched.length === 0) {
        if (document.getElementById('enabled').checked) return { key: 'chain.empty' };
        return null;
    }
    const incomplete = [];
    touched.forEach((row) => {
        if (!row.provider) incomplete.push({ index: row.index, field: 'provider' });
        if (!row.model.trim()) incomplete.push({ index: row.index, field: 'model' });
    });
    if (incomplete.length) return { key: 'chain.incomplete', fields: incomplete };
    for (const row of touched) {
        if (!readProvider(row.provider)) {
            return {
                key: 'chain.needsKey',
                params: { provider: t(PROVIDERS[row.provider].label) },
                fields: [{ index: row.index, field: 'provider' }],
                provider: row.provider,
            };
        }
    }
    return null;
}

document.querySelectorAll('[data-provider]').forEach((tab) => {
    tab.addEventListener('click', () => {
        setActiveProvider(tab.dataset.provider);
        clearAllTests();
    });
});

document.querySelectorAll('.provider-panel input').forEach((input) => {
    input.addEventListener('input', () => {
        updateReadyDots();
        input.classList.remove('is-invalid');
        clearInvalid();
        clearResult();
        clearAllTests();
    });
});

document.querySelectorAll('[data-test]').forEach((button) => {
    button.addEventListener('click', () => testProvider(button.dataset.test));
});

const chainRows = document.getElementById('chainRows');

chainRows.addEventListener('click', (event) => {
    const button = event.target.closest('button[data-act]');
    if (!button) return;
    const row = button.closest('.chain-row');
    const index = Number(row.dataset.index);
    const action = button.dataset.act;
    if (action === 'up' && index > 0) {
        const temp = chain[index - 1];
        chain[index - 1] = chain[index];
        chain[index] = temp;
    } else if (action === 'down' && index < chain.length - 1) {
        const temp = chain[index + 1];
        chain[index + 1] = chain[index];
        chain[index] = temp;
    } else if (action === 'remove') {
        chain.splice(index, 1);
    } else {
        return;
    }
    renderChain();
    clearResult();
});

chainRows.addEventListener('change', (event) => {
    const select = event.target.closest('select[data-act="provider"]');
    if (!select) return;
    const row = select.closest('.chain-row');
    const index = Number(row.dataset.index);
    chain[index].provider = select.value;
    select.classList.remove('is-invalid');
    clearResult();
});

chainRows.addEventListener('input', (event) => {
    const input = event.target.closest('input[data-act="model"]');
    if (!input) return;
    const row = input.closest('.chain-row');
    const index = Number(row.dataset.index);
    chain[index].model = input.value;
    input.classList.remove('is-invalid');
    clearResult();
});

document.getElementById('addModel').addEventListener('click', () => {
    chain.push({ provider: '', model: '' });
    renderChain();
    clearResult();
    const inputs = chainRows.querySelectorAll('input[data-act="model"]');
    if (inputs.length) inputs[inputs.length - 1].focus();
});

document.getElementById('saveBtn').addEventListener('click', () => {
    const error = validate();
    if (error) {
        (error.fields || []).forEach((field) => markInvalid(field.index, field.field));
        if (error.provider) {
            setActiveProvider(error.provider);
            const firstField = { openrouter: 'orKey', cloudflare: 'cfAccount', openai: 'oaBase' }[error.provider];
            const input = document.getElementById(firstField);
            if (input) input.focus();
        } else if (error.fields && error.fields.length) {
            const first = error.fields[0];
            const row = document.querySelector('.chain-row[data-index="' + first.index + '"]');
            const input = row ? row.querySelector(first.field === 'provider' ? 'select' : 'input') : null;
            if (input) input.focus();
        }
        showResult(error.key, 'warning', error.params);
        return;
    }
    showResult('save.ok', 'success');
});

document.getElementById('discardBtn').addEventListener('click', () => {
    resetState();
    showResult('discard.ok', 'secondary');
});

document.getElementById('enabled').addEventListener('change', clearResult);

function resetState() {
    chain = [
        { provider: '', model: '' },
        { provider: '', model: '' },
    ];
    ['orKey', 'cfAccount', 'cfToken', 'oaBase', 'oaKey'].forEach((id) => {
        const input = document.getElementById(id);
        if (input) {
            input.value = '';
            input.classList.remove('is-invalid');
        }
    });
    document.getElementById('enabled').checked = false;
    clearAllTests();
    clearResult();
    clearInvalid();
    setActiveProvider('openrouter');
    renderChain();
    updateReadyDots();
}

function setLang(next) {
    lang = next;
    const rtl = next === 'ar';
    document.documentElement.lang = next;
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';
    document.getElementById('bsLtr').disabled = rtl;
    document.getElementById('bsRtl').disabled = !rtl;
    document.getElementById('langEn').className = 'btn ' + (rtl ? 'btn-outline-light' : 'btn-light');
    document.getElementById('langAr').className = 'btn ' + (rtl ? 'btn-light' : 'btn-outline-light');
    applyI18n();
    renderChain();
    clearAllTests();
    clearResult();
    updateReadyDots();
}

document.getElementById('langEn').addEventListener('click', () => setLang('en'));
document.getElementById('langAr').addEventListener('click', () => setLang('ar'));

applyI18n();
setActiveProvider('openrouter');
renderChain();
updateReadyDots();
</script>
</body>
</html>
