<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare Clinic</title>
</head>
<body class="bg-light" x-data="app()" x-init="init()">

    <div class="page-loader" x-show="loading" x-cloak>
        <div class="spinner"></div>
    </div>

    <div x-show="!loading" x-cloak>

        <!-- NAVBAR (desktop) -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4" x-show="isLoggedIn">
            <div class="container">
                <span class="navbar-brand" @click="navigate('dashboard')" style="cursor:pointer" :aria-label="t('Dashboard')">
                    <i class="bi bi-heart-pulse-fill"></i>
                </span>
                <!-- Global patient search: one box, no options. Lives outside the
                     collapse so it stays visible in the top bar on mobile instead of
                     hiding behind the hamburger. -->
                <div class="global-search position-relative" @click.outside="closeGlobalSearch({ clearFocus: true })">
                        <div class="position-relative">
                            <i class="bi bi-search global-search-icon" aria-hidden="true"></i>
                            <input
                                type="search"
                                class="form-control global-search-input"
                                x-model="globalSearch"
                                @input.debounce="onGlobalInput()"
                                @focus="globalSearchFocused = true"
                                @keydown="onGlobalKeydown($event)"
                                :placeholder="t('Search patients...')"
                                :aria-label="t('Search patients...')"
                                autocomplete="off"
                            >
                            <span class="global-search-spinner spinner-border spinner-border-sm text-light" x-show="globalSearchLoading" x-cloak></span>
                        </div>
                        <div class="global-search-menu list-group shadow" x-show="globalSearchFocused && globalSearch && (globalSuggestions().length || globalSearchLoading)" x-cloak>
                            <template x-for="(patient, index) in globalSuggestions()" :key="patient.id">
                                <button type="button" class="list-group-item list-group-item-action global-search-item"
                                    :class="{ 'active': index === globalSearchSelectedIndex }"
                                    @click="pickGlobalResult(patient)"
                                    @mousemove="globalSearchSelectedIndex = index"
                                >
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-person-circle text-primary fs-5"></i>
                                        <div class="flex-grow-1 text-start">
                                            <div class="fw-semibold" x-text="patient.name"></div>
                                            <div class="small text-muted d-flex flex-wrap gap-2">
                                                <span x-show="patient.national_id"><i class="bi bi-credit-card-2-front"></i> <span x-text="patient.national_id"></span></span>
                                                <span x-show="patient.mobile"><i class="bi bi-telephone"></i> <span x-text="patient.mobile"></span></span>
                                                <span x-show="patient.section"><i class="bi bi-building"></i> <span x-text="optionLabel('section', patient.section)"></span></span>
                                                <span x-show="patient.governorate"><i class="bi bi-geo-alt"></i> <span x-text="patient.governorate"></span></span>
                                            </div>
                                        </div>
                                        <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'" x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                    </div>
                                </button>
                            </template>
                            <button type="button" class="list-group-item list-group-item-action text-primary fw-semibold global-search-item" @click="runGlobalList()">
                                <i class="bi bi-arrow-right-short"></i>
                                <span x-text="t('See all results')"></span>
                            </button>
                        </div>
                    </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'dashboard' }" @click="navigate('dashboard')" style="cursor:pointer">
                                <i class="bi bi-speedometer2 me-1"></i><span x-text="t('Dashboard')"></span>
                            </span>
                        </li>
                        <li class="nav-item" x-show="isSuperAdmin">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'users' }" @click="navigate('users')" style="cursor:pointer">
                                <i class="bi bi-person-badge me-1"></i><span x-text="t('Users')"></span>
                            </span>
                        </li>
                        <li class="nav-item" x-show="isSuperAdmin">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'prices' }" @click="navigate('prices')" style="cursor:pointer">
                                <i class="bi bi-currency-dollar me-1"></i><span x-text="t('Prices')"></span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'patients' }" @click="navigate('patients')" style="cursor:pointer">
                                <i class="bi bi-people me-1"></i><span x-text="t('Patients')"></span>
                            </span>
                        </li>
                        <li class="nav-item ms-2 dropdown">
                            <a class="nav-link px-2 dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" :title="profile?.name || user?.email || 'User'" :aria-label="profile?.name || user?.email || 'User'">
                                <i class="bi bi-person-circle fs-5"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <span class="dropdown-item-text fw-semibold small" x-text="profile?.name || user?.email || 'User'"></span>
                                </li>
                                <li>
                                    <span class="dropdown-item-text text-muted small" x-text="user?.email"></span>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li x-show="isSuperAdmin">
                                    <button type="button" class="dropdown-item" :class="{ active: currentPage === 'settings' }" @click="navigate('settings')">
                                        <i class="bi bi-gear me-2"></i><span x-text="t('Settings')"></span>
                                    </button>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <button class="dropdown-item text-danger" @click="logout()">
                                        <i class="bi bi-box-arrow-right me-2"></i><span x-text="t('Logout')"></span>
                                    </button>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item ms-2">
                            <button class="btn btn-sm btn-outline-light fw-semibold" @click="toggleLocale()">
                                <i class="bi bi-translate me-1"></i><span x-text="localeLabel"></span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container page-container">

            <!-- Global alert bar (showAlert). Auto-hides after a few seconds. -->
            <div class="alert alert-dismissible fade show" :class="'alert-' + alertType" x-show="alertMessage" x-cloak x-transition role="alert" aria-live="polite">
                <span x-text="alertMessage"></span>
                <button type="button" class="btn-close" @click="alertMessage = null" aria-label="Close"></button>
            </div>

            <!-- LOGIN PAGE -->
            <div x-show="currentPage === 'login'" x-cloak>
                <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
                    <div>
                        <a href="#" @click.prevent="navigate('dashboard')" x-cloak>
                            <i class="bi bi-heart-pulse-fill text-muted" style="font-size:3.5rem"></i>
                        </a>
                    </div>
                    <div class="w-100 mt-4 px-4 py-4 bg-white shadow overflow-hidden rounded" style="max-width: 28rem;">
                        <form @submit.prevent="handleLogin()">
                            <div class="alert alert-danger py-2" x-show="loginError" x-cloak x-transition role="alert" aria-live="assertive">
                                <div class="d-flex align-items-start gap-2">
                                    <i class="bi bi-exclamation-circle-fill mt-1"></i>
                                    <span x-text="loginError"></span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" x-text="t('Email')"></label>
                                <input id="email" type="email" class="form-control" x-model="loginForm.email" required autofocus autocomplete="username">
                            </div>
                            <div class="mt-4 mb-3">
                                <label class="form-label" x-text="t('Password')"></label>
                                <input id="password" type="password" class="form-control" x-model="loginForm.password" required autocomplete="current-password">
                            </div>
                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-primary" :disabled="loginLoading">
                                    <span x-show="loginLoading" class="spinner-border spinner-border-sm me-1"></span>
                                    <span x-text="t('Log in')"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD PAGE -->
            <div x-show="currentPage === 'dashboard'" x-cloak>
                <!-- Welcome Banner -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h2 class="fw-bold text-secondary mb-0">
                            <i class="bi bi-speedometer2 me-2 text-primary"></i><span x-text="t('Dashboard')"></span>
                        </h2>
                        <small class="text-muted">
                            <span x-text="t('Welcome back,')"></span>
                            <strong x-text="profile?.name || user?.email"></strong>
                            <span>(<span x-text="roleLabel()"></span>)</span>
                        </small>
                    </div>
                    <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i><span x-text="currentDate"></span></span>
                </div>

                <!-- Stats Cards -->
                <div class="row g-4 mb-4">

                    <!-- Total Patients -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-primary bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-people-fill fs-2 text-primary"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.total"></div>
                                    <div class="text-muted small" x-text="t('Total Patients')"></div>
                                    <span class="text-primary small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('Manage')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Completed -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-check-circle-fill fs-2 text-success"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.completed"></div>
                                    <div class="text-muted small" x-text="t('Completed')"></div>
                                    <span class="text-success small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('View')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pending -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-danger bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-exclamation-circle-fill fs-2 text-danger"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-danger" x-text="stats.pending"></div>
                                    <div class="text-muted small" x-text="t('Pending')"></div>
                                    <span class="text-danger small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('View')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sections: one entry per configured section -->
                    <div class="col-md-3" x-show="isSuperAdmin || profile?.section">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-info bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-buildings fs-2 text-info"></i>
                                </div>
                                <div>
                                    <div class="d-flex flex-wrap align-items-baseline gap-3">
                                        <template x-for="entry in sectionStatEntries()" :key="'sec-' + entry.key">
                                            <div>
                                                <span class="fs-3 fw-bold" :class="'text-' + sectionColor(entry.key)" x-text="entry.count"></span>
                                                <div class="text-muted small" x-text="entry.label"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="text-muted small" x-text="t('By Section')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sources: one entry per configured source of money -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-cash-coin fs-2 text-success"></i>
                                </div>
                                <div>
                                    <div class="d-flex flex-wrap align-items-baseline gap-3">
                                        <template x-for="entry in sourceStatEntries()" :key="'src-' + entry.key">
                                            <div>
                                                <span class="fs-3 fw-bold" :class="'text-' + sourceColor(entry.key)" x-text="entry.count"></span>
                                                <div class="text-muted small" x-text="entry.label"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="text-muted small" x-text="t('By Source of Money')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Recent Patients -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2 text-primary"></i><span x-text="t('Recent Patients')"></span></h5>
                        <a href="#" class="btn btn-sm btn-outline-primary" @click="navigate('patients')"><span x-text="t('View All')"></span></a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient')"></th>
                                        <th class="py-3" x-text="t('Problem')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Visit Date')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in recentPatients" :key="patient.id">
                                        <tr>
                                            <td class="ps-4">
                                                <a href="#" class="fw-semibold text-dark text-decoration-none" @click="showPatient(patient)" x-text="patient.name"></a>
                                            </td>
                                            <td class="text-muted" x-text="patient.problem ? (patient.problem.length > 60 ? patient.problem.substring(0,60)+'…' : patient.problem) : '—'"></td>
                                            <td>
                                                <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'">
                                                    <span x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <template x-if="patient.visit_date">
                                                    <span class="badge bg-light text-dark border" x-text="formatDate(patient.visit_date)"></span>
                                                </template>
                                                <template x-if="!patient.visit_date">
                                                    <span class="text-muted small">—</span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="recentPatients.length === 0">
                                        <td colspan="4" class="text-center py-4 text-muted" x-text="t('No patients recorded yet.')"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PATIENTS PAGE -->
            <div x-show="currentPage === 'patients'" x-cloak>
                <div class="row mb-4 align-items-center">
                    <div class="col-md-6">
                        <h2 class="text-secondary fw-bold mb-0">
                            <i class="bi bi-people-fill me-2 text-primary"></i><span x-text="t('Patients Management')"></span>
                        </h2>
                    </div>
                    <div class="col-md-6 text-end">
                        <!-- Excel group: the main half exports in one click.
                             The side arrow (Export again + AI Import) is
                             hidden when AI import is disabled via the
                             ai_settings toggle (issue #10). -->
                        <div class="btn-group shadow-sm me-2">
                            <button class="btn btn-success" @click="exportPatients()" :disabled="exporting"
                                :style="!aiImportEnabled && { borderTopRightRadius: 'var(--bs-border-radius)', borderBottomRightRadius: 'var(--bs-border-radius)' }">
                                <span x-show="exporting" class="spinner-border spinner-border-sm me-1" x-cloak></span>
                                <i class="bi bi-file-earmark-spreadsheet me-1" x-show="!exporting"></i>
                                <span x-text="exporting ? t('Preparing...') : t('Excel')"></span>
                            </button>
                            <button type="button" class="btn btn-success dropdown-toggle dropdown-toggle-split" x-show="aiImportEnabled" x-cloak data-bs-toggle="dropdown" aria-expanded="false" :aria-label="t('Excel')">
                                <span class="visually-hidden" x-text="t('Excel')"></span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <button class="dropdown-item" type="button" @click="exportPatients()" :disabled="exporting">
                                        <i class="bi bi-download me-2"></i><span x-text="t('Export')"></span>
                                    </button>
                                </li>
                                <li x-show="aiImportEnabled">
                                    <button class="dropdown-item" type="button" @click="openAiImport()">
                                        <i class="bi bi-stars me-2"></i><span x-text="t('Import')"></span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                        <!-- Add New Patient as the primary action; AI import also
                             lives in its dropdown instead of competing for
                             space. The split's right half disappears when AI
                             import is disabled via the ai_settings toggle
                             (issue #10). -->
                        <div class="btn-group shadow-sm me-2">
                            <button class="btn btn-primary" @click="openPatientForm()"
                                :style="!aiImportEnabled && { borderTopRightRadius: 'var(--bs-border-radius)', borderBottomRightRadius: 'var(--bs-border-radius)' }">
                                <i class="bi bi-person-plus-fill me-1"></i> <span x-text="t('Add New Patient')"></span>
                            </button>
                            <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split" x-show="aiImportEnabled" x-cloak data-bs-toggle="dropdown" aria-expanded="false" :aria-label="t('Import from file or paste')">
                                <span class="visually-hidden" x-text="t('Import from file or paste')"></span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li x-show="aiImportEnabled">
                                    <button class="dropdown-item" type="button" @click="openAiImport()">
                                        <i class="bi bi-stars me-2"></i><span x-text="t('Import from file or paste')"></span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <form @submit.prevent="handleFilter()" class="mb-4">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label text-muted small mb-1" x-text="t('Search')"></label>
                            <input type="text" class="form-control form-control-sm shadow-sm" x-model="patientFilters.search" :placeholder="t('Search any patient field...')">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1" x-text="t('Status')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.is_completed">
                                <option value="">All</option>
                                <option value="false" x-text="t('Pending')"></option>
                                <option value="true" x-text="t('Completed')"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1"><i class="bi bi-calendar-event me-1"></i><span x-text="t('Registered From')"></span></label>
                            <input type="date" class="form-control form-control-sm shadow-sm" x-model="patientFilters.date_from">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1"><i class="bi bi-calendar-event-fill me-1"></i><span x-text="t('Registered To')"></span></label>
                            <input type="date" class="form-control form-control-sm shadow-sm" x-model="patientFilters.date_to">
                        </div>
                        <div class="col-md-1 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100 shadow-sm"><i class="bi bi-search"></i></button>
                            <button type="button" class="btn btn-outline-secondary btn-sm shadow-sm" @click="resetFilters()"><i class="bi bi-x-lg"></i></button>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Follower')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.follower">
                                <option value="" x-text="t('-- All Followers --')"></option>
                                <template x-for="opt in activeOptions('follower')" :key="'fl-' + opt.key">
                                    <option :value="opt.key" x-text="optionLabel('follower', opt.key)"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Section')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.section">
                                <option value="" x-text="t('-- All Sections --')"></option>
                                <template x-for="opt in activeOptions('section')" :key="'fs-' + opt.key">
                                    <option :value="opt.key" x-text="optionLabel('section', opt.key)"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Source of Money')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.source_of_money">
                                <option value="" x-text="t('-- All Sources --')"></option>
                                <template x-for="opt in activeOptions('source')" :key="'fo-' + opt.key">
                                    <option :value="opt.key" x-text="optionLabel('source', opt.key)"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                </form>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light border-bottom text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient Name')"></th>
                                        <th class="py-3" x-text="t('National ID')"></th>
                                        <th class="py-3" x-text="t('Mobile No.')"></th>
                                        <th class="py-3" x-text="t('Governorate')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Follower')"></th>
                                        <th class="py-3" x-text="t('Source')"></th>
                                        <th class="py-3" x-text="t('Section')"></th>
                                        <th class="py-3" x-text="t('Registered Date')"></th>
                                        <th class="text-end pe-4 py-3" x-text="t('Actions')"></th>
                                    </tr>

                                </div>

                                <hr class="text-muted opacity-25">

                                <div class="vstack gap-3">
                                    <div>
                                        <small class="text-muted d-block fw-semibold" x-text="t('National ID')"></small>
                                        <span class="fw-bold text-dark"><code x-text="selectedPatient?.national_id"></code></span>
                                    </div>

                                    <div>
                                        <small class="text-muted d-block fw-semibold" x-text="t('Mobile Number')"></small>
                                        <template x-if="selectedPatient?.mobile">
                                            <span class="fw-semibold text-dark"><i class="bi bi-telephone me-1 text-muted"></i><span x-text="selectedPatient?.mobile"></span></span>
                                        </template>
                                        <template x-if="!selectedPatient?.mobile">
                                            <span class="text-muted font-monospace"><em x-text="t('Not Provided')"></em></span>
                                        </template>
                                    </div>

                                    <div class="row g-0">
                                        <div class="col-6">
                                            <small class="text-muted d-block fw-semibold" x-text="t('Date of Birth')"></small>
                                            <span class="fw-semibold text-dark" x-text="selectedPatient?.date_of_birth || 'N/A'"></span>
                                        </div>
                                        <div class="col-6">
                                            <small class="text-muted d-block fw-semibold" x-text="t('Marital Status')"></small>
                                            <span class="fw-semibold text-dark" x-text="selectedPatient?.marital_status ? t(selectedPatient.marital_status.charAt(0).toUpperCase() + selectedPatient.marital_status.slice(1)) : 'N/A'"></span>
                                        </div>
                                    </div>

                                    <div>
                                        <small class="text-muted d-block fw-semibold" x-text="t('Age')"></small>
                                        <span class="fw-semibold text-dark" x-text="patientAgeOf(selectedPatient)"></span>
                                    </div>

                                    <div>
                                        <small class="text-muted d-block fw-semibold" x-text="t('Dependents / Children')"></small>
                                        <span class="fw-semibold text-dark"><span x-text="selectedPatient?.children_count ?? '0'"></span> <span x-text="t('child(ren)')"></span></span>
                                    </div>

                                    <div>
                                        <small class="text-muted d-block fw-semibold" x-text="t('Governorate')"></small>
                                        <span class="badge bg-light text-dark border"><i class="bi bi-geo-alt text-danger me-1"></i><span x-text="selectedPatient?.governorate || 'N/A'"></span></span>
                                    </div>

                                    <div>
                                        <small class="text-muted d-block fw-semibold" x-text="t('Home Address')"></small>
                                        <p class="mb-0 text-secondary bg-light p-2 rounded border-start border-primary border-3" style="font-size: 0.85rem;">
                                            <span x-text="selectedPatient?.address || t('No physical address listed.')"></span>
                                        </p>
                                    </div>
                                </div>

                                <hr class="text-muted opacity-25">

                                <div class="bg-light p-2 rounded text-center">
                                    <small class="text-muted"><span x-text="t('Registered by:')"></span> <strong x-text="selectedPatient?.user_name || 'System'"></strong></small>
                                </div>

                                <template x-if="selectedPatient?.follower || selectedPatient?.price">
                                    <div class="vstack gap-2 mt-2">
                                        <template x-if="selectedPatient?.follower">
                                            <div>
                                                <small class="text-muted d-block fw-semibold" x-text="t('Follower')"></small>
                                                <span class="fw-semibold text-dark" dir="rtl">
                                                    <i class="bi bi-person-check-fill text-info me-1"></i><span x-text="followerLabel(selectedPatient?.follower)"></span>
                                                </span>
                                            </div>
                                        </template>
                                        <template x-if="selectedPatient?.price">
                                            <div>
                                                <small class="text-muted d-block fw-semibold" x-text="t('Price')"></small>
                                                <span class="fw-semibold text-dark">
                                                    <i class="bi bi-cash-stack text-success me-1"></i><span x-text="formatMoney(selectedPatient?.price)"></span> EGP
                                                </span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-8">
                        <h4 class="fw-bold text-dark mb-3">
                            <i class="bi bi-clipboard2-pulse me-2 text-primary"></i><span x-text="t('Consultation Record')"></span>
                        </h4>

                        <div class="card shadow-sm border-0 bg-white">
                            <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3">
                                <h6 class="mb-0 fw-semibold text-dark">
                                    <i class="bi bi-calendar-event me-2 text-success"></i>
                                    <template x-if="selectedPatient?.visit_date">
                                        <span x-text="formatDate(selectedPatient.visit_date)"></span>
                                    </template>
                                    <template x-if="!selectedPatient?.visit_date">
                                        <span x-text="t('Date Unspecified')"></span>
                                    </template>
                                </h6>
                                <span class="badge px-3 py-2" :class="selectedPatient?.is_completed ? 'bg-success' : 'bg-secondary'">
                                    <template x-if="selectedPatient?.is_completed">
                                        <i class="bi bi-check-circle-fill me-1"></i><span x-text="t('Completed')"></span>
                                    </template>
                                    <template x-if="!selectedPatient?.is_completed">
                                        <i class="bi bi-hourglass-split me-1"></i><span x-text="t('Pending')"></span>
                                    </template>
                                </span>
                            </div>

                            <div class="card-body p-4 vstack gap-4">
                                <div>
                                    <h6 class="text-danger fw-bold mb-2">
                                        <i class="bi bi-exclamation-circle-fill me-1"></i><span x-text="t('Presented Symptoms / Problem')"></span>
                                    </h6>
                                    <div class="bg-light p-3 rounded border-start border-danger border-3 text-secondary" style="white-space: pre-line; min-height: 60px;">
                                        <span x-text="selectedPatient?.problem || '—'"></span>
                                    </div>
                                </div>

                                <div>
                                    <h6 class="text-success fw-bold mb-2">
                                        <i class="bi bi-prescription2 me-1"></i><span x-text="t('Diagnosis & Treatment Plan')"></span>
                                    </h6>
                                    <div class="bg-light p-3 rounded border-start border-success border-3 text-secondary" style="white-space: pre-line; min-height: 60px;">
                                        <span x-text="selectedPatient?.solution || '—'"></span>
                                    </div>
                                </div>

                                <template x-if="(selectedPatient?.notes || []).filter(n => n).length > 0">
                                    <div>
                                        <h6 class="text-secondary fw-bold mb-2">
                                            <i class="bi bi-sticky me-1"></i><span x-text="t('Internal Clinic Notes')"></span>
                                        </h6>
                                        <div class="vstack gap-2">
                                            <template x-for="note in (selectedPatient?.notes || []).filter(n => n)" :key="note">
                                                <div class="bg-light p-3 rounded border-start border-secondary border-3 text-secondary" style="white-space: pre-line;">
                                                    <em x-text="note"></em>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <template x-if="(selectedPatient?.attachments || []).length > 0">
                                    <div>
                                        <h6 class="text-primary fw-bold mb-2">
                                            <i class="bi bi-paperclip me-1"></i><span x-text="t('Attachments')"></span>
                                        </h6>
                                        <div class="row g-2">
                                            <template x-for="(att, idx) in (selectedPatient?.attachments || [])" :key="att.public_id || idx">
                                                <div class="col-6 col-md-4">
                                                    <a :href="attachmentFullUrl(att)" target="_blank" rel="noopener" class="d-block border rounded overflow-hidden text-decoration-none bg-white">
                                                        <template x-if="attachmentIsImage(att)">
                                                            <img :src="attachmentUrl(att, 400)" class="w-100" style="height: 110px; object-fit: cover;" :alt="att.name">
                                                        </template>
                                                        <template x-if="!attachmentIsImage(att)">
                                                            <div class="d-flex flex-column align-items-center justify-content-center bg-light" style="height: 110px;">
                                                                <i class="bi bi-file-earmark-pdf-fill text-danger fs-1"></i>
                                                            </div>
                                                        </template>
                                                        <div class="small text-secondary text-truncate px-2 py-1 border-top" x-text="att.name"></div>
                                                    </a>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI IMPORT PAGE (3 steps: Add data -> Review -> Done) -->
            <div x-show="currentPage === 'ai-import'" x-cloak @paste.prevent="onAiPaste($event)" @dragover.prevent="aiDragOver = true" @dragleave="aiDragOver = false">
                <div class="row justify-content-center">
                    <div class="col-lg-10 col-md-11">

                        <!-- step header -->
                        <a href="#" class="btn btn-link text-decoration-none mb-2 p-0" @click="navigate('patients')">
                            <i class="bi bi-arrow-left"></i> <span x-text="t('Back to Patients Directory')"></span>
                        </a>
                        <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
                            <template x-for="(step, i) in ['Add data', 'Review', 'Done']" :key="i">
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge rounded-pill px-3 py-2"
                                        :class="aiStepIndex() >= i ? 'bg-primary' : 'bg-secondary-subtle text-secondary'"
                                        style="font-size:.8rem">
                                        <span x-text="`${i + 1}. ${t(step)}`"></span>
                                    </span>
                                    <i class="bi bi-chevron-right text-muted" x-show="i < 2" x-cloak></i>
                                </div>
                            </template>
                        </div>

                        <!-- ================= STEP 1: ADD DATA ================= -->
                        <div class="card shadow border-0" x-show="aiStep === 'add'" x-cloak>
                            <div class="card-header bg-primary text-white py-3">
                                <div class="fw-semibold"><i class="bi bi-stars me-2"></i><span x-text="t('AI Import')"></span></div>
                                <div class="small opacity-75" x-text="t('Files or text in, patients out — review every row before anything is saved.')"></div>
                            </div>
                            <div class="card-body">

                                <!-- dropzone: drag, paste anywhere on this page, or click -->
                                <div class="ai-dropzone p-4 rounded-3 text-center mb-3"
                                    :class="{ 'ai-dropzone-active': aiDragOver }"
                                    role="button" tabindex="0"
                                    @click="$refs.aiFileInput.click()"
                                    @keydown.enter.prevent="$refs.aiFileInput.click()"
                                    @drop.prevent="onAiDrop($event)">
                                    <input x-ref="aiFileInput" type="file" class="d-none" multiple
                                        @change="onAiFilesPicked($event)"
                                        accept=".xlsx,.xls,.csv,.png,.jpg,.jpeg,.webp,.gif,.pdf,.docx,.txt,.md,.json,image/*">
                                    <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
                                    <div class="fw-semibold mt-2" x-text="t('Drop files here, paste, or click to browse')"></div>
                                    <div class="small text-muted" x-text="t('Excel, CSV, photos, Word, PDF, text — anything with patient info.')"></div>
                                </div>

                                <!-- attachment chips -->
                                <div class="d-flex flex-wrap gap-2 mb-3" x-show="aiFiles.length" x-cloak>
                                    <template x-for="(chip, i) in aiFiles" :key="chip.id">
                                        <span class="badge bg-secondary-subtle text-dark d-flex align-items-center gap-2 px-2 py-2">
                                            <i class="bi" :class="aiChipIcon(chip)"></i>
                                            <span x-text="chip.name"></span>
                                            <span class="text-muted small" x-text="formatAiSize(chip.size)"></span>
                                            <button type="button" class="btn-close btn-close-black" style="font-size:.6em"
                                                @click="aiFiles.splice(i, 1)" :aria-label="t('Remove')"></button>
                                        </span>
                                    </template>
                                </div>

                                <!-- pasted / typed details -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold" for="ai-typed-text" x-text="t('Or type / paste patient details')"></label>
                                    <textarea id="ai-typed-text" class="form-control" rows="4" x-model="aiText"
                                        :placeholder="t('One record per line works best — name, national ID, mobile, complaint.')"></textarea>
                                </div>

                                <!-- mobile camera shortcut -->
                                <button type="button" class="btn btn-outline-primary mb-3 d-lg-none" @click="$refs.aiCameraInput.click()">
                                    <i class="bi bi-camera me-1"></i><span x-text="t('Take photo')"></span>
                                </button>
                                <input x-ref="aiCameraInput" type="file" accept="image/*" capture="environment" class="d-none" @change="onAiFilesPicked($event)">

                                <!-- optional instructions -->
                                <button type="button" class="btn btn-link btn-sm text-decoration-none p-0 mb-2"
                                    @click="aiShowInstructions = !aiShowInstructions">
                                    <i class="bi" :class="aiShowInstructions ? 'bi-dash-circle' : 'bi-plus-circle'"></i>
                                    <span x-text="t('Optional: instructions for the AI')"></span>
                                </button>
                                <textarea class="form-control mb-2" rows="2" x-show="aiShowInstructions" x-cloak x-model="aiInstructions"
                                    :placeholder="t('e.g. skip rows without a national ID; the third column is the mobile number')"></textarea>

                                <div class="small text-muted mb-3">
                                    <i class="bi bi-shield-lock me-1"></i>
                                    <span x-text="t('Patient data is sent to the AI provider for extraction.')"></span>
                                </div>

                                <!-- extract / progress -->
                                <div class="d-flex align-items-center gap-3 flex-wrap">
                                    <button type="button" class="btn btn-primary" @click="extractPatients()"
                                        :disabled="!aiCanExtract() || aiExtracting">
                                        <i class="bi bi-stars me-1"></i><span x-text="t('Extract patients')"></span>
                                    </button>
                                    <div class="flex-grow-1" style="min-width:200px" x-show="aiExtracting" x-cloak>
                                        <div class="progress" style="height:6px">
                                            <div class="progress-bar progress-bar-striped progress-bar-animated" :style="`width: ${aiProgressPercent()}%`"></div>
                                        </div>
                                        <div class="small text-muted mt-1 d-flex align-items-center gap-2">
                                            <span class="spinner-border spinner-border-sm"></span>
                                            <span x-text="aiProgressLabel"></span>
                                        </div>
                                    </div>
                                    <button type="button" class="btn btn-outline-danger btn-sm" x-show="aiExtracting" x-cloak @click="cancelAiExtraction()">
                                        <i class="bi bi-x-circle me-1"></i><span x-text="t('Cancel')"></span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- ================= STEP 2: REVIEW ================= -->
                        <div class="card shadow border-0" x-show="aiStep === 'review'" x-cloak>
                            <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
                                <h5 class="mb-0 fw-semibold">
                                    <i class="bi bi-clipboard-check me-2 text-success"></i><span x-text="t('Review')"></span>
                                    <span class="badge bg-secondary ms-1" x-text="aiRows.length"></span>
                                </h5>
                                <div class="btn-group">
                                    <button class="btn btn-sm" :class="aiFilter === 'all' ? 'btn-primary' : 'btn-outline-primary'" @click="aiFilter = 'all'">
                                        <span x-text="t('All')"></span> (<span x-text="aiRows.length"></span>)
                                    </button>
                                    <button class="btn btn-sm" :class="aiFilter === 'attention' ? 'btn-primary' : 'btn-outline-primary'" @click="aiFilter = 'attention'">
                                        <span x-text="t('Needs attention')"></span> (<span x-text="attentionCount()"></span>)
                                    </button>
                                </div>
                            </div>
                            <div class="card-body p-0">
                                <!-- Parts whose extraction failed: never silent (issue #11).
                                     Lists each part + its error and retries just those parts. -->
                                <div class="px-3 pt-3" x-show="aiPartFailures.length" x-cloak>
                                    <div class="alert alert-warning d-flex align-items-start gap-2 mb-0">
                                        <i class="bi bi-exclamation-triangle-fill mt-1"></i>
                                        <div class="flex-grow-1">
                                            <div class="fw-semibold" x-text="t(':count extraction part(s) failed — patients from those parts were not extracted.', { count: aiPartFailures.length })"></div>
                                            <ul class="small mb-2 mt-1 ps-3" style="max-height: 120px; overflow: auto">
                                                <template x-for="(fail, i) in aiPartFailures" :key="'ai-fail-' + i">
                                                    <li><span class="fw-semibold" x-text="fail.label"></span> — <span x-text="fail.error"></span></li>
                                                </template>
                                            </ul>
                                            <button type="button" class="btn btn-sm btn-warning" @click="retryFailedParts()" :disabled="aiRetrying">
                                                <span x-show="aiRetrying" class="spinner-border spinner-border-sm me-1"></span>
                                                <i class="bi bi-arrow-clockwise me-1" x-show="!aiRetrying"></i>
                                                <span x-text="t('Retry failed parts')"></span>
                                            </button>
                                        </div>
                                        <button type="button" class="btn-close" :aria-label="t('Close')" @click="aiPartFailures = []"></button>
                                    </div>
                                </div>
                                <!-- defaults: applied to every row below, but only to blank fields -->
                                <div class="px-3 pt-3">
                                    <div class="border rounded-3 p-3 bg-light">
                                        <div class="fw-semibold mb-2"><i class="bi bi-sliders me-1"></i><span x-text="t('Apply to every patient')"></span>
                                            <span class="small text-muted fw-normal" x-text="t('(only fill blank fields)')"></span>
                                        </div>
                                        <div class="row g-2">
                                            <div class="col-md-3">
                                                <label class="form-label small text-muted mb-1" x-text="t('Section')"></label>
                                                <select class="form-select form-select-sm" x-model="aiDefaults.section" :disabled="aiSectionLocked()" @change="applyAiDefaultsToRows()">
                                                    <option value="">-- Select --</option>
                                                    <template x-for="opt in activeOptions('section')" :key="'ai-default-sec-' + opt.key">
                                                        <option :value="opt.key" x-text="optionLabel('section', opt.key)"></option>
                                                    </template>
                                                </select>
                                                <div class="small text-danger mt-1" x-show="needSectionChoice() && !aiDefaults.section" x-cloak
                                                    x-text="t('Choose a section before saving')"></div>
                                                <div class="small text-muted mt-1" x-show="aiSectionLocked()" x-text="t('Your account is assigned to this section')"></div>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label small text-muted mb-1" x-text="t('Source of Money')"></label>
                                                <select class="form-select form-select-sm" x-model="aiDefaults.source_of_money" @change="applyAiDefaultsToRows()">
                                                    <option value="">-- Select --</option>
                                                    <template x-for="opt in activeOptions('source')" :key="'ai-default-src-' + opt.key">
                                                        <option :value="opt.key" x-text="optionLabel('source', opt.key)"></option>
                                                    </template>
                                                </select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label small text-muted mb-1" x-text="t('Follower')"></label>
                                                <select class="form-select form-select-sm" x-model="aiDefaults.follower" @change="applyAiDefaultsToRows()">
                                                    <option value="">-- Select --</option>
                                                    <template x-for="(label, key) in followerOptions" :key="key">
                                                        <option :value="key" x-text="label"></option>
                                                    </template>
                                                </select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label small text-muted mb-1" x-text="t('Visit Date')"></label>
                                                <input type="date" class="form-control form-control-sm" x-model="aiDefaults.visit_date" @change="applyAiDefaultsToRows()">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- toolbar -->
                                <div class="d-flex flex-wrap gap-2 align-items-center px-3 py-2 border-bottom bg-light">
                                    <button class="btn btn-sm btn-outline-secondary" @click="addReviewRow()">
                                        <i class="bi bi-plus-lg me-1"></i><span x-text="t('Add row')"></span>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" @click="deleteSelectedRows()" :disabled="!selectedRowCount()">
                                        <i class="bi bi-trash me-1"></i><span x-text="t('Delete selected')"></span>
                                    </button>
                                    <div class="dropdown">
                                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" :disabled="!selectedRowCount()">
                                            <i class="bi bi-pencil me-1"></i><span x-text="t('Set value for selected rows')"></span>
                                        </button>
                                        <ul class="dropdown-menu p-2" style="min-width: 230px">
                                            <li class="px-2 py-1">
                                                <label class="small text-muted" x-text="t('Field')"></label>
                                                <select class="form-select form-select-sm" x-model="aiBulkField">
                                                    <option value="source_of_money" x-text="t('Source of Money')"></option>
                                                    <option value="follower" x-text="t('Follower')"></option>
                                                    <option value="visit_date" x-text="t('Visit Date')"></option>
                                                    <option value="section" x-text="t('Section')" x-show="isSuperAdmin"></option>
                                                </select>
                                            </li>
                                            <li class="px-2 py-1">
                                                <label class="small text-muted" x-text="t('Value')"></label>
                                                <!-- The value widget follows the chosen field: canonical
                                                     keys for section/source/follower, ISO date for the
                                                     visit date — a bulk set can never write junk. -->
                                                <select class="form-select form-select-sm" x-show="aiBulkField === 'section'" x-cloak x-model="aiBulkValue">
                                                    <option value="">--</option>
                                                    <template x-for="opt in activeOptions('section')" :key="'ai-bulk-sec-' + opt.key">
                                                        <option :value="opt.key" x-text="optionLabel('section', opt.key)"></option>
                                                    </template>
                                                </select>
                                                <select class="form-select form-select-sm" x-show="aiBulkField === 'source_of_money'" x-cloak x-model="aiBulkValue">
                                                    <option value="">--</option>
                                                    <template x-for="opt in activeOptions('source')" :key="'ai-bulk-src-' + opt.key">
                                                        <option :value="opt.key" x-text="optionLabel('source', opt.key)"></option>
                                                    </template>
                                                </select>
                                                <select class="form-select form-select-sm" x-show="aiBulkField === 'follower'" x-cloak x-model="aiBulkValue">
                                                    <option value="">--</option>
                                                    <template x-for="(label, key) in followerOptions" :key="'ai-bulk-fl-' + key">
                                                        <option :value="key" x-text="label"></option>
                                                    </template>
                                                </select>
                                                <input type="date" class="form-control form-control-sm" x-show="aiBulkField === 'visit_date'" x-cloak x-model="aiBulkValue">
                                            </li>
                                            <li class="px-2"><button class="btn btn-sm btn-primary w-100 mt-1" @click="applyBulkValue()"><span x-text="t('Apply')"></span></button></li>
                                        </ul>
                                    </div>
                                </div>

                                <!-- review table -->
                                <div class="table-responsive" style="max-height: 55vh">
                                    <table class="table table-sm table-hover align-middle mb-0">
                                        <thead class="table-light sticky-top">
                                            <tr>
                                                <th style="width:32px"><input type="checkbox" class="form-check-input" @change="toggleSelectAll($event.target.checked)" :checked="allVisibleSelected()"></th>
                                                <th x-text="t('Status')"></th>
                                                <th style="min-width:150px" x-text="t('Name')"></th>
                                                <th style="min-width:150px" x-text="t('National ID')"></th>
                                                <th style="min-width:120px" x-text="t('Mobile')"></th>
                                                <th style="min-width:120px" x-text="t('Governorate')"></th>
                                                <th style="min-width:140px" x-text="t('Problem')"></th>
                                                <th x-text="t('Visit Date')"></th>
                                                <th x-text="t('Price')"></th>
                                                <th style="width:60px"></th>
                                            </tr>
                                        </thead>
                                        <!-- Each patient's rows are their own tbody element: x-for
                                             needs a single root element, and a tbody is valid as a
                                             direct child of the table. The previous NESTED tbody was
                                             invalid DOM — browsers split those rows into separate
                                             anonymous tables, so columns no longer lined up with the
                                             header. -->
                                        <template x-for="row in visibleRows()" :key="row.id">
                                                    <tbody>
                                                        <tr :class="{ 'table-active': row.selected }">
                                                            <td><input type="checkbox" class="form-check-input" x-model="row.selected"></td>
                                                            <td class="text-center" style="white-space:nowrap">
                                                                <span class="badge bg-success" x-show="aiRowStatus(row) === 'ready'" x-text="t('Ready')"></span>
                                                                <span class="badge bg-warning text-dark" x-show="aiRowStatus(row) === 'check'" x-text="t('Check')"></span>
                                                                <span class="badge bg-danger" x-show="aiRowStatus(row) === 'error'" x-text="t('Error')"></span>
                                                                <span class="badge bg-info text-dark" x-show="row.duplicate" x-text="t('Duplicate')"></span>
                                                            </td>
                                                            <td>
                                                                <input class="form-control form-control-sm" :class="{ 'ai-cell-error': aiCellWarning(row, 'name') || aiRowStatus(row) === 'error' }" x-model="row.data.name">

                                                            <td>
                                                                <input class="form-control form-control-sm" :class="{ 'ai-cell-error': aiCellWarning(row, 'national_id') }" x-model="row.data.national_id" inputmode="numeric">

                                                            <td><input class="form-control form-control-sm" :class="{ 'ai-cell-check': aiCellWarning(row, 'mobile') }" x-model="row.data.mobile" inputmode="tel"></td>
                                                            <td>
                                                                <select class="form-select form-select-sm" :class="{ 'ai-cell-check': aiCellWarning(row, 'governorate') }" x-model="row.data.governorate">
                                                                    <option value="">--</option>
                                                                    <template x-for="gov in governorates" :key="gov"><option :value="gov" x-text="gov"></option></template>
                                                                </select>
                                                            </td>
                                                            <td><input class="form-control form-control-sm" x-model="row.data.problem"></td>
                                                            <td><input type="date" class="form-control form-control-sm" :class="{ 'ai-cell-check': aiCellWarning(row, 'visit_date') }" x-model="row.data.visit_date"></td>
                                                            <td style="width:90px"><input class="form-control form-control-sm" x-model="row.data.price" inputmode="decimal"></td>
                                                            <td class="text-nowrap text-center">
                                                                <button type="button" class="btn btn-sm btn-link text-secondary p-0 me-1" @click="row.expanded = !row.expanded"

                                                                    <i class="bi" :class="row.expanded ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
                                                                </button>
                                                                <button type="button" class="btn btn-sm btn-link text-secondary p-0" @click="showRowSource(row)" :title="t('Source text')" :aria-label="t('Source text')">

                                                                </button>
                                                            </td>
                                                        </tr>
                                                        <!-- errors / duplicate info under the row -->
                                                        <tr x-show="aiRowStatus(row) === 'error' || row.duplicate">
                                                            <td colspan="10" class="ps-3 pe-3" style="border-top:0">
                                                                <div class="small">
                                                                    <span class="text-danger" x-show="aiRowStatus(row) === 'error'"
                                                                        x-text="aiRowErrors(row).join(' · ')"></span>
