<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    <title>الملف الطبي</title>
    <script>
        // Polyfills for browsers that support ES modules but predate a few
        // APIs the app relies on. Chrome 91 (the Android 9 WebView, still
        // current on many devices) is missing all four, and a missing API here
        // makes Alpine fail to build its scope -- every x-text/x-show binding
        // throws "ReferenceError: ... is not defined" and the app renders
        // blank. Classic script, so it runs before the deferred module.
        (function () {
            if (!Array.prototype.at) {
                Object.defineProperty(Array.prototype, 'at', {
                    configurable: true,
                    writable: true,
                    value: function at(index) {
                        var len = this.length >>> 0;
                        var i = Math.trunc(index) || 0;
                        if (i < 0) i += len;
                        return i < 0 || i >= len ? undefined : this[i];
                    },
                });
            }
            if (!Object.hasOwn) {
                Object.defineProperty(Object, 'hasOwn', {
                    configurable: true,
                    writable: true,
                    value: function hasOwn(object, key) {
                        return Object.prototype.hasOwnProperty.call(object, key);
                    },
                });
            }
            if (typeof window.structuredClone !== 'function') {
                // Only ever used on plain config objects, so a JSON round-trip
                // is a correct stand-in.
                window.structuredClone = function structuredClone(value) {
                    return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
                };
            }
            try {
                if (window.crypto && !window.crypto.randomUUID) {
                    Object.defineProperty(window.crypto, 'randomUUID', {
                        configurable: true,
                        writable: true,
                        value: function randomUUID() {
                            var bytes = new Uint8Array(16);
                            if (window.crypto.getRandomValues) {
                                window.crypto.getRandomValues(bytes);
                            } else {
                                for (var j = 0; j < 16; j += 1) bytes[j] = Math.floor(Math.random() * 256);
                            }
                            bytes[6] = (bytes[6] & 15) | 64;
                            bytes[8] = (bytes[8] & 63) | 128;
                            var hex = [];
                            for (var k = 0; k < 16; k += 1) hex.push((bytes[k] + 256).toString(16).slice(1));
                            return hex.slice(0, 4).join('') + '-' + hex.slice(4, 6).join('') + '-' +
                                hex.slice(6, 8).join('') + '-' + hex.slice(8, 10).join('') + '-' + hex.slice(10, 16).join('');
                        },
                    });
                }
            } catch (e) { /* a read-only crypto: the app degrades, it does not crash */ }
        })();
    </script>
</head>
<body class="bg-light" x-data="app()" x-init="init()">

    <div class="page-loader" x-show="loading" x-cloak>
        <div class="spinner"></div>
    </div>

    <!-- Shown only when the app bundle fails to start (e.g. a browser too old
         for the build). The inline script below is a classic script, so it
         still runs when the module bundle throws: the user gets a real
         message instead of a blank white page. -->
    <div class="boot-fallback" id="bootFallback" hidden>
        <div class="text-center p-4" style="max-width: 32rem;">
            <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size:2.5rem"></i>
            <p class="mt-3 mb-1 fw-semibold" dir="rtl">تعذّر تشغيل التطبيق على هذا المتصفح.</p>
            <p class="text-muted small mb-0">The app could not start in this browser. Please update it, or use a recent Chrome, Edge, Firefox or Safari.</p>
            <p class="text-danger small mt-2 mb-0" id="bootFallbackDetail"></p>
        </div>
    </div>
    <script>
        // Never leave a blank page. If a script fails, or the app has not
        // booted shortly after load, reveal a real message -- and the error
        // text, so the cause is visible without a developer console.
        (function () {
            var fallback = document.getElementById('bootFallback');
            var detail = document.getElementById('bootFallbackDetail');
            function show(reason) {
                if (window.__appBooted || !fallback) return;
                if (detail && reason) detail.textContent = String(reason).slice(0, 300);
                fallback.hidden = false;
                var loader = document.querySelector('.page-loader');
                if (loader) loader.style.display = 'none';
            }
            window.addEventListener('error', function (e) {
                show((e && e.message) || (e && e.error && e.error.message) || 'script error');
            });
            window.addEventListener('unhandledrejection', function (e) {
                var reason = e && e.reason;
                show((reason && reason.message) || reason || 'unhandled rejection');
            });
            window.addEventListener('load', function () {
                var tick = setInterval(function () {
                    if (window.__appBooted && fallback) {
                        fallback.hidden = true;
                        clearInterval(tick);
                    }
                }, 1000);
                setTimeout(function () { show('startup timed out'); }, 15000);
            });
        })();
    </script>

    <div x-show="!loading" x-cloak>

        <!-- NAVBAR (desktop) -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4" x-show="isLoggedIn">
            <div class="container">
                <span class="navbar-brand" @click="navigate('dashboard')" style="cursor:pointer" :aria-label="t('Dashboard')">
                    <i class="bi bi-heart-pulse-fill"></i>
                </span>
                <!-- Global patient search: one box, no options. Lives outside the
                     collapse so it stays visible in the top bar on mobile instead of
                     hiding behind the hamburger. -->
                <div class="global-search position-relative" @click.outside="closeGlobalSearch({ clearFocus: true })">
                        <div class="position-relative">
                            <i class="bi bi-search global-search-icon" aria-hidden="true" x-show="!globalSearchLoading"></i>
                            <input
                                type="search"
                                class="form-control global-search-input"
                                x-model="globalSearch"
                                @input.debounce="onGlobalInput()"
                                @focus="globalSearchFocused = true"
                                @keydown="onGlobalKeydown($event)"
                                :placeholder="t('Search patients...')"
                                :aria-label="t('Search patients...')"
                                autocomplete="off"
                            >
                            <span class="global-search-spinner spinner-border spinner-border-sm text-light" x-show="globalSearchLoading" x-cloak></span>
                        </div>
                        <div class="global-search-menu list-group shadow" x-show="globalSearchFocused && globalSearch && (globalSuggestions().length || globalSearchLoading)" x-cloak>
                            <template x-for="(patient, index) in globalSuggestions()" :key="patient.id">
                                <button type="button" class="list-group-item list-group-item-action global-search-item"
                                    :class="{ 'active': index === globalSearchSelectedIndex }"
                                    @click="pickGlobalResult(patient)"
                                    @mousemove="globalSearchSelectedIndex = index"
                                >
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-person-circle text-primary fs-5"></i>
                                        <div class="flex-grow-1 text-start">
                                            <div class="fw-semibold" x-text="patient.name"></div>
                                            <div class="small text-muted d-flex flex-wrap gap-2">
                                                <span x-show="patient.national_id"><i class="bi bi-credit-card-2-front"></i> <span x-text="patient.national_id"></span></span>
                                                <span x-show="patient.mobile"><i class="bi bi-telephone"></i> <span x-text="patient.mobile"></span></span>
                                                <span x-show="patient.section"><i class="bi bi-building"></i> <span x-text="optionLabel('section', patient.section)"></span></span>
                                                <span x-show="patient.governorate"><i class="bi bi-geo-alt"></i> <span x-text="governorateLabel(patient.governorate)"></span></span>
                                            </div>
                                        </div>
                                        <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'" x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                    </div>
                                </button>
                            </template>
                            <button type="button" class="list-group-item list-group-item-action text-primary fw-semibold global-search-item" @click="runGlobalList()">
                                <i class="bi bi-arrow-right-short"></i>
                                <span x-text="t('See all results')"></span>
                            </button>
                        </div>
                    </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'dashboard' }" @click="navigate('dashboard')" style="cursor:pointer">
                                <i class="bi bi-house-door-fill me-1"></i><span x-text="t('Dashboard')"></span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'patients' }" @click="navigate('patients')" style="cursor:pointer">
                                <i class="bi bi-people me-1"></i><span x-text="t('Patients')"></span>
                            </span>
                        </li>
                        <li class="nav-item ms-2 dropdown">
                            <a class="nav-link px-2 dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" :title="profile?.name || user?.email || 'User'" :aria-label="profile?.name || user?.email || 'User'">
                                <i class="bi bi-person-circle fs-5"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <span class="dropdown-item-text fw-semibold small" x-text="profile?.name || user?.email || 'User'"></span>
                                </li>
                                <li>
                                    <span class="dropdown-item-text text-muted small" x-text="user?.email"></span>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li x-show="isSuperAdmin">
                                    <button type="button" class="dropdown-item" :class="{ active: currentPage === 'settings' }" @click="navigate('settings')">
                                        <i class="bi bi-gear me-2"></i><span x-text="t('Settings')"></span>
                                    </button>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <button class="dropdown-item text-danger" @click="logout()">
                                        <i class="bi bi-box-arrow-right me-2"></i><span x-text="t('Logout')"></span>
                                    </button>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item ms-2">
                            <button class="btn btn-sm btn-outline-light fw-semibold" @click="toggleLocale()">
                                <i class="bi bi-translate me-1"></i><span x-text="localeLabel"></span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container page-container">

            <!-- Global toasts (showAlert): stacked in the corner, each one
                 auto-dismisses, nothing is pushed down the page. -->
            <div class="toast-stack" :class="{ 'toast-stack--above-bar': isLoggedIn }" aria-live="polite" aria-atomic="false">
                <template x-for="toast in toasts" :key="toast.id">
                    <div class="alert d-flex align-items-start gap-2 shadow-sm mb-0" :class="'alert-' + toast.type" role="alert">
                        <i class="bi mt-1" :class="toastIcon(toast.type)" aria-hidden="true"></i>
                        <span class="flex-grow-1" :title="toast.message" x-text="toast.message"></span>
                        <button type="button" class="btn-close" @click="dismissAlert(toast.id)" :aria-label="t('Close')"></button>
                    </div>
                </template>
            </div>

            <!-- LOGIN PAGE -->
            <div x-show="!isLoggedIn && currentPage === 'login'" x-cloak>
                <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
                    <div>
                        <a href="#" @click.prevent="navigate('dashboard')" x-cloak>
                            <i class="bi bi-heart-pulse-fill text-muted" style="font-size:3.5rem"></i>
                        </a>
                    </div>
                    <div class="w-100 mt-4 px-4 py-4 bg-white shadow overflow-hidden rounded" style="max-width: 28rem;">
                        <form @submit.prevent="handleLogin()">
                            <div class="alert alert-danger py-2" x-show="loginError" x-cloak x-transition role="alert" aria-live="assertive">
                                <div class="d-flex align-items-start gap-2">
                                    <i class="bi bi-exclamation-circle-fill mt-1"></i>
                                    <span x-text="loginError"></span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" x-text="t('Username or email')"></label>
                                <!-- A username has no @, so the field cannot be type="email";
                                     the account email still works and is signed in directly. -->
                                <input id="identifier" type="text" class="form-control" x-model="loginForm.identifier" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false">
                            </div>
                            <div class="mt-4 mb-3">
                                <label class="form-label" x-text="t('Password')"></label>
                                <input id="password" type="password" class="form-control" x-model="loginForm.password" required autocomplete="current-password">
                            </div>
                            <div class="form-check mt-3">
                                <input class="form-check-input" type="checkbox" id="rememberMe" x-model="loginForm.remember">
                                <label class="form-check-label" for="rememberMe" x-text="t('Remember me')"></label>
                            </div>
                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-primary" :disabled="loginLoading">
                                    <span x-show="loginLoading" class="spinner-border spinner-border-sm me-1"></span>
                                    <span x-text="t('Log in')"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD PAGE -->
            <div x-show="isLoggedIn && currentPage === 'dashboard'" x-cloak>
                <!-- Welcome Banner -->
                <div class="d-flex align-items-center justify-content-between mb-4 dashboard-page-header">
                    <div>
                        <h2 class="fw-bold text-secondary mb-0">
                            <i class="bi bi-house-door-fill me-2 text-primary"></i><span x-text="t('Dashboard')"></span>
                        </h2>
                        <small class="text-muted">
                            <span x-text="t('Welcome back,')"></span>
                            <strong x-text="profile?.name || user?.email"></strong>
                            <span>(<span x-text="roleLabel()"></span>)</span>
                        </small>
                    </div>
                    <span class="text-muted small dashboard-date"><i class="bi bi-calendar3 me-1"></i><span x-text="currentDate"></span></span>
                </div>

                <!-- Patients overview (one card): the totals, the completion
                     split and the per-section counts. The counts per source of
                     money live in the Financial Summary below. -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
                            <div class="stat-icon bg-primary bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                <i class="bi bi-people-fill fs-2 text-primary" aria-hidden="true"></i>
                            </div>
                            <div class="stat-text">
                                <div class="stat-value fs-2 fw-bold text-dark" x-text="stats.total"></div>
                                <div class="text-muted small" x-text="t('Total Patients')"></div>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-primary ms-auto" @click="navigate('patients')"
                                :aria-label="t('Manage') + ': ' + t('Total Patients')">
                                <span x-text="t('Manage')"></span> <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
                            </button>
                            <button type="button" class="btn btn-sm btn-link text-secondary p-1"
                                @click="toggleStatsCard()"
                                :aria-expanded="statsCardOpen ? 'true' : 'false'"
                                :aria-label="statsCardOpen ? t('Collapse') : t('Expand')">
                                <i class="bi" :class="statsCardOpen ? 'bi-chevron-up' : 'bi-chevron-down'" aria-hidden="true"></i>
                            </button>
                        </div>

                        <!-- Folded: every number on one line. -->
                        <div class="stat-compact text-muted" x-show="!statsCardOpen" x-cloak>
                            <span><strong class="text-dark" x-text="stats.total"></strong> <span x-text="t('Total Patients')"></span></span>
                            <span class="sep">·</span>
                            <span><strong class="text-success" x-text="stats.completed"></strong> <span x-text="t('Completed')"></span></span>
                            <span class="sep">·</span>
                            <span><strong class="text-danger" x-text="stats.pending"></strong> <span x-text="t('Pending')"></span></span>
                            <template x-for="entry in sectionStatEntries()" :key="'fold-sec-' + entry.key">
                                <span>
                                    <span class="sep">·</span>
                                    <strong :class="'text-' + sectionColor(entry.key)" x-text="entry.count"></strong>
                                    <span x-text="entry.label"></span>
                                </span>
                            </template>
                        </div>

                        <div x-show="statsCardOpen">

                        <!-- The sections come first: they are the breakdown of
                             the total above them. -->
                        <div x-show="readableSectionKeys().length" class="mb-3">
                            <div class="text-muted small fw-semibold text-uppercase mb-2" x-text="t('By Section')"></div>
                            <div class="stat-entries">
                                <template x-for="entry in sectionStatEntries()" :key="'sec-' + entry.key">
                                    <div class="stat-entry">
                                        <span class="stat-entry-value fs-4 fw-bold" :class="'text-' + sectionColor(entry.key)" x-text="entry.count"></span>
                                        <div class="stat-entry-label text-muted small" x-text="entry.label"></div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <hr class="text-muted opacity-25 mb-3">

                        <div class="row g-3 align-items-center">
                            <div class="col-6 col-lg-3">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-check-circle-fill text-success fs-5" aria-hidden="true"></i>
                                    <div>
                                        <div class="fs-4 fw-bold text-success" x-text="stats.completed"></div>
                                        <div class="text-muted small" x-text="t('Completed')"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 col-lg-3">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="bi bi-exclamation-circle-fill text-danger fs-5" aria-hidden="true"></i>
                                    <div>
                                        <div class="fs-4 fw-bold text-danger" x-text="stats.pending"></div>
                                        <div class="text-muted small" x-text="t('Pending')"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>

                <!-- Financial Summary: the Prices page (#15) merged into the dashboard.
                     It also carries the counts per source of money, so the
                     dashboard needs no separate card for them. -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-white border-bottom py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-currency-dollar me-2 text-primary"></i><span x-text="t('Financial Summary')"></span></h5>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-muted small" x-text="isSuperAdmin ? t('Financial summary across all patients') : t('Financial summary in your sections')"></span>
                            <button type="button" class="btn btn-sm btn-link text-secondary p-1"
                                @click="toggleFinancialCard()"
                                :aria-expanded="financialCardOpen ? 'true' : 'false'"
                                :aria-label="financialCardOpen ? t('Collapse') : t('Expand')">
                                <i class="bi" :class="financialCardOpen ? 'bi-chevron-up' : 'bi-chevron-down'" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-4">

                        <!-- Folded: every total on one line. The card header
                             already draws the line above it. -->
                        <div class="stat-compact stat-compact-flush text-muted" x-show="!financialCardOpen" x-cloak>
                            <span><strong class="text-primary" x-text="formatMoney(priceStats?.grandTotal)"></strong> <span x-text="t('EGP')"></span></span>
                            <span class="sep">·</span>
                            <span><strong class="text-dark" x-text="priceStats?.totalPatients ?? 0"></strong> <span x-text="t('patients')"></span></span>
                            <template x-for="entry in sectionFinancialEntries()" :key="'fold-fin-sec-' + entry.key">
                                <span>
                                    <span class="sep">·</span>
                                    <strong :class="'text-' + sectionColor(entry.key)" x-text="formatMoney(entry.total)"></strong>
                                    <span x-text="entry.label"></span>
                                    <span x-text="'(' + entry.count + ')'"></span>
                                </span>
                            </template>
                            <template x-for="entry in sourceFinancialEntries()" :key="'fold-fin-src-' + entry.key">
                                <span>
                                    <span class="sep">·</span>
                                    <strong :class="'text-' + sourceColor(entry.key)" x-text="formatMoney(entry.total)"></strong>
                                    <span x-text="entry.label"></span>
                                    <span x-text="'(' + entry.count + ')'"></span>
                                </span>
                            </template>
                        </div>

                        <div x-show="financialCardOpen">
                        <!-- A failed summary request never takes the dashboard down: warning + retry. -->
                        <div class="alert alert-warning d-flex flex-wrap align-items-center gap-2 mb-0" x-show="priceStatsError">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <span x-text="t('The financial summary could not be loaded.')"></span>
                            <button type="button" class="btn btn-sm btn-outline-secondary ms-auto" @click="loadPriceStats()" x-text="t('Retry')"></button>
                        </div>

                        <!-- Loading state -->
                        <div class="text-center text-muted py-3" x-show="!priceStatsError && !priceStats">
                            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                            <span x-text="t('Loading the financial summary...')"></span>
                        </div>

                        <!-- Empty state: nothing priced yet -->
                        <div class="text-center text-muted py-3" x-show="priceStats && !hasFinancialData()">
                            <i class="bi bi-cash-stack fs-2 d-block mb-2"></i>
                            <span x-text="t('No financial data recorded yet.')"></span>
                        </div>

                        <!-- Grand total, By Section, By Source of Money -->
                        <div class="row g-4" x-show="hasFinancialData()">
                            <div class="col-lg-4">
                                <div class="card h-100 border-0 bg-primary text-white shadow-sm">
                                    <div class="card-body d-flex align-items-center gap-3 p-4">
                                        <i class="bi bi-cash-stack fs-2"></i>
                                        <div>
                                            <div class="small opacity-75" x-text="t('Grand Total')"></div>
                                            <div class="fs-4 fw-bold"><span x-text="formatMoney(priceStats?.grandTotal)"></span> <span class="small fw-normal opacity-75" x-text="t('EGP')"></span></div>
                                            <div class="small opacity-75"><span x-text="priceStats?.totalPatients ?? 0"></span> <span x-text="t('patients')"></span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-4">
                                <div class="card h-100 border-0 shadow-sm">
                                    <div class="card-body p-0">
                                        <h6 class="fw-semibold text-secondary px-3 py-3 mb-0 border-bottom d-flex align-items-center gap-2">
                                            <i class="bi bi-building text-primary"></i><span x-text="t('By Section')"></span>
                                        </h6>
                                        <div class="fin-summary-grid p-2">
                                            <template x-for="entry in sectionFinancialEntries()" :key="'fin-sec-' + entry.key">
                                                <div class="fin-entry">
                                                    <div class="rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0" :class="'bg-' + sectionColor(entry.key)" style="width:32px;height:32px;">
                                                        <i class="bi" :class="sectionIcon(entry.key)"></i>
                                                    </div>
                                                    <div class="fin-entry-label">
                                                        <div class="fw-semibold text-truncate" x-text="entry.label"></div>
                                                        <div class="small text-muted"><span x-text="entry.count"></span> <span x-text="t('patients')"></span></div>
                                                    </div>
                                                    <div class="fin-entry-total">

                                                    <template x-for="opt in activeOptions('section')" :key="'fs-' + opt.key">

                                        <button type="submit" class="btn btn-primary filter-panel-apply" x-text="t('Apply')"></button>
                                    </div>

                            <!-- The view options: the popover the filters use on a

                                <div class="filter-panel-body">

                                                    :checked="isColumnVisible(column.key)"

                        <div class="shadow-sm" :class="importEnabled ? 'btn-group' : ''">

                                    </li>
                                </template>
                                <template x-if="importEnabled && importOpenJobs.length > 0">
                                    <li>
                                        <button type="button" class="dropdown-item text-danger small" @click="clearAllImports()">
                                            <i class="bi bi-trash me-2"></i><span x-text="t('importAgent.wizard.clearAllImports')"></span>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
                    <div class="filter-chips d-flex flex-wrap gap-2 mb-4" x-show="activeFilterCount()" x-cloak :aria-label="t('Active filters')">
                        <template x-for="chip in appliedFilterChips()" :key="chip.key">
                            <span class="chip">
                                <span class="chip-label" x-text="chip.label"></span>
                                <button type="button" class="chip-remove" :aria-label="chip.aria" @click="removeAppliedFilter(chip.key)">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                </button>
                            </span>
                        </template>
                    </div>

                <div x-show="patientsError" x-cloak class="alert alert-warning d-flex flex-wrap align-items-center gap-2 mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span x-text="t('Could not load the patient list. Check your connection and try again.')"></span>
                    <button type="button" class="btn btn-sm btn-outline-secondary ms-auto" @click="loadPatients()" x-text="t('Retry')"></button>
                </div>

                <!-- On a phone the table header is gone, so select mode gets its
                     own compact bar: select-all for the page and the running count. -->
                <div class="patients-select-bar d-md-none" x-show="selectMode" x-cloak>
                    <label class="form-check mb-0">
                        <input class="form-check-input" type="checkbox"
                            :checked="allPageSelected()"
                            @change="toggleSelectAllOnPage($event.target.checked)"
                            :disabled="patients.length === 0">
                        <span class="form-check-label" x-text="t('Select all')"></span>
                    </label>
                    <span class="small text-muted" x-text="t('Selected patients') + ': ' + selectedPatientIds.length"></span>
                </div>

                <div class="card shadow-sm border-0 patients-table-card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 patients-table"
                                :style="'--patients-table-font: ' + patientTableFont">
                                <thead class="table-light border-bottom text-muted">
                                    <tr>
                                        <th class="py-3 ps-4 patient-select-cell" style="width:2.5rem" x-show="selectMode">
                                            <input class="form-check-input" type="checkbox"
                                                :checked="allPageSelected()"
                                                @change="toggleSelectAllOnPage($event.target.checked)"
                                                :disabled="patients.length === 0"
                                                :aria-label="t('Select all')">
                                        </th>
                                        <th class="py-3 sortable-head ps-2" :aria-sort="ariaSort('name')" x-show="isColumnVisible('name')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('name')">
                                                <span x-text="t('Patient Name')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('name')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('national_id')" x-show="isColumnVisible('national_id')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('national_id')">
                                                <span x-text="t('National ID')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('national_id')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('mobile')" x-show="isColumnVisible('mobile')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('mobile')">
                                                <span x-text="t('Mobile No.')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('mobile')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('governorate')" x-show="isColumnVisible('governorate')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('governorate')">
                                                <span x-text="t('Governorate')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('governorate')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('is_completed')" x-show="isColumnVisible('is_completed')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('is_completed')">
                                                <span x-text="t('Status')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('is_completed')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('follower')" x-show="isColumnVisible('follower')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('follower')">
                                                <span x-text="t('Follower')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('follower')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('source_of_money')" x-show="isColumnVisible('source_of_money')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('source_of_money')">
                                                <span x-text="t('Source')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('source_of_money')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('section')" x-show="isColumnVisible('section')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('section')">
                                                <span x-text="t('Section')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('section')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3 sortable-head " :aria-sort="ariaSort('created_at')" x-show="isColumnVisible('created_at')">
                                            <button type="button" class="table-sort-btn" @click="sortPatientsBy('created_at')">
                                                <span x-text="t('Registered Date')"></span>
                                                <i class="bi sort-arrow" :class="sortIcon('created_at')"></i>
                                            </button>
                                        </th>
                                        <th class="py-3" x-show="isColumnVisible('date_of_birth')" x-text="t('Date of Birth')"></th>
                                        <th class="py-3" x-show="isColumnVisible('age')" x-text="t('Age')"></th>
                                        <th class="py-3" x-show="isColumnVisible('marital_status')" x-text="t('Marital Status')"></th>
                                        <th class="py-3" x-show="isColumnVisible('children_count')" x-text="t('Number of Children')"></th>
                                        <th class="py-3" x-show="isColumnVisible('price')" x-text="t('Price')"></th>
                                        <th class="py-3" x-show="isColumnVisible('visit_date')" x-text="t('Visit Date')"></th>
                                        <th class="py-3" x-show="isColumnVisible('address')" x-text="t('Address')"></th>
                                        <th class="py-3" x-show="isColumnVisible('problem')" x-text="t('Problem')"></th>
                                        <th class="py-3" x-show="isColumnVisible('solution')" x-text="t('Solution')"></th>
                                        <th class="text-end pe-4 py-3" x-text="t('Actions')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in patients" :key="patient.id">
                                        <tr class="patient-row">
                                            <td class="ps-4 patient-select-cell" x-show="selectMode">
                                                <input class="form-check-input" type="checkbox"
                                                    :checked="isPatientSelected(patient.id)"
                                                    @change="togglePatientSelection(patient.id, $event.target.checked)"
                                                    :aria-label="t('Select patient')">
                                            </td>
                                            <td class="ps-2 patient-name-cell" x-show="isColumnVisible('name')">
                                                <span class="fw-bold text-dark d-block" x-text="patient.name"></span>
                                            </td>
                                            <td x-show="isColumnVisible('national_id')"><code x-text="patient.national_id"></code></td>
                                            <td x-show="isColumnVisible('mobile')">
                                                <template x-if="patient.mobile">
                                                    <span><i class="bi bi-telephone text-muted me-1"></i><span x-text="patient.mobile"></span></span>
                                                </template>
                                                <template x-if="!patient.mobile">
                                                    <span class="text-muted"><em x-text="t('None')"></em></span>
                                                </template>
                                            </td>
                                            <td x-show="isColumnVisible('governorate')">
                                                <span class="badge bg-light text-dark border px-2 py-1">
                                                    <i class="bi bi-geo-alt-fill text-danger me-1"></i><span x-text="patient.governorate ? governorateLabel(patient.governorate) : 'N/A'"></span>
                                                </span>
                                            </td>
                                            <td x-show="isColumnVisible('is_completed')">
                                                <button class="btn btn-sm px-2 py-1 patient-status-btn"
                                                    :class="patient.is_completed ? 'btn-success' : 'btn-outline-secondary'"
                                                    @click="toggleStatus(patient)"
                                                    :title="patient.is_completed ? t('Completed') : t('Pending')"
                                                    :aria-label="patient.is_completed ? t('Completed') : t('Pending')">
                                                    <template x-if="patient.is_completed">
                                                        <span><i class="bi bi-check-circle-fill me-1"></i><span class="patient-status-label" x-text="t('Completed')"></span></span>
                                                    </template>
                                                    <template x-if="!patient.is_completed">
                                                        <span><i class="bi bi-circle me-1"></i><span class="patient-status-label" x-text="t('Pending')"></span></span>
                                                    </template>
                                                </button>
                                            </td>
                                            <td x-show="isColumnVisible('follower')">
                                                <span class="text-secondary fs-7"><i class="bi bi-person-badge me-1"></i><span x-text="followerLabel(patient.follower)"></span></span>
                                            </td>
                                            <td x-show="isColumnVisible('source_of_money')">
                                                <span class="text-secondary fs-7"><i class="bi bi-cash-coin me-1"></i><span x-text="patient.source_of_money ? optionLabel('source', patient.source_of_money) : ''"></span></span>
                                            </td>
                                            <td x-show="isColumnVisible('section')">
                                                <span class="text-secondary fs-7"><i class="bi bi-building me-1"></i><span x-text="patient.section ? optionLabel('section', patient.section) : ''"></span></span>
                                            </td>
                                            <td x-show="isColumnVisible('created_at')">
                                                <span class="text-muted small" x-text="formatDateOnly(patient.created_at)"></span>
                                            </td>
                                            <td x-show="isColumnVisible('date_of_birth')">
                                                <span class="text-muted small" x-text="patient.date_of_birth ? formatDateOnly(patient.date_of_birth) : '—'"></span>
                                            </td>
                                            <td x-show="isColumnVisible('age')">
                                                <span x-text="patientAgeOf(patient)"></span>
                                            </td>
                                            <td x-show="isColumnVisible('marital_status')">
                                                <span class="text-muted small" x-text="patient.marital_status ? optionLabel('marital', patient.marital_status) : '—'"></span>
                                            </td>
                                            <td x-show="isColumnVisible('children_count')">
                                                <span x-text="patient.children_count ?? '—'"></span>
                                            </td>
                                            <td x-show="isColumnVisible('price')">
                                                <span x-text="patient.price ?? '—'"></span>
                                            </td>
                                            <td x-show="isColumnVisible('visit_date')">
                                                <span class="text-muted small" x-text="patient.visit_date ? formatDateOnly(patient.visit_date) : '—'"></span>
                                            </td>
                                            <td x-show="isColumnVisible('address')">
                                                <span class="text-muted small" x-text="patient.address || '—'"></span>
                                            </td>
                                            <td x-show="isColumnVisible('problem')">
                                                <span class="text-muted small" :title="patient.problem || ''" x-text="patient.problem ? (patient.problem.length > 40 ? patient.problem.slice(0, 40) + '…' : patient.problem) : '—'"></span>
                                            </td>
                                            <td x-show="isColumnVisible('solution')">
                                                <span class="text-muted small" :title="patient.solution || ''" x-text="patient.solution ? (patient.solution.length > 40 ? patient.solution.slice(0, 40) + '…' : patient.solution) : '—'"></span>
                                            </td>
                                            <td class="text-end pe-4 patient-actions-cell">
                                                <div class="btn-group" role="group">
                                                    <button class="btn btn-sm btn-outline-secondary" @click="showPatient(patient)"
                                                        :title="t('View')" :aria-label="t('View')">
                                                        <i class="bi bi-person-vcard"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-primary" @click="editPatient(patient)"
                                                        :title="t('Edit')" :aria-label="t('Edit')">
                                                        <i class="bi bi-pencil-square"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-danger" @click="removePatient(patient)"
                                                        :title="t('Delete')" :aria-label="t('Delete')">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="patientsLoading" class="patients-table-status-row">
                                        <td :colspan="tableColumnSpan()" class="patients-table-status-cell text-center py-5">
                                            <div class="spinner-border text-primary"></div>
                                        </td>
                                    </tr>
                                    <tr x-show="!patientsLoading && patients.length === 0" class="patients-table-status-row">
                                        <td :colspan="tableColumnSpan()" class="patients-table-status-cell text-center py-5 text-muted">
                                            <i class="bi bi-folder-x fs-1 text-secondary d-block mb-2"></i>
                                            <span class="fw-semibold" x-text="t('No patients recorded yet.')"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 px-4 py-3 border-top"
                            x-show="patientTotal > 0" x-cloak>
                            <span class="small text-muted"
                                x-text="t('Page :current of :total', { current: patientPage, total: patientPageCount() })"></span>
                            <div class="btn-group" role="group" :aria-label="t('Pagination')">
                                <button type="button" class="btn btn-sm btn-outline-secondary"
                                    :disabled="patientsLoading || patientPage <= 1"
                                    @click="goToPatientPage(patientPage - 1)" x-text="t('Previous')"></button>
                                <button type="button" class="btn btn-sm btn-outline-secondary"
                                    :disabled="patientsLoading || patientPage >= patientPageCount()"
                                    @click="goToPatientPage(patientPage + 1)" x-text="t('Next')"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI IMPORT AGENT (spec 10): files → extract → review -->
            <div x-show="isLoggedIn && currentPage === 'import'" x-cloak x-data="importAgentWizard()">
                <!-- The review step has its own header row (mockup screen 3):
                     the page title would be a second title for the same screen. -->
                <div class="d-flex align-items-center flex-wrap gap-2 mb-3" x-show="step !== 'review'">
                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="navigate('patients')">
                        <i class="bi bi-arrow-left me-1"></i><span x-text="t('Patients')"></span>
                    </button>
                    <h2 class="text-secondary fw-bold mb-0 fs-4">
                        <i class="bi bi-stars me-2 text-primary"></i><span x-text="t('importAgent.wizard.title')"></span>
                    </h2>
                </div>

                <div class="alert alert-danger" role="alert" x-show="errorBanner" x-cloak>
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <span x-text="errorBanner ? errorMessage({ messageKey: errorBanner.messageKey, params: errorBanner.params }) : ''"></span>
                        <div class="d-flex align-items-center gap-2 flex-shrink-0">
                            <button type="button" class="btn btn-sm btn-outline-danger" x-show="job && jobStatus === 'review'"
                                @click="reloadReview()" x-text="t('importAgent.review.reload')"></button>
                            <button type="button" class="btn-close" @click="errorBanner = null" :aria-label="t('Cancel')"></button>
                        </div>
                    </div>
                </div>

                <!-- STEP: ADD (spec 5) -->
                <template x-if="step === 'add'">
                    <div>
                        <!-- The result of the last commit. -->
                        <div class="alert alert-success py-2 small d-flex flex-wrap align-items-center gap-2 mb-3" x-show="commitResult" x-cloak>
                            <i class="bi bi-check-circle-fill"></i>
                            <span x-text="commitResult ? t('importAgent.review.confirm.done', commitResult) : ''"></span>
                            <button type="button" class="btn btn-sm btn-link text-secondary text-decoration-none p-0 ms-auto"
                                @click="commitResult = null" x-text="t('Dismiss')"></button>
                        </div>
                        <div class="card shadow-sm border-0 mb-3" x-show="openJobs.length > 0" x-cloak>
                            <div class="card-body py-2">
                                <div class="small fw-semibold text-muted mb-2" x-text="t('importAgent.wizard.openImports')"></div>
                                <div class="d-flex flex-column gap-1">
                                    <template x-for="job in openJobs" :key="job.id">
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="badge text-bg-light border fw-normal"
                                                x-text="t('importAgent.wizard.status.' + job.status)"></span>
                                            <span class="small text-muted" x-text="openJobLabel(job)"></span>
                                            <button type="button" class="btn btn-sm btn-outline-secondary ms-auto"
                                                @click="resumeJob(job.id)" x-text="t('importAgent.wizard.resume')"></button>
                                            <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none p-0 px-1"
                                                @click="cancelOpenJob(job)" :title="t('importAgent.wizard.cancel')"
                                                :aria-label="t('importAgent.wizard.cancel')">
                                                <i class="bi bi-x-lg"></i>
                                            </button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <!-- Which engine runs the import: the clinic chose it
                                 in the settings, the wizard only shows it. -->
                            <div class="alert py-2 px-3 small mb-3" :class="engine === 'local' ? 'alert-success' : 'alert-light border'">
                                <i class="bi me-1" :class="engine === 'local' ? 'bi-pc-display' : 'bi-cloud'"></i>
                                <strong x-text="engine === 'local' ? t('importAgent.wizard.localEngine') : t('importAgent.wizard.cloudEngine')"></strong>
                                <span class="ms-1" x-text="engine === 'local' ? t('importAgent.wizard.localEngineHint') : t('importAgent.wizard.cloudEngineHint')"></span>
                                <div class="small mt-1" x-show="engine === 'local' && !localModelReady" x-text="t('importAgent.wizard.localNoModel')"></div>
                            </div>
                            <label class="dropzone-hero d-block border border-2 border-dashed rounded-4 text-center px-4 py-5 position-relative" style="cursor:pointer">
                                <span class="dropzone-icon d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3">
                                    <i class="bi bi-cloud-arrow-up fs-2"></i>
                                </span>
                                <span class="d-block fs-4 fw-semibold" x-text="t('importAgent.start.drop')"></span>
                                <span class="d-block text-muted mt-1" x-text="t('importAgent.start.types', { maxFiles })"></span>
                                <span class="btn btn-primary mt-3 px-4"><i class="bi bi-folder2-open me-2"></i><span x-text="t('importAgent.start.choose')"></span></span>
                                <input type="file" class="position-absolute top-0 start-0 w-100 h-100 opacity-0" multiple
                                    @change="onFilesPicked($event)" :aria-label="t('importAgent.start.choose')">
                            </label>

                            <div class="mt-3">
                                <label class="form-label small text-muted mb-1" x-text="t('importAgent.start.pasteLabel')"></label>
                                <textarea class="form-control" rows="2" x-model="pastedText" :placeholder="t('importAgent.start.pastePh')"></textarea>
                            </div>

                            <div class="mt-3">
                                <button type="button" class="btn btn-link btn-sm small p-0 text-decoration-none" @click="showMore = !showMore" :aria-expanded="showMore">
                                    <i class="bi me-1" :class="showMore ? 'bi-chevron-up' : 'bi-chevron-down'"></i><span x-text="t('importAgent.start.more')"></span>
                                </button>
                                <div x-show="showMore" x-cloak class="row g-2 mt-2">
                                    <div class="col-md-5">
                                        <label class="form-label small mb-1 fw-semibold" x-text="t('importAgent.start.sectionLabel')"></label>
                                        <select class="form-select form-select-sm" x-model="section">
                                            <option value="" x-text="t('importAgent.start.sectionNone')"></option>
                                            <template x-for="option in sectionOptions" :key="option.key">
                                                <option :value="option.key" x-text="optionDisplay(option)"></option>
                                            </template>
                                        </select>
                                        <div class="form-text" x-text="t('importAgent.start.sectionHint')"></div>
                                    </div>
                                    <div class="col-md-7">
                                        <label class="form-label small mb-1 fw-semibold" x-text="t('importAgent.start.hints')"></label>
                                        <textarea class="form-control form-control-sm" rows="2" x-model="hints" :maxlength="2000"></textarea>
                                        <div class="form-text" x-text="t('importAgent.start.hintsHint')"></div>
                                    </div>
                                </div>
                            </div>

                            <template x-if="files.length > 0">
                                <ul class="list-unstyled mb-0 mt-3">
                                    <template x-for="file in files" :key="file.id">
                                        <li class="d-flex align-items-center flex-wrap gap-2 py-2 border-top">
                                            <i class="bi" :class="fileIcon(file)"></i>
                                            <span class="fw-semibold text-break" x-text="file.name"></span>
                                            <span class="text-muted small" x-text="formatBytes(file.size ?? 0)"></span>
                                            <template x-if="file.error">
                                                <span class="badge text-bg-danger" x-text="fileErrorLabel(file)"></span>
                                            </template>
                                            <template x-for="(warning, wIndex) in (file.warnings ?? [])" :key="wIndex">
                                                <span class="badge text-bg-warning-subtle border border-warning-subtle text-body fw-normal"
                                                    :title="warning.code" x-text="t('importAgent.warn.' + warning.code, warning.params ?? {})"></span>
                                            </template>
                                            <button type="button" class="btn btn-sm btn-link text-danger ms-auto p-0" @click="removeFile(file.id)" :aria-label="t('importAgent.wizard.removeFile')"><i class="bi bi-x-lg"></i></button>
                                        </li>
                                    </template>
                                </ul>
                            </template>

                            <div class="text-end mt-4">
                                <button type="button" class="btn btn-primary btn-lg" @click="analyze()" :disabled="addBlocked">
                                    <span class="spinner-border spinner-border-sm me-1" x-show="busy" x-cloak></span>
                                    <i class="bi bi-stars me-1" x-show="!busy"></i>
                                    <span x-text="busy ? t('importAgent.wizard.sending') : t('importAgent.start.analyze')"></span>
                                </button>
                            </div>
                        </div>
                        </div>
                    </div>
                </template>

                <!-- STEP: EXTRACTING (spec 9) -->
                <template x-if="step === 'extracting'">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                                <h5 class="card-title mb-0">
                                    <span class="spinner-border spinner-border-sm text-primary me-2"></span>
                                    <span x-show="localPhase" x-text="t('importAgent.progress.local.' + localPhase)"></span>
                                    <span x-show="!localPhase" x-text="banners.some(b => b.code === 'PROVIDER_RATE_LIMITED' || b.code === 'CHUNKS_RATE_LIMITED') ? t('importAgent.progress.waiting') : t('importAgent.progress.working')"></span>
                                </h5>
                                <button type="button" class="btn btn-sm btn-outline-danger" @click="cancelJob()" x-text="t('importAgent.wizard.cancel')"></button>
