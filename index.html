<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare Clinic</title>
</head>
<body class="bg-light" x-data="app()" x-init="init()">

    <div class="page-loader" x-show="loading" x-cloak>
        <div class="spinner"></div>
    </div>

    <div x-show="!loading" x-cloak>

        <!-- NAVBAR (desktop) -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4" x-show="isLoggedIn">
            <div class="container">
                <span class="navbar-brand" @click="navigate('dashboard')" style="cursor:pointer" :aria-label="t('Dashboard')">
                    <i class="bi bi-heart-pulse-fill"></i>
                </span>
                <!-- Global patient search: one box, no options. Lives outside the
                     collapse so it stays visible in the top bar on mobile instead of
                     hiding behind the hamburger. -->
                <div class="global-search position-relative" @click.outside="closeGlobalSearch({ clearFocus: true })">
                        <div class="position-relative">
                            <i class="bi bi-search global-search-icon" aria-hidden="true"></i>
                            <input
                                type="search"
                                class="form-control global-search-input"
                                x-model="globalSearch"
                                @input.debounce="onGlobalInput()"
                                @focus="globalSearchFocused = true"
                                @keydown="onGlobalKeydown($event)"
                                :placeholder="t('Search patients...')"
                                :aria-label="t('Search patients...')"
                                autocomplete="off"
                            >
                            <span class="global-search-spinner spinner-border spinner-border-sm text-light" x-show="globalSearchLoading" x-cloak></span>
                        </div>
                        <div class="global-search-menu list-group shadow" x-show="globalSearchFocused && globalSearch && (globalSuggestions().length || globalSearchLoading)" x-cloak>
                            <template x-for="(patient, index) in globalSuggestions()" :key="patient.id">
                                <button type="button" class="list-group-item list-group-item-action global-search-item"
                                    :class="{ 'active': index === globalSearchSelectedIndex }"
                                    @click="pickGlobalResult(patient)"
                                    @mousemove="globalSearchSelectedIndex = index"
                                >
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-person-circle text-primary fs-5"></i>
                                        <div class="flex-grow-1 text-start">
                                            <div class="fw-semibold" x-text="patient.name"></div>
                                            <div class="small text-muted d-flex flex-wrap gap-2">
                                                <span x-show="patient.national_id"><i class="bi bi-credit-card-2-front"></i> <span x-text="patient.national_id"></span></span>
                                                <span x-show="patient.mobile"><i class="bi bi-telephone"></i> <span x-text="patient.mobile"></span></span>
                                                <span x-show="patient.section"><i class="bi bi-building"></i> <span x-text="optionLabel('section', patient.section)"></span></span>
                                                <span x-show="patient.governorate"><i class="bi bi-geo-alt"></i> <span x-text="patient.governorate"></span></span>
                                            </div>
                                        </div>
                                        <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'" x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                    </div>
                                </button>
                            </template>
                            <button type="button" class="list-group-item list-group-item-action text-primary fw-semibold global-search-item" @click="runGlobalList()">
                                <i class="bi bi-arrow-right-short"></i>
                                <span x-text="t('See all results')"></span>
                            </button>
                        </div>
                    </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'dashboard' }" @click="navigate('dashboard')" style="cursor:pointer">
                                <i class="bi bi-speedometer2 me-1"></i><span x-text="t('Dashboard')"></span>
                            </span>
                        </li>
                        <li class="nav-item" x-show="isSuperAdmin">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'users' }" @click="navigate('users')" style="cursor:pointer">
                                <i class="bi bi-person-badge me-1"></i><span x-text="t('Users')"></span>
                            </span>
                        </li>
                        <li class="nav-item" x-show="isSuperAdmin">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'prices' }" @click="navigate('prices')" style="cursor:pointer">
                                <i class="bi bi-currency-dollar me-1"></i><span x-text="t('Prices')"></span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'patients' }" @click="navigate('patients')" style="cursor:pointer">
                                <i class="bi bi-people me-1"></i><span x-text="t('Patients')"></span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'import' }" @click="navigate('import')" style="cursor:pointer">
                                <i class="bi bi-cloud-arrow-up me-1"></i><span x-text="t('importAgent.wizard.title')"></span>
                            </span>
                        </li>
                        <li class="nav-item ms-2 dropdown">
                            <a class="nav-link px-2 dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" :title="profile?.name || user?.email || 'User'" :aria-label="profile?.name || user?.email || 'User'">
                                <i class="bi bi-person-circle fs-5"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <span class="dropdown-item-text fw-semibold small" x-text="profile?.name || user?.email || 'User'"></span>
                                </li>
                                <li>
                                    <span class="dropdown-item-text text-muted small" x-text="user?.email"></span>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li x-show="isSuperAdmin">
                                    <button type="button" class="dropdown-item" :class="{ active: currentPage === 'settings' }" @click="navigate('settings')">
                                        <i class="bi bi-gear me-2"></i><span x-text="t('Settings')"></span>
                                    </button>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <button class="dropdown-item text-danger" @click="logout()">
                                        <i class="bi bi-box-arrow-right me-2"></i><span x-text="t('Logout')"></span>
                                    </button>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item ms-2">
                            <button class="btn btn-sm btn-outline-light fw-semibold" @click="toggleLocale()">
                                <i class="bi bi-translate me-1"></i><span x-text="localeLabel"></span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container page-container">

            <!-- Global alert bar (showAlert). Auto-hides after a few seconds. -->
            <div class="alert alert-dismissible fade show" :class="'alert-' + alertType" x-show="alertMessage" x-cloak x-transition role="alert" aria-live="polite">
                <span x-text="alertMessage"></span>
                <button type="button" class="btn-close" @click="alertMessage = null" aria-label="Close"></button>
            </div>

            <!-- LOGIN PAGE -->
            <div x-show="currentPage === 'login'" x-cloak>
                <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
                    <div>
                        <a href="#" @click.prevent="navigate('dashboard')" x-cloak>
                            <i class="bi bi-heart-pulse-fill text-muted" style="font-size:3.5rem"></i>
                        </a>
                    </div>
                    <div class="w-100 mt-4 px-4 py-4 bg-white shadow overflow-hidden rounded" style="max-width: 28rem;">
                        <form @submit.prevent="handleLogin()">
                            <div class="alert alert-danger py-2" x-show="loginError" x-cloak x-transition role="alert" aria-live="assertive">
                                <div class="d-flex align-items-start gap-2">
                                    <i class="bi bi-exclamation-circle-fill mt-1"></i>
                                    <span x-text="loginError"></span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" x-text="t('Email')"></label>
                                <input id="email" type="email" class="form-control" x-model="loginForm.email" required autofocus autocomplete="username">
                            </div>
                            <div class="mt-4 mb-3">
                                <label class="form-label" x-text="t('Password')"></label>
                                <input id="password" type="password" class="form-control" x-model="loginForm.password" required autocomplete="current-password">
                            </div>
                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-primary" :disabled="loginLoading">
                                    <span x-show="loginLoading" class="spinner-border spinner-border-sm me-1"></span>
                                    <span x-text="t('Log in')"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD PAGE -->
            <div x-show="currentPage === 'dashboard'" x-cloak>
                <!-- Welcome Banner -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h2 class="fw-bold text-secondary mb-0">
                            <i class="bi bi-speedometer2 me-2 text-primary"></i><span x-text="t('Dashboard')"></span>
                        </h2>
                        <small class="text-muted">
                            <span x-text="t('Welcome back,')"></span>
                            <strong x-text="profile?.name || user?.email"></strong>
                            <span>(<span x-text="roleLabel()"></span>)</span>
                        </small>
                    </div>
                    <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i><span x-text="currentDate"></span></span>
                </div>

                <!-- Stats Cards -->
                <div class="row g-4 mb-4">

                    <!-- Total Patients -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-primary bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-people-fill fs-2 text-primary"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.total"></div>
                                    <div class="text-muted small" x-text="t('Total Patients')"></div>
                                    <span class="text-primary small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('Manage')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Completed -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-check-circle-fill fs-2 text-success"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.completed"></div>
                                    <div class="text-muted small" x-text="t('Completed')"></div>
                                    <span class="text-success small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('View')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pending -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-danger bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-exclamation-circle-fill fs-2 text-danger"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-danger" x-text="stats.pending"></div>
                                    <div class="text-muted small" x-text="t('Pending')"></div>
                                    <span class="text-danger small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('View')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sections: one entry per configured section -->
                    <div class="col-md-3" x-show="isSuperAdmin || profile?.section">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-info bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-buildings fs-2 text-info"></i>
                                </div>
                                <div>
                                    <div class="d-flex flex-wrap align-items-baseline gap-3">
                                        <template x-for="entry in sectionStatEntries()" :key="'sec-' + entry.key">
                                            <div>
                                                <span class="fs-3 fw-bold" :class="'text-' + sectionColor(entry.key)" x-text="entry.count"></span>
                                                <div class="text-muted small" x-text="entry.label"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="text-muted small" x-text="t('By Section')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sources: one entry per configured source of money -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-cash-coin fs-2 text-success"></i>
                                </div>
                                <div>
                                    <div class="d-flex flex-wrap align-items-baseline gap-3">
                                        <template x-for="entry in sourceStatEntries()" :key="'src-' + entry.key">
                                            <div>
                                                <span class="fs-3 fw-bold" :class="'text-' + sourceColor(entry.key)" x-text="entry.count"></span>
                                                <div class="text-muted small" x-text="entry.label"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="text-muted small" x-text="t('By Source of Money')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Recent Patients -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2 text-primary"></i><span x-text="t('Recent Patients')"></span></h5>
                        <a href="#" class="btn btn-sm btn-outline-primary" @click="navigate('patients')"><span x-text="t('View All')"></span></a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient')"></th>
                                        <th class="py-3" x-text="t('Problem')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Visit Date')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in recentPatients" :key="patient.id">
                                        <tr>
                                            <td class="ps-4">
                                                <a href="#" class="fw-semibold text-dark text-decoration-none" @click="showPatient(patient)" x-text="patient.name"></a>
                                            </td>
                                            <td class="text-muted" x-text="patient.problem ? (patient.problem.length > 60 ? patient.problem.substring(0,60)+'…' : patient.problem) : '—'"></td>
                                            <td>
                                                <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'">
                                                    <span x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <template x-if="patient.visit_date">
                                                    <span class="badge bg-light text-dark border" x-text="formatDate(patient.visit_date)"></span>
                                                </template>
                                                <template x-if="!patient.visit_date">
                                                    <span class="text-muted small">—</span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="recentPatients.length === 0">
                                        <td colspan="4" class="text-center py-4 text-muted" x-text="t('No patients recorded yet.')"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PATIENTS PAGE -->
            <div x-show="currentPage === 'patients'" x-cloak>
                <div class="row mb-4 align-items-center">
                    <div class="col-md-6">
                        <h2 class="text-secondary fw-bold mb-0">
                            <i class="bi bi-people-fill me-2 text-primary"></i><span x-text="t('Patients Management')"></span>
                        </h2>
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-success shadow-sm me-2" @click="exportPatients()" :disabled="exporting">
                            <span x-show="exporting" class="spinner-border spinner-border-sm me-1" x-cloak></span>
                            <i class="bi bi-file-earmark-spreadsheet me-1" x-show="!exporting"></i>
                            <span x-text="exporting ? t('Preparing...') : t('Excel')"></span>
                        </button>
                        <button class="btn btn-primary shadow-sm me-2" @click="openPatientForm()">
                            <i class="bi bi-person-plus-fill me-1"></i> <span x-text="t('Add New Patient')"></span>
                        </button>
                    </div>
                </div>

                <form @submit.prevent="handleFilter()" class="mb-4">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label text-muted small mb-1" x-text="t('Search')"></label>
                            <input type="text" class="form-control form-control-sm shadow-sm" x-model="patientFilters.search" :placeholder="t('Search any patient field...')">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1" x-text="t('Status')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.is_completed">
                                <option value="">All</option>
                                <option value="false" x-text="t('Pending')"></option>
                                <option value="true" x-text="t('Completed')"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1"><i class="bi bi-calendar-event me-1"></i><span x-text="t('Registered From')"></span></label>
                            <input type="date" class="form-control form-control-sm shadow-sm" x-model="patientFilters.date_from">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1"><i class="bi bi-calendar-event-fill me-1"></i><span x-text="t('Registered To')"></span></label>
                            <input type="date" class="form-control form-control-sm shadow-sm" x-model="patientFilters.date_to">
                        </div>
                        <div class="col-md-1 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100 shadow-sm"><i class="bi bi-search"></i></button>
                            <button type="button" class="btn btn-outline-secondary btn-sm shadow-sm" @click="resetFilters()"><i class="bi bi-x-lg"></i></button>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Follower')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.follower">
                                <option value="" x-text="t('-- All Followers --')"></option>
                                <template x-for="opt in activeOptions('follower')" :key="'fl-' + opt.key">
                                    <option :value="opt.key" x-text="optionLabel('follower', opt.key)"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Section')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.section">
                                <option value="" x-text="t('-- All Sections --')"></option>
                                <template x-for="opt in activeOptions('section')" :key="'fs-' + opt.key">
                                    <option :value="opt.key" x-text="optionLabel('section', opt.key)"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Source of Money')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.source_of_money">
                                <option value="" x-text="t('-- All Sources --')"></option>
                                <template x-for="opt in activeOptions('source')" :key="'fo-' + opt.key">
                                    <option :value="opt.key" x-text="optionLabel('source', opt.key)"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                </form>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light border-bottom text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient Name')"></th>
                                        <th class="py-3" x-text="t('National ID')"></th>
                                        <th class="py-3" x-text="t('Mobile No.')"></th>
                                        <th class="py-3" x-text="t('Governorate')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Follower')"></th>
                                        <th class="py-3" x-text="t('Source')"></th>
                                        <th class="py-3" x-text="t('Section')"></th>
                                        <th class="py-3" x-text="t('Registered Date')"></th>
                                        <th class="text-end pe-4 py-3" x-text="t('Actions')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in patients" :key="patient.id">
                                        <tr>
                                            <td class="ps-4">
                                                <span class="fw-bold text-dark d-block" x-text="patient.name"></span>
                                            </td>
                                            <td><code x-text="patient.national_id"></code></td>
                                            <td>
                                                <template x-if="patient.mobile">
                                                    <span><i class="bi bi-telephone text-muted me-1"></i><span x-text="patient.mobile"></span></span>
                                                </template>
                                                <template x-if="!patient.mobile">
                                                    <span class="text-muted"><em x-text="t('None')"></em></span>
                                                </template>
                                            </td>
                                            <td>
                                                <span class="badge bg-light text-dark border px-2 py-1">
                                                    <i class="bi bi-geo-alt-fill text-danger me-1"></i><span x-text="patient.governorate || 'N/A'"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <button class="btn btn-sm px-2 py-1" :class="patient.is_completed ? 'btn-success' : 'btn-outline-secondary'" @click="toggleStatus(patient)">
                                                    <template x-if="patient.is_completed">
                                                        <span><i class="bi bi-check-circle-fill me-1"></i><span x-text="t('Completed')"></span></span>
                                                    </template>
                                                    <template x-if="!patient.is_completed">
                                                        <span><i class="bi bi-circle me-1"></i><span x-text="t('Pending')"></span></span>
                                                    </template>
                                                </button>
                                            </td>
                                            <td>
                                                <span class="text-secondary fs-7"><i class="bi bi-person-badge me-1"></i><span x-text="followerLabel(patient.follower)"></span></span>
                                            </td>
                                            <td>
                                                <span class="text-secondary fs-7"><i class="bi bi-cash-coin me-1"></i><span x-text="patient.source_of_money ? optionLabel('source', patient.source_of_money) : '—'"></span></span>
                                            </td>
                                            <td>
                                                <span class="text-secondary fs-7"><i class="bi bi-building me-1"></i><span x-text="patient.section ? optionLabel('section', patient.section) : '—'"></span></span>
                                            </td>
                                            <td>
                                                <span class="text-muted small" x-text="new Date(patient.created_at).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})"></span>
                                            </td>
                                            <td class="text-end pe-4">
                                                <div class="btn-group" role="group">
                                                    <button class="btn btn-sm btn-outline-secondary" @click="showPatient(patient)" title="View">
                                                        <i class="bi bi-eye"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-primary" @click="editPatient(patient)" title="Edit">
                                                        <i class="bi bi-pencil-square"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-danger" @click="removePatient(patient)" title="Delete">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="patientsLoading">
                                        <td colspan="10" class="text-center py-5">
                                            <div class="spinner-border text-primary"></div>
                                        </td>
                                    </tr>
                                    <tr x-show="!patientsLoading && patients.length === 0">
                                        <td colspan="10" class="text-center py-5 text-muted">
                                            <i class="bi bi-folder-x fs-1 text-secondary d-block mb-2"></i>
                                            <span class="fw-semibold" x-text="t('No patients recorded yet.')"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI IMPORT AGENT (spec 10): files → preview → extract → review -->
            <div x-show="currentPage === 'import'" x-cloak x-data="importAgentWizard()" x-init="init()">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h2 class="text-secondary fw-bold mb-0">
                        <i class="bi bi-cloud-arrow-up-fill me-2 text-primary"></i><span x-text="t('importAgent.wizard.title')"></span>
                    </h2>
                    <div class="btn-group btn-group-sm" role="group" :aria-label="t('importAgent.wizard.title')">
                        <span class="btn" :class="step === 'add' || step === 'preview' ? 'btn-primary' : 'btn-outline-secondary'" x-text="t('importAgent.wizard.step.add')" aria-current="step"></span>
                        <span class="btn" :class="step === 'extracting' ? 'btn-primary' : 'btn-outline-secondary'" x-text="t('importAgent.wizard.step.extracting')"></span>
                        <span class="btn" :class="step === 'review' ? 'btn-primary' : 'btn-outline-secondary'" x-text="t('importAgent.wizard.step.review')"></span>
                    </div>
                </div>

                <div class="alert alert-danger d-flex justify-content-between align-items-start" role="alert" x-show="errorBanner" x-cloak>
                    <span x-text="errorBanner ? t(errorBanner.messageKey) : ''"></span>
                    <button type="button" class="btn-close" @click="errorBanner = null" :aria-label="t('Cancel')"></button>
                </div>

                <!-- resume bar (spec 10.1 resumability) -->
                <div class="alert alert-info d-flex justify-content-between align-items-center flex-wrap gap-2" x-show="resumable" x-cloak>
                    <span x-text="resumable ? t('importAgent.wizard.resumeHint', { status: t('importAgent.wizard.status.' + resumable.status) }) : ''"></span>
                    <button type="button" class="btn btn-sm btn-primary" @click="resume()" x-text="t('importAgent.wizard.resume')"></button>
                </div>

                <!-- STEP: ADD (spec 5) -->
                <template x-if="step === 'add'">
                    <div class="row g-4">
                        <div class="col-lg-7">
                            <div class="card shadow-sm mb-3">
                                <div class="card-body">
                                    <h5 class="card-title mb-2"><i class="bi bi-files me-2"></i><span x-text="t('importAgent.wizard.files')"></span></h5>
                                    <p class="small text-muted" x-text="t('importAgent.wizard.limits', { maxFiles, maxMb, maxRows })"></p>
                                    <label class="d-block border border-2 border-dashed rounded-3 p-4 text-center position-relative" style="cursor:pointer">
                                        <i class="bi bi-cloud-arrow-up fs-3 d-block text-primary"></i>
                                        <span class="small" x-text="t('importAgent.wizard.dropHere')"></span>
                                        <input type="file" class="position-absolute top-0 start-0 w-100 h-100 opacity-0" multiple
                                            @change="onFilesPicked($event)" :aria-label="t('importAgent.wizard.chooseFiles')">
                                    </label>
                                    <template x-if="files.length === 0">
                                        <p class="small text-muted mb-0 mt-2" x-text="t('importAgent.wizard.noFiles')"></p>
                                    </template>
                                    <ul class="list-group list-group-flush mt-2">
                                        <template x-for="file in files" :key="file.id">
                                            <li class="list-group-item px-0 d-flex justify-content-between align-items-start gap-2">
                                                <div class="flex-grow-1">
                                                    <div class="d-flex justify-content-between">
                                                        <span class="fw-semibold text-break"><i class="bi bi-file-earmark me-1"></i><span x-text="file.name"></span></span>
                                                        <button type="button" class="btn btn-sm btn-link text-danger p-0" @click="removeFile(file.id)" :aria-label="t('importAgent.wizard.removeFile')"><i class="bi bi-x-lg"></i></button>
                                                    </div>
                                                    <div class="small text-muted">
                                                        <span x-text="formatBytes(file.size ?? 0)"></span>
                                                        <template x-if="file.sha256"><span class="font-monospace ms-2" style="font-size:.68rem"><span x-text="file.sha256"></span></span></template>
                                                    </div>
                                                    <div x-show="file.error">
                                                        <span class="badge text-bg-danger" x-text="file.error ? t('importAgent.error.' + file.error.code) : ''"></span>
                                                    </div>
                                                    <div x-show="file.warnings && file.warnings.length > 0">
                                                        <template x-for="(warning, wIndex) in file.warnings" :key="wIndex">
                                                            <span class="badge text-bg-warning-subtle border border-warning-subtle me-1 text-body"
                                                                :title="warning.code" x-text="t('importAgent.warn.' + warning.code, warning.params ?? {})"></span>
                                                        </template>
                                                    </div>
                                                </div>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </div>

                            <div class="card shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title mb-2"><i class="bi bi-input-cursor-text me-2"></i><span x-text="t('importAgent.wizard.pasteTitle')"></span></h5>
                                    <p class="small text-muted" x-text="t('importAgent.wizard.pasteHint')"></p>
                                    <textarea class="form-control" rows="4" x-model="pastedText" @input="onPastedInput()"></textarea>
                                    <div class="mt-3">
                                        <label class="form-label small mb-1 fw-semibold"><span x-text="t('Section')"></span></label>
                                        <select class="form-select form-select-sm" x-model="section">
                                            <option value="">-- All Sections --</option>
                                            <template x-for="option in sectionOptions" :key="option.key">
                                                <option :value="option.key" x-text="optionDisplay(option)"></option>
                                            </template>
                                        </select>
                                        <div class="form-text" x-text="t('importAgent.wizard.sectionHint')"></div>
                                    </div>
                                    <div class="mt-3">
                                        <label class="form-label small mb-1 fw-semibold" x-text="t('importAgent.wizard.hints')"></label>
                                        <textarea class="form-control form-control-sm" rows="2" x-model="hints" :maxlength="2000"></textarea>
                                        <div class="form-text" x-text="t('importAgent.wizard.hintsHint')"></div>
                                    </div>
                                    <div class="d-flex justify-content-end gap-2 mt-3">
                                        <button type="button" class="btn btn-outline-primary" @click="prepare()" :disabled="addBlocked">
                                            <i class="bi bi-eye me-1"></i><span x-text="t('importAgent.preview.title')"></span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-5">
                            <template x-if="preview">
                                <div class="card shadow-sm">
                                    <div class="card-body">
                                        <h5 class="card-title mb-2" x-text="t('importAgent.preview.title')"></h5>
                                        <table class="table table-sm mb-2 small">
                                            <tbody>
                                                <tr><td x-text="t('importAgent.preview.sources')"></td><td class="text-end" x-text="preview.totals.sources"></td></tr>
                                                <tr><td x-text="t('importAgent.preview.rows')"></td><td class="text-end" x-text="preview.totals.rows"></td></tr>
                                                <tr><td x-text="t('importAgent.preview.characters')"></td><td class="text-end" x-text="preview.totals.chars"></td></tr>
                                                <tr><td x-text="t('importAgent.preview.images')"></td><td class="text-end" x-text="preview.totals.images"></td></tr>
                                            </tbody>
                                        </table>
                                        <p class="small text-muted mb-0" x-text="t('importAgent.preview.privacy', { days: preview.privacy.retentionDays })"></p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- STEP: PREVIEW (spec 5.3) -->
                <template x-if="step === 'preview'">
                    <div>
                        <div class="card shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title mb-3" x-text="t('importAgent.preview.title')"></h5>
                                <template x-if="preview">
                                    <div>
                                        <div class="row row-cols-2 row-cols-md-4 g-2 mb-3">
                                            <div class="col"><div class="border rounded p-2 text-center small"><div class="fw-bold" x-text="preview.totals.sources"></div><div class="text-muted" x-text="t('importAgent.preview.sources')"></div></div></div>
                                            <div class="col"><div class="border rounded p-2 text-center small"><div class="fw-bold" x-text="preview.totals.rows"></div><div class="text-muted" x-text="t('importAgent.preview.rows')"></div></div></div>
                                            <div class="col"><div class="border rounded p-2 text-center small"><div class="fw-bold" x-text="preview.totals.chars"></div><div class="text-muted" x-text="t('importAgent.preview.characters')"></div></div></div>
                                            <div class="col"><div class="border rounded p-2 text-center small"><div class="fw-bold" x-text="preview.totals.images"></div><div class="text-muted" x-text="t('importAgent.preview.images')"></div></div></div>
                                        </div>
                                        <div class="table-responsive">
                                            <table class="table table-sm align-middle small">
                                                <thead>
                                                    <tr>
                                                        <th x-text="t('importAgent.wizard.files')"></th>
                                                        <th x-text="t('importAgent.preview.rows')"></th>
                                                        <th x-text="t('importAgent.preview.characters')"></th>
                                                        <th class="d-none d-md-table-cell" x-text="t('importAgent.preview.columns')"></th>
                                                        <th class="d-none d-md-table-cell" x-text="t('importAgent.preview.images')"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <template x-for="entry in preview.entries" :key="entry.sourceId">
                                                        <tr>
                                                            <td><i class="bi bi-file-earmark-text me-1"></i><span x-text="entry.name"></span></td>
                                                            <td x-text="entry.rows ?? entry.lines ?? '—'"></td>
                                                            <td x-text="entry.chars"></td>
                                                            <td class="d-none d-md-table-cell"><span class="text-muted" x-text="previewEntryColumnLabel(entry)"></span></td>
                                                            <td class="d-none d-md-table-cell" x-text="entry.images || '—'"></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <p class="small text-muted" x-text="t('importAgent.preview.privacy', { days: preview.privacy.retentionDays })"></p>
                                    </div>
                                </template>
                                <div class="d-flex justify-content-between mt-3">
                                    <button type="button" class="btn btn-outline-secondary" @click="backToAdd()" x-text="t('importAgent.wizard.back')"></button>
                                    <button type="button" class="btn btn-primary" @click="extract()" :disabled="busy" x-text="busy ? t('importAgent.wizard.sending') : t('importAgent.preview.send')"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- STEP: EXTRACTING (spec 9) -->
                <template x-if="step === 'extracting'">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                                <h5 class="card-title mb-0">
                                    <span class="spinner-border spinner-border-sm text-primary me-2"></span>
                                    <span x-text="t('importAgent.progress.working')"></span>
                                </h5>
                                <button type="button" class="btn btn-sm btn-outline-danger" @click="cancelJob()" x-text="t('importAgent.wizard.cancel')"></button>
                            </div>
                            <div class="d-flex justify-content-between small mb-1">
                                <span x-text="t('importAgent.progress.chunks', { done: progress.done, total: progress.total })"></span>
                                <span x-text="progress.tokens ? t('importAgent.progress.tokens', { used: progress.tokens.in + progress.tokens.out, cap: progress.tokens.cap }) : ''"></span>
                            </div>
                            <div class="progress mb-3" style="height:1.2rem">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" :style="'width:' + (progress.total > 0 ? Math.round(100 * progress.done / progress.total) : 0) + '%'"></div>
                            </div>
                            <p class="small text-muted mb-2" x-show="progress.nextLabel" x-text="t('importAgent.progress.next', { label: progress.nextLabel })"></p>
                            <div class="alert alert-warning py-2 small" role="alert" x-show="banners.length > 0">
                                <template x-for="(banner, bIndex) in banners" :key="bIndex">
                                    <div x-text="t('importAgent.warn.' + banner.code, { count: banner.count })"></div>
                                </template>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-warning" @click="retryFailed()" x-show="progress.failed > 0"
                                x-text="t('importAgent.review.retryChunk') + ' (' + progress.failed + ')'"></button>
                        </div>
                    </div>
                </template>

                <!-- STEP: REVIEW (spec 10.3–10.9) -->
                <template x-if="step === 'review'">
                    <div>
                        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
                            <div>
                                <h5 class="mb-1" x-text="t('importAgent.review.title')"></h5>
                                <div class="small text-muted" x-text="t('importAgent.review.counts', { total: counts.all, attention: counts.attention })"></div>
                            </div>
                            <span role="status" class="small text-success"
                                x-text="saveState === 'saving' ? t('importAgent.review.autosave.saving') : saveState === 'failed' ? t('importAgent.review.autosave.failed') : t('importAgent.review.autosave.saved')"></span>
                        </div>

                        <div class="alert alert-danger py-2 small" role="alert" x-show="saveState === 'failed'" x-cloak x-text="t('importAgent.review.autosave.failed')"></div>
                        <div class="alert alert-warning py-2 small" role="alert" x-show="banners.length > 0">
                            <template x-for="(banner, bIndex) in banners" :key="bIndex">
                                <div x-text="t('importAgent.warn.' + banner.code, { count: banner.count })"></div>
                            </template>
                            <button type="button" class="btn btn-sm btn-outline-warning mt-1" @click="retryFailed()" x-show="hasFailedChunks"
                                x-text="t('importAgent.review.retryChunk')"></button>
                        </div>

                        <!-- filter pills (spec 10.2) -->
                        <div class="d-flex flex-wrap gap-2 mb-2" role="tablist">
                            <template x-for="pill in ['all', 'attention', 'errors', 'duplicates', 'edited', 'removed']" :key="pill">
                                <button type="button" class="btn btn-sm" role="tab"
                                    :class="filter === pill ? 'btn-primary' : 'btn-outline-secondary'"
                                    :aria-selected="filter === pill ? 'true' : 'false'"
                                    @click="filter = pill; selected = []"
                                    x-text="t('importAgent.review.pill.' + pill) + ' (' + counts[pill] + ')'"></button>
                            </template>
                        </div>

                        <!-- defaults panel (spec 10.2) -->
                        <div class="card shadow-sm mb-2" x-show="showDefaults" x-cloak>
                            <div class="card-body py-2">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="fw-semibold"><i class="bi bi-magic me-1"></i><span x-text="t('importAgent.review.defaults.title')"></span></span>
                                    <button type="button" class="btn-close" @click="showDefaults = false" :aria-label="t('Cancel')"></button>
                                </div>
                                <p class="small text-muted mb-2" x-text="t('importAgent.review.defaults.hint')"></p>
                                <div class="row g-2">
                                    <template x-for="field in bulkFields" :key="field.key">
                                        <div class="col-md-4 col-lg-3">
                                            <label class="form-label small mb-0" x-text="fieldLabel(field.key)"></label>
                                            <template x-if="editorType(field.key) === 'select'">
                                                <select class="form-select form-select-sm" x-model="defaultsDraft[field.key]">
                                                    <option value="">--</option>
                                                    <template x-for="optionItem in editorOptions(field.key)" :key="optionItem.value">
                                                        <option :value="optionItem.value" x-text="optionItem.label"></option>
                                                    </template>
                                                </select>
                                            </template>
                                            <template x-if="editorType(field.key) === 'date'">
                                                <input type="text" class="form-control form-control-sm" placeholder="dd/mm/yyyy" x-model="defaultsDraft[field.key]">
                                            </template>
                                            <template x-if="editorType(field.key) === 'number'">
                                                <input type="number" step="any" class="form-control form-control-sm" dir="ltr" x-model="defaultsDraft[field.key]">
                                            </template>
                                            <template x-if="editorType(field.key) === 'text'">
                                                <input type="text" class="form-control form-control-sm" x-model="defaultsDraft[field.key]">
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                <div class="text-end mt-2">
                                    <button type="button" class="btn btn-sm btn-primary" @click="applyDefaults()" x-text="t('importAgent.review.defaults.apply')"></button>
                                </div>
                            </div>
                        </div>

                        <!-- toolbar (spec 10.5, 10.6) -->
                        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
                            <button type="button" class="btn btn-sm btn-outline-primary" @click="showDefaults = !showDefaults" :aria-expanded="showDefaults ? 'true' : 'false'">
                                <i class="bi bi-magic me-1"></i><span x-text="t('importAgent.review.defaults.title')"></span>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" @click="addRowAction()"><i class="bi bi-plus-lg me-1"></i><span x-text="t('importAgent.review.addRow')"></span></button>
                            <button type="button" class="btn btn-sm btn-outline-danger" @click="deleteSelected()" :disabled="selectedCount === 0"><i class="bi bi-trash"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-danger" @click="restoreSelected()" :disabled="selectedCount === 0" x-show="filter === 'removed'"><i class="bi bi-arrow-counterclockwise"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" @click="openBulk()" :disabled="selectedCount === 0"><i class="bi bi-pencil-square me-1"></i><span x-text="t('importAgent.review.setValue')"></span></button>
                            <button type="button" class="btn btn-sm btn-outline-success" @click="markReviewedSelected()" :disabled="selectedCount === 0"><i class="bi bi-check2-square me-1"></i><span x-text="t('importAgent.review.markReviewed')"></span></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" @click="undo()" :disabled="undoStack.length === 0"><i class="bi bi-arrow-counterclockwise"></i></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" @click="redo()" :disabled="redoStack.length === 0"><i class="bi bi-arrow-clockwise"></i></button>
                            <span class="small text-muted" x-show="selectedCount > 0" x-text="t('importAgent.review.selected', { count: selectedCount })"></span>
                            <div class="ms-auto btn-group btn-group-sm">
                                <button type="button" class="btn" :class="tray === 'rejected' ? 'btn-warning' : 'btn-outline-secondary'" @click="selectTray('rejected')">
                                    <span x-text="t('importAgent.review.tray.rejected')"></span> (<span x-text="rejectedCount"></span>)
                                </button>
                                <button type="button" class="btn" :class="tray === 'removed' ? 'btn-warning' : 'btn-outline-secondary'" @click="selectTray('removed')">
                                    <span x-text="t('importAgent.review.tray.removed')"></span> (<span x-text="removedCount"></span>)
                                </button>
                            </div>
                        </div>

                        <!-- trays (spec 10.7) -->
                        <div class="card shadow-sm mb-2" x-show="tray === 'rejected'" x-cloak>
                            <div class="card-body py-2">
                                <template x-if="rejectedCount === 0"><p class="small text-muted mb-0" x-text="t('importAgent.review.tray.empty')"></p></template>
                                <template x-for="item in rejectedItems" :key="item.id">
                                    <div class="border rounded p-2 mb-2 small">
                                        <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap">
                                            <span class="badge text-bg-secondary" x-text="trayReasonLabel(item.reason)"></span>
                                            <span class="text-muted" x-text="item.chunk_id ? chunkRef(item.chunk_id) : ''"></span>
                                        </div>
                                        <div class="my-1 text-break" x-text="item.raw"></div>
                                        <div class="d-flex flex-wrap gap-1">
                                            <template x-if="trayRow(item) && trayRow(item).chunk_id && item.reason === 'UNMAPPED'">
                                                <div class="d-flex flex-wrap gap-1">
                                                    <span class="small text-muted me-1" x-text="t('importAgent.review.tray.moveTo')" x-cloak></span>
                                                    <template x-for="target in ['address', 'problem', 'solution', 'notes']" :key="target">
                                                        <button type="button" class="btn btn-sm btn-outline-secondary py-0" @click="moveUnmapped(item, target)" x-text="fieldLabel(target)"></button>
                                                    </template>
                                                </div>
                                            </template>
                                            <template x-if="trayRow(item)">
                                                <button type="button" class="btn btn-sm btn-outline-secondary py-0" @click="showSource(trayRow(item))"><i class="bi bi-search me-1"></i></button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                        <div class="card shadow-sm mb-2" x-show="tray === 'removed'" x-cloak>
                            <div class="card-body py-2">
                                <template x-if="removedCount === 0"><p class="small text-muted mb-0" x-text="t('importAgent.review.tray.empty')"></p></template>
                                <template x-for="row in (reviewState ? reviewState.rows.filter(r => r.removed) : [])" :key="row.id">
                                    <div class="d-flex justify-content-between align-items-center border rounded p-2 mb-1 small">
                                        <span><span class="text-muted me-2" x-text="'#' + row.seq"></span><span x-text="row.cells?.name?.value ?? ''"></span></span>
                                        <button type="button" class="btn btn-sm btn-outline-secondary py-0" @click="restoreRemovedRow(row)" x-text="t('importAgent.review.tray.restore')"></button>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- keyboard hint -->
                        <p class="small text-muted mb-1 d-none d-lg-block" x-text="t('importAgent.review.kbdHint')"></p>

                        <!-- GRID (lg+), virtualized window (spec 10.3) -->
                        <div class="card shadow-sm d-none d-lg-block">
                            <div class="ia-grid-scroll" x-ref="gridScroll" @scroll="onGridScroll($event)" tabindex="0">
                                <table class="table table-sm table-hover align-middle mb-0 ia-grid">
                                    <colgroup>
                                        <col class="ia-col-check">
                                        <col class="ia-col-status">
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col>
                                        <col class="ia-col-actions">
                                    </colgroup>
                                    <thead class="table-light ia-head" style="position:sticky;top:0;z-index:2">
                                        <tr>
                                            <th class="text-center"><input type="checkbox" :checked="allVisibleSelected" @change="toggleSelectAll()" :aria-label="selectedCount > 0 ? t('importAgent.review.selected', { count: selectedCount }) : ''"></th>
                                            <th x-text="t('Status')"></th>
                                            <template x-for="field in fields" :key="field.key">
                                                <th class="ia-th text-truncate" :title="fieldLabel(field.key)" x-text="fieldLabel(field.key)"></th>
                                            </template>
                                            <th class="text-center"><i class="bi bi-arrows-angle-expand" role="img" :title="t('importAgent.review.drawer.title')"></i></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr aria-hidden="true"><td colspan="20" :style="'height:' + gridWindow.padTop + 'px;border:0;padding:0'"></td></tr>
                                        <template x-for="row in windowRows" :key="row.id">
                                            <tr :class="rowSelected(row) ? 'table-active' : ''">
                                                <td class="text-center ia-check">
                                                    <input type="checkbox" :checked="rowSelected(row)" @change="toggleSelect(row)" :aria-label="'row ' + row.seq">
                                                </td>
                                                <td class="ia-td-status">
                                                    <span class="badge" :class="statusChip(row).cls" x-text="statusChip(row).label"></span>
                                                    <div class="ia-badges small">
                                                        <template x-for="(badge, badgeIndex) in rowBadges(row)" :key="badgeIndex">
                                                            <span class="badge text-bg-light border ia-badge" x-text="badge"></span>
                                                        </template>
                                                    </div>
                                                </td>
                                                <template x-for="field in fields" :key="field.key">
                                                    <td class="ia-td" :class="cellStateClass(row, field.key)" :title="cellTitle(row, field.key)">
                                                        <div class="d-flex align-items-center gap-1">
                                                            <template x-if="editorType(field.key) === 'select'">
                                                                <select class="form-select form-select-sm ia-editor"
                                                                    :value="editorValue(row, field.key)"
                                                                    @change="onEnumChange(row, field.key, $event.target.value)"
                                                                    @keydown="onCellKeydown($event, row, field.key)">
                                                                    <option value="">--</option>
                                                                    <template x-for="optionItem in editorOptions(field.key)" :key="optionItem.value">
                                                                        <option :value="optionItem.value" x-text="optionItem.label" :selected="String(optionItem.value) === String(editorValue(row, field.key))"></option>
                                                                    </template>
                                                                </select>
                                                            </template>
                                                            <template x-if="editorType(field.key) === 'date'">
                                                                <div class="input-group input-group-sm ia-editor-group">
                                                                    <input type="text" class="form-control" :dir="editorDir(field.key) || undefined" placeholder="dd/mm/yyyy"
                                                                        :value="editorValue(row, field.key)"
                                                                        @focus="onEditorFocus(row, field.key)"
                                                                        @input="onEditorInput(row, field.key, $event.target.value)"
                                                                        @blur="onEditorBlur(row, field.key)"
                                                                        @keydown="onCellKeydown($event, row, field.key)">
                                                                    <input type="date" class="form-control ia-date-trigger" :aria-label="fieldLabel(field.key)"
                                                                        @change="onDatePicked(row, field.key, $event)">
                                                                </div>
                                                            </template>
                                                            <template x-if="editorType(field.key) === 'number'">
                                                                <input type="number" step="any" class="form-control form-control-sm ia-editor" :dir="editorDir(field.key) || undefined"
                                                                    :value="editorValue(row, field.key)"
                                                                    @focus="onEditorFocus(row, field.key)"
                                                                    @input="onEditorInput(row, field.key, $event.target.value)"
                                                                    @blur="onEditorBlur(row, field.key)"
                                                                    @keydown="onCellKeydown($event, row, field.key)">
                                                            </template>
                                                            <template x-if="editorType(field.key) === 'text'">
                                                                <input type="text" class="form-control form-control-sm ia-editor" :dir="editorDir(field.key) || undefined"
                                                                    :value="editorValue(row, field.key)"
                                                                    @focus="onEditorFocus(row, field.key)"
                                                                    @input="onEditorInput(row, field.key, $event.target.value)"
                                                                    @blur="onEditorBlur(row, field.key)"
                                                                    @keydown="onCellKeydown($event, row, field.key)">
                                                            </template>
                                                            <template x-if="editorType(field.key) === 'notes'">
                                                                <button type="button" class="btn btn-sm ia-editor ia-notes"
                                                                    @click="openDrawer(row, 'notes')"
                                                                    :title="cellTitle(row, field.key) || fieldLabel(field.key)">
                                                                    <span x-text="editorPlaceholder(row, field.key) || '…'"></span>
                                                                </button>
                                                            </template>
                                                            <i class="ia-icon" x-show="cellIconClass(row, field.key)" :class="cellIconClass(row, field.key)"
                                                                :title="cellTitle(row, field.key)"></i>
                                                        </div>
                                                    </td>
                                                </template>
                                                <td class="text-center">
                                                    <button type="button" class="btn btn-sm btn-link p-0 text-primary"
                                                        @click="openDrawer(row, null)" :aria-label="t('importAgent.review.drawer.title')" :title="t('importAgent.review.drawer.title')">
                                                        <i class="bi bi-arrows-fullscreen"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        </template>
                                        <tr aria-hidden="true"><td colspan="20" :style="'height:' + gridWindow.padBottom + 'px;border:0;padding:0'"></td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- CARDS (below lg) -->
                        <div class="d-lg-none">
                            <template x-for="row in cardRows" :key="row.id">
                                <div class="card mb-2" :class="rowSelected(row) ? 'border-primary' : ''" @click="openDrawer(row)">
                                    <div class="card-body py-2">
                                        <div class="d-flex justify-content-between align-items-center gap-2" @click.stop>
                                            <input class="form-check-input mt-0" type="checkbox" :checked="rowSelected(row)" @change="toggleSelect(row)" :aria-label="'row ' + row.seq">
                                            <span class="badge" :class="statusChip(row).cls" x-text="statusChip(row).label"></span>
                                            <span class="text-muted small" x-text="'#' + row.seq"></span>
                                        </div>
                                        <div class="mt-1">
                                            <span class="fw-semibold" x-text="editorValue(row, 'name')"></span>
                                            <span class="small text-muted ms-2" dir="ltr" x-text="editorValue(row, 'national_id')"></span>
                                        </div>
                                        <div class="small text-muted">
                                            <span dir="ltr" x-text="editorValue(row, 'date_of_birth')"></span>
                                            <span class="ms-2" dir="ltr" x-text="editorValue(row, 'mobile')"></span>
                                        </div>
                                        <template x-if="cellIssueList(row, null).length > 0">
                                            <div class="small text-danger mt-1 text-truncate" x-text="cellIssueList(row, null).join(' · ')"></div>
                                        </template>
                                        <div class="mt-1 d-flex gap-1" @click.stop>
                                            <button type="button" class="btn btn-sm btn-outline-secondary py-0" @click="openDrawer(row)" x-text="t('Edit')"></button>
                                            <button type="button" class="btn btn-sm btn-outline-secondary py-0" @click="showSource(row, null)"><i class="bi bi-search"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <button type="button" class="btn btn-sm btn-outline-secondary mb-3" x-show="visibleRows.length > cardLimit" @click="cardLimit += 30" x-text="'+ 30'"></button>
                        </div>

                        <!-- footer + confirmation gate (spec 10.9) -->
                        <div class="card shadow-sm mt-2">
                            <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
