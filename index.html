<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light" x-data="app()" x-init="init()">

    <div class="page-loader" x-show="loading" x-cloak>
        <div class="spinner"></div>
    </div>

    <div x-show="!loading" x-cloak>

        <!-- NAVBAR (desktop) -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4" x-show="isLoggedIn">
            <div class="container">
                <span class="navbar-brand" @click="navigate('dashboard')" style="cursor:pointer">
                    <i class="bi bi-heart-pulse-fill me-2"></i><span x-text="t('HealthCare Clinic')"></span>
                </span>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Global patient search: one box, no options. -->
                    <div class="global-search position-relative" @click.outside="closeGlobalSearch({ clearFocus: true })">
                        <div class="position-relative">
                            <i class="bi bi-search global-search-icon" aria-hidden="true"></i>
                            <input
                                type="search"
                                class="form-control global-search-input"
                                x-model="globalSearch"
                                @input.debounce="onGlobalInput()"
                                @focus="globalSearchFocused = true"
                                @keydown="onGlobalKeydown($event)"
                                :placeholder="t('Search patients...')"
                                :aria-label="t('Search patients...')"
                                autocomplete="off"
                            >
                            <span class="global-search-spinner spinner-border spinner-border-sm text-light" x-show="globalSearchLoading" x-cloak></span>
                        </div>
                        <div class="global-search-menu list-group shadow" x-show="globalSearchFocused && globalSearch && (globalSuggestions().length || globalSearchLoading)" x-cloak>
                            <template x-for="(patient, index) in globalSuggestions()" :key="patient.id">
                                <button type="button" class="list-group-item list-group-item-action global-search-item"
                                    :class="{ 'active': index === globalSearchSelectedIndex }"
                                    @click="pickGlobalResult(patient)"
                                    @mousemove="globalSearchSelectedIndex = index"
                                >
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-person-circle text-primary fs-5"></i>
                                        <div class="flex-grow-1 text-start">
                                            <div class="fw-semibold" x-text="patient.name"></div>
                                            <div class="small text-muted d-flex flex-wrap gap-2">
                                                <span x-show="patient.national_id"><i class="bi bi-credit-card-2-front"></i> <span x-text="patient.national_id"></span></span>
                                                <span x-show="patient.mobile"><i class="bi bi-telephone"></i> <span x-text="patient.mobile"></span></span>
                                                <span x-show="patient.section"><i class="bi bi-building"></i> <span x-text="patient.section === 'agamy' ? t('Agamy') : t('Dekhila')"></span></span>
                                                <span x-show="patient.governorate"><i class="bi bi-geo-alt"></i> <span x-text="patient.governorate"></span></span>
                                            </div>
                                        </div>
                                        <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'" x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                    </div>
                                </button>
                            </template>
                            <button type="button" class="list-group-item list-group-item-action text-primary fw-semibold global-search-item" @click="runGlobalList()">
                                <i class="bi bi-arrow-right-short"></i>
                                <span x-text="t('See all results')"></span>
                            </button>
                        </div>
                    </div>
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'dashboard' }" @click="navigate('dashboard')" style="cursor:pointer">
                                <i class="bi bi-speedometer2 me-1"></i><span x-text="t('Dashboard')"></span>
                            </span>
                        </li>
                        <li class="nav-item" x-show="isSuperAdmin">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'users' }" @click="navigate('users')" style="cursor:pointer">
                                <i class="bi bi-person-badge me-1"></i><span x-text="t('Users')"></span>
                            </span>
                        </li>
                        <li class="nav-item" x-show="isSuperAdmin">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'prices' }" @click="navigate('prices')" style="cursor:pointer">
                                <i class="bi bi-currency-dollar me-1"></i><span x-text="t('Prices')"></span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'patients' }" @click="navigate('patients')" style="cursor:pointer">
                                <i class="bi bi-people me-1"></i><span x-text="t('Patients')"></span>
                            </span>
                        </li>
                        <li class="nav-item ms-3 dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle fs-5"></i>
                                <span x-text="profile?.name || user?.email || 'User'"></span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <span class="dropdown-item-text text-muted small" x-text="user?.email"></span>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <button class="dropdown-item text-danger" @click="logout()">
                                        <i class="bi bi-box-arrow-right me-2"></i><span x-text="t('Logout')"></span>
                                    </button>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item ms-2">
                            <button class="btn btn-sm btn-outline-light fw-semibold" @click="toggleLocale()">
                                <i class="bi bi-translate me-1"></i><span x-text="localeLabel"></span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container page-container">

            <!-- Global alert bar (showAlert). Auto-hides after a few seconds. -->
            <div class="alert alert-dismissible fade show" :class="'alert-' + alertType" x-show="alertMessage" x-cloak x-transition role="alert" aria-live="polite">
                <span x-text="alertMessage"></span>
                <button type="button" class="btn-close" @click="alertMessage = null" aria-label="Close"></button>
            </div>

            <!-- LOGIN PAGE -->
            <div x-show="currentPage === 'login'" x-cloak>
                <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
                    <div>
                        <a href="#" @click.prevent="navigate('dashboard')" x-cloak>
                            <i class="bi bi-heart-pulse-fill text-muted" style="font-size:3.5rem"></i>
                        </a>
                    </div>
                    <div class="w-100 mt-4 px-4 py-4 bg-white shadow overflow-hidden rounded" style="max-width: 28rem;">
                        <form @submit.prevent="handleLogin()">
                            <div class="alert alert-danger py-2" x-show="loginError" x-cloak x-transition role="alert" aria-live="assertive">
                                <div class="d-flex align-items-start gap-2">
                                    <i class="bi bi-exclamation-circle-fill mt-1"></i>
                                    <span x-text="loginError"></span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" x-text="t('Email')"></label>
                                <input id="email" type="email" class="form-control" x-model="loginForm.email" required autofocus autocomplete="username">
                            </div>
                            <div class="mt-4 mb-3">
                                <label class="form-label" x-text="t('Password')"></label>
                                <input id="password" type="password" class="form-control" x-model="loginForm.password" required autocomplete="current-password">
                            </div>
                            <div class="mb-4">
                                <label class="form-check form-check-inline">
                                    <input type="checkbox" class="form-check-input" name="remember">
                                    <span class="ms-2 small text-muted" x-text="t('Remember me')"></span>
                                </label>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-4">
                                <a href="#" class="text-decoration-none small text-muted" x-text="t('Forgot your password?')"></a>
                                <button type="submit" class="btn btn-primary" :disabled="loginLoading">
                                    <span x-show="loginLoading" class="spinner-border spinner-border-sm me-1"></span>
                                    <span x-text="t('Log in')"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD PAGE -->
            <div x-show="currentPage === 'dashboard'" x-cloak>
                <!-- Welcome Banner -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h2 class="fw-bold text-secondary mb-0">
                            <i class="bi bi-speedometer2 me-2 text-primary"></i><span x-text="t('Dashboard')"></span>
                        </h2>
                        <small class="text-muted"><span x-text="t('Welcome back,')"></span> <strong x-text="profile?.name"></strong></small>
                    </div>
                    <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i><span x-text="currentDate"></span></span>
                </div>

                <!-- Stats Cards -->
                <div class="row g-4 mb-4">

                    <!-- Total Patients -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-primary bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-people-fill fs-2 text-primary"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.total"></div>
                                    <div class="text-muted small" x-text="t('Total Patients')"></div>
                                    <span class="text-primary small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('Manage')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Completed -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-check-circle-fill fs-2 text-success"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.completed"></div>
                                    <div class="text-muted small" x-text="t('Completed')"></div>
                                    <span class="text-success small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('View')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pending -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-danger bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-exclamation-circle-fill fs-2 text-danger"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-danger" x-text="stats.pending"></div>
                                    <div class="text-muted small" x-text="t('Pending')"></div>
                                    <span class="text-danger small" @click="navigate('patients')" style="cursor:pointer">
                                        <span x-text="t('View')"></span> <i class="bi bi-arrow-right"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Dekhila -->
                    <div class="col-md-3" x-show="isSuperAdmin || profile?.section === 'dekhila'">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-info bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-building fs-2 text-info"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.dekhila"></div>
                                    <div class="text-muted small" x-text="t('Dekhila')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Agamy -->
                    <div class="col-md-3" x-show="isSuperAdmin || profile?.section === 'agamy'">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-warning bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-building fs-2 text-warning"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.agamy"></div>
                                    <div class="text-muted small" x-text="t('Agamy')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Charity -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-heart-fill fs-2 text-success"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.charity"></div>
                                    <div class="text-muted small" x-text="t('Charity')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Country -->
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="bg-primary bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-flag-fill fs-2 text-primary"></i>
                                </div>
                                <div>
                                    <div class="fs-2 fw-bold text-dark" x-text="stats.country"></div>
                                    <div class="text-muted small" x-text="t('Country')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Recent Patients -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2 text-primary"></i><span x-text="t('Recent Patients')"></span></h5>
                        <a href="#" class="btn btn-sm btn-outline-primary" @click="navigate('patients')"><span x-text="t('View All')"></span></a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient')"></th>
                                        <th class="py-3" x-text="t('Problem')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Visit Date')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in recentPatients" :key="patient.id">
                                        <tr>
                                            <td class="ps-4">
                                                <a href="#" class="fw-semibold text-dark text-decoration-none" @click="showPatient(patient)" x-text="patient.name"></a>
                                            </td>
                                            <td class="text-muted" x-text="patient.problem ? (patient.problem.length > 60 ? patient.problem.substring(0,60)+'…' : patient.problem) : '—'"></td>
                                            <td>
                                                <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'">
                                                    <span x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <template x-if="patient.visit_date">
                                                    <span class="badge bg-light text-dark border" x-text="formatDate(patient.visit_date)"></span>
                                                </template>
                                                <template x-if="!patient.visit_date">
                                                    <span class="text-muted small">—</span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="recentPatients.length === 0">
                                        <td colspan="4" class="text-center py-4 text-muted" x-text="t('No patients recorded yet.')"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PATIENTS PAGE -->
            <div x-show="currentPage === 'patients'" x-cloak>
                <div class="row mb-4 align-items-center">
                    <div class="col-md-6">
                        <h2 class="text-secondary fw-bold mb-0">
                            <i class="bi bi-people-fill me-2 text-primary"></i><span x-text="t('Patients Management')"></span>
                        </h2>
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-success shadow-sm me-2" @click="exportPatients()" :disabled="exporting">
                            <span x-show="exporting" class="spinner-border spinner-border-sm me-1" x-cloak></span>
                            <i class="bi bi-file-earmark-spreadsheet" x-show="!exporting"></i>
                            <span x-text="exporting ? t('Preparing...') : t('Export Excel')"></span>
                        </button>
                        <button class="btn btn-primary shadow-sm" @click="openPatientForm()">
                            <i class="bi bi-person-plus-fill me-1"></i> <span x-text="t('Add New Patient')"></span>
                        </button>
                    </div>
                </div>

                <form @submit.prevent="handleFilter()" class="mb-4">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-3">
                            <label class="form-label text-muted small mb-1" x-text="t('Search')"></label>
                            <input type="text" class="form-control form-control-sm shadow-sm" x-model="patientFilters.search" :placeholder="t('Search any patient field...')">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1" x-text="t('Status')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.is_completed">
                                <option value="">All</option>
                                <option value="false" x-text="t('Pending')"></option>
                                <option value="true" x-text="t('Completed')"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1"><i class="bi bi-calendar-event me-1"></i><span x-text="t('Registered From')"></span></label>
                            <input type="date" class="form-control form-control-sm shadow-sm" x-model="patientFilters.date_from">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label text-muted small mb-1"><i class="bi bi-calendar-event-fill me-1"></i><span x-text="t('Registered To')"></span></label>
                            <input type="date" class="form-control form-control-sm shadow-sm" x-model="patientFilters.date_to">
                        </div>
                        <div class="col-md-1 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm w-100 shadow-sm"><i class="bi bi-search"></i></button>
                            <button type="button" class="btn btn-outline-secondary btn-sm shadow-sm" @click="resetFilters()"><i class="bi bi-x-lg"></i></button>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Follower')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.follower">
                                <option value="" x-text="t('-- All Followers --')"></option>
                                <template x-for="(label, key) in followerOptions" :key="key">
                                    <option :value="key" x-text="label"></option>
                                </template>
                            </select>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Section')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.section">
                                <option value="" x-text="t('-- All Sections --')"></option>
                                <option value="agamy" x-text="t('Agamy')"></option>
                                <option value="dekhila" x-text="t('Dekhila')"></option>
                            </select>
                        </div>
                        <div class="col-md-4" x-show="isSuperAdmin">
                            <label class="form-label text-muted small mb-1" x-text="t('Source of Money')"></label>
                            <select class="form-select form-select-sm shadow-sm" x-model="patientFilters.source_of_money">
                                <option value="" x-text="t('-- All Sources --')"></option>
                                <option value="charity" x-text="t('Charity')"></option>
                                <option value="country" x-text="t('Country')"></option>
                            </select>
                        </div>
                    </div>
                </form>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light border-bottom text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient Name')"></th>
                                        <th class="py-3" x-text="t('National ID')"></th>
                                        <th class="py-3" x-text="t('Mobile No.')"></th>
                                        <th class="py-3" x-text="t('Governorate')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Follower')"></th>
                                        <th class="py-3" x-text="t('Source')"></th>
                                        <th class="py-3" x-text="t('Section')"></th>
                                        <th class="py-3" x-text="t('Registered Date')"></th>
                                        <th class="text-end pe-4 py-3" x-text="t('Actions')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in patients" :key="patient.id">
                                        <tr>
                                            <td class="ps-4">
                                                <span class="fw-bold text-dark d-block" x-text="patient.name"></span>
                                            </td>
                                            <td><code x-text="patient.national_id"></code></td>
                                            <td>
                                                <template x-if="patient.mobile">
                                                    <span><i class="bi bi-telephone text-muted me-1"></i><span x-text="patient.mobile"></span></span>
                                                </template>
                                                <template x-if="!patient.mobile">
                                                    <span class="text-muted"><em x-text="t('None')"></em></span>
                                                </template>
                                            </td>
                                            <td>
                                                <span class="badge bg-light text-dark border px-2 py-1">
                                                    <i class="bi bi-geo-alt-fill text-danger me-1"></i><span x-text="patient.governorate || 'N/A'"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <button class="btn btn-sm px-2 py-1" :class="patient.is_completed ? 'btn-success' : 'btn-outline-secondary'" @click="toggleStatus(patient)">
                                                    <template x-if="patient.is_completed">
                                                        <span><i class="bi bi-check-circle-fill me-1"></i><span x-text="t('Completed')"></span></span>
                                                    </template>
                                                    <template x-if="!patient.is_completed">
                                                        <span><i class="bi bi-circle me-1"></i><span x-text="t('Pending')"></span></span>
                                                    </template>
                                                </button>
                                            </td>
                                            <td>
                                                <span class="text-secondary fs-7"><i class="bi bi-person-badge me-1"></i><span x-text="followerLabel(patient.follower)"></span></span>
                                            </td>

                                    <div class="mb-4">
                                        <h6 class="text-primary border-bottom pb-2 fw-bold">
                                            <i class="bi bi-clipboard2-pulse me-2"></i><span x-text="t('4. Consultation / Visit Data')"></span>
                                        </h6>
                                        <div class="row g-3">
                                            <div class="col-12">
                                                <label class="form-label fw-semibold text-danger">
                                                    <i class="bi bi-exclamation-triangle-fill me-1"></i><span x-text="t('Presented Symptoms / Problem')"></span>
                                                </label>
                                                <textarea rows="3" class="form-control" x-model="patientForm.problem" :placeholder="t('Describe the clinical symptoms or complaints...')"></textarea>
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label fw-semibold text-success">
                                                    <i class="bi bi-prescription me-1"></i><span x-text="t('Diagnosis & Treatment Plan')"></span>
                                                </label>
                                                <textarea rows="3" class="form-control" x-model="patientForm.solution" :placeholder="t('Medical prescriptions, lab workups, treatment plan...')"></textarea>
                                            </div>
                                            <div class="col-md-5">
                                                <label class="form-label fw-semibold">
                                                    <i class="bi bi-calendar-check-fill text-primary me-1"></i><span x-text="t('Visit Date')"></span>
                                                </label>
                                                <input type="date" class="form-control" x-model="patientForm.visit_date">
                                            </div>
                                            <div class="col-md-4">
                                                <label class="form-label fw-semibold">
                                                    <i class="bi bi-currency-dollar text-success me-1"></i><span x-text="t('Price (EGP)')"></span>
                                                </label>
                                                <input type="number" min="0" step="0.01" class="form-control" x-model="patientForm.price" placeholder="0.00">
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label fw-semibold">
                                                    <i class="bi bi-person-check-fill text-info me-1"></i><span x-text="t('Follower')"></span>
                                                </label>
                                                <select class="form-select" x-model="patientForm.follower" dir="rtl">
                                                    <option value="">-- اختر المتابع --</option>
                                                    <template x-for="(label, key) in followerOptions" :key="key">
                                                        <option :value="key" x-text="label"></option>
                                                    </template>
                                                </select>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">
                                                    <i class="bi bi-building me-1"></i><span x-text="t('Section')"></span>
                                                </label>
                                                <template x-if="!isSuperAdmin && profile?.section">
                                                    <input type="text" class="form-control bg-light" :value="profile.section === 'agamy' ? t('Agamy') : t('Dekhila')" dir="rtl" disabled>
                                                </template>
                                                <template x-if="isSuperAdmin || !profile?.section">
                                                    <select class="form-select" x-model="patientForm.section" dir="rtl">
                                                        <option value="">-- اختر المنطقة --</option>
                                                        <option value="agamy" x-text="t('Agamy')"></option>
                                                        <option value="dekhila" x-text="t('Dekhila')"></option>
                                                    </select>
                                                </template>
                                            </div>
                                            <div class="col-md-6">
                                                <label class="form-label fw-semibold">
                                                    <i class="bi bi-cash-coin me-1"></i><span x-text="t('Source of Money')"></span>
                                                </label>
                                                <select class="form-select" x-model="patientForm.source_of_money" dir="rtl">
                                                    <option value="">-- اختر المصدر --</option>
                                                    <option value="charity" x-text="t('Charity')"></option>
                                                    <option value="country" x-text="t('Country')"></option>
                                                </select>
                                            </div>
                                            <div class="col-12">
                                                <label class="form-label fw-semibold text-secondary">
                                                    <i class="bi bi-sticky-fill me-1"></i><span x-text="t('Internal Clinic Notes')"></span>
                                                </label>
                                                <div id="notes-container" class="vstack gap-2 mb-2">
                                                    <template x-for="(note, idx) in patientNotes" :key="idx">
                                                        <div class="notes-item d-flex gap-2">
                                                            <textarea rows="2" class="form-control" x-model="patientNotes[idx]" :placeholder="t('Add a note...')"></textarea>
                                                            <button type="button" class="btn btn-outline-danger btn-sm align-self-start" @click="removeNote(idx)" :style="patientNotes.length <= 1 ? 'display:none' : ''">
                                                                <i class="bi bi-trash"></i>
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                                <button type="button" class="btn btn-outline-secondary btn-sm" @click="addNote()">
                                                    <i class="bi bi-plus-circle me-1"></i> <span x-text="t('Add Note')"></span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <hr class="my-4">

                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-light border px-4" @click="navigate('patients')">
                                            <span x-text="editingPatient ? t('Discard Changes') : t('Reset Fields')"></span>
                                        </button>
                                        <button type="submit" class="btn btn-success px-5 shadow-sm">
                                            <i class="bi bi-check2-circle me-1"></i>
                                            <span x-text="editingPatient ? t('Update Patient File') : t('Register Patient')"></span>
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- USER FORM PAGE -->
            <div x-show="currentPage === 'user-form'" x-cloak>
                <div class="row justify-content-center">
                    <div class="col-md-6">

                        <div class="mb-3">
                            <a href="#" class="text-decoration-none text-muted" @click="navigate('users')">
                                <i class="bi bi-arrow-left"></i> <span x-text="t('Back to Users List')"></span>
                            </a>
                        </div>

                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-primary text-white py-3">
                                <h5 class="card-title mb-0 fw-bold">
                                    <template x-if="editingUser">
                                        <span><i class="bi bi-person-gear me-2"></i><span x-text="t('Edit User')"></span> — <span x-text="editingUser.name"></span></span>
                                    </template>
                                    <template x-if="!editingUser">
                                        <span><i class="bi bi-person-plus-fill me-2"></i><span x-text="t('Register New Staff/Admin')"></span></span>
                                    </template>
                                </h5>
                            </div>

                            <div class="card-body p-4">
                                <form @submit.prevent="submitUserForm()">

                                    <div class="mb-3">
                                        <label for="uf-name" class="form-label fw-semibold" x-text="t('Full Name')"></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                            <input type="text" id="uf-name" class="form-control" x-model="userForm.name" placeholder="e.g. Dr. John Doe" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="uf-email" class="form-label fw-semibold" x-text="t('Email Address')"></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                            <input type="email" id="uf-email" class="form-control" x-model="userForm.email" placeholder="name@clinic.com" :disabled="!!editingUser" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="uf-password" class="form-label fw-semibold">
                                            <span x-text="editingUser ? t('New Password') : t('Password')"></span>
                                            <template x-if="editingUser">
                                                <span class="text-muted fw-normal" x-text="t('(leave blank to keep current)')"></span>
                                            </template>
                                        </label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                            <input type="password" id="uf-password" class="form-control" x-model="userForm.password" placeholder="••••••••" :required="!editingUser">
                                        </div>
                                    </div>

                                    <div class="mb-4 pt-2">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" role="switch" id="is_admin" x-model="userForm.is_admin">
                                            <label class="form-check-label fw-semibold ms-2" for="is_admin">
                                                <span x-text="t('Grant Administrator Privileges')"></span>
                                            </label>
                                        </div>
                                        <div class="form-text ms-4 text-muted">
                                            <span x-text="t('Admins can manage system settings, users, and delete clinic data records.')"></span>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label for="uf-section" class="form-label fw-semibold" x-text="t('Section')"></label>
                                        <select id="uf-section" class="form-select" x-model="userForm.section">
                                            <option value="" x-text="t('— None (Super Admin) —')"></option>
                                            <option value="agamy">العجمي</option>
                                            <option value="dekhila">الدخيلة</option>
                                        </select>
                                        <div class="form-text text-muted" x-text="t('Leave empty if this user is a Super Admin.')"></div>
                                    </div>

                                    <hr class="text-muted opacity-25">

                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                                        <button type="button" class="btn btn-light me-md-2" @click="navigate('users')"><span x-text="t('Cancel')"></span></button>
                                        <button type="submit" class="btn btn-primary px-4">
                                            <i class="bi bi-save me-1"></i> <span x-text="editingUser ? t('Update User') : t('Save User')"></span>
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE BOTTOM BAR -->
    <nav class="mobile-bottom-bar d-lg-none" x-show="isLoggedIn" x-cloak>
        <div class="d-flex justify-content-around align-items-center h-100">
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'dashboard' }" @click="navigate('dashboard')">
                <i class="bi bi-speedometer2"></i>
                <small x-text="t('Dashboard')"></small>
            </button>
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'patients' }" @click="navigate('patients')">
                <i class="bi bi-people"></i>
                <small x-text="t('Patients')"></small>
            </button>
            <button class="bottom-bar-item" @click="openMobileSearch()">
                <i class="bi bi-search"></i>
                <small x-text="t('Search')"></small>
            </button>
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'patient-form' }" @click="openPatientForm()">
                <i class="bi bi-plus-circle-fill"></i>
                <small x-text="t('Add')"></small>
            </button>
            <button class="bottom-bar-item" x-show="isSuperAdmin" :class="{ 'active': currentPage === 'prices' }" @click="navigate('prices')">
                <i class="bi bi-currency-dollar"></i>
                <small x-text="t('Prices')"></small>
            </button>
            <button class="bottom-bar-item" x-show="isSuperAdmin" :class="{ 'active': currentPage === 'users' }" @click="navigate('users')">
                <i class="bi bi-person-badge"></i>
                <small x-text="t('Users')"></small>
            </button>
            <button class="bottom-bar-item" @click="logout()">
                <i class="bi bi-box-arrow-right"></i>
                <small x-text="t('Logout')"></small>
            </button>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
