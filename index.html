                                                                        <span class="text-info fw-semibold" x-text="row.duplicate?.message"></span>
                                                                    </template>
                                                                    <template x-if="row.duplicate?.fillable">
                                                                        <button type="button" class="btn btn-sm btn-outline-info ms-2" @click="setDuplicateSkip(row)"
                                                                            :class="{ active: row.duplicateMode !== 'fill' }">
                                                                            <span x-text="t('Skip')"></span>
                                                                        </button>
                                                                    </template>
                                                                    <template x-if="row.duplicate?.fillable">
                                                                        <button type="button" class="btn btn-sm btn-outline-info ms-2" @click="setDuplicateFill(row)"
                                                                            :class="{ active: row.duplicateMode === 'fill' }">
                                                                            <span x-text="t('Fill empty fields on the existing patient')"></span>
                                                                        </button>
                                                                    </template>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                        <!-- expanded detail row -->
                                                        <tr x-show="row.expanded">
                                                            <td colspan="10" class="bg-light p-3">
                                                                <div class="row g-2">
                                                                    <div class="col-md-3"><label class="small text-muted" x-text="t('Date of Birth')"></label>
                                                                        <input type="date" class="form-control form-control-sm" :class="{ 'ai-cell-check': aiCellWarning(row, 'date_of_birth') }" x-model="row.data.date_of_birth"></div>
                                                                    <div class="col-md-2"><label class="small text-muted" x-text="t('Age')"></label>
                                                                        <input class="form-control form-control-sm" x-model="row.data.age" inputmode="numeric"></div>
                                                                    <div class="col-md-3"><label class="small text-muted" x-text="t('Marital Status')"></label>
                                                                        <select class="form-select form-select-sm" x-model="row.data.marital_status">
                                                                            <option value="">--</option>
                                                                            <option value="single" x-text="t('Single')"></option>
                                                                            <option value="married" x-text="t('Married')"></option>
                                                                            <option value="divorced" x-text="t('Divorced')"></option>
                                                                            <option value="widowed" x-text="t('Widowed')"></option>
                                                                        </select></div>
                                                                    <div class="col-md-2"><label class="small text-muted" x-text="t('Children Count')"></label>
                                                                        <input class="form-control form-control-sm" x-model="row.data.children_count" inputmode="numeric"></div>
                                                                    <div class="col-md-2" x-show="isSuperAdmin" x-cloak><label class="small text-muted" x-text="t('Section')"></label>
                                                                        <select class="form-select form-select-sm" x-model="row.data.section">
                                                                            <option value="">--</option>
                                                                            <template x-for="opt in activeOptions('section')" :key="'ai-row-sec-' + opt.key">
                                                                                <option :value="opt.key" x-text="optionLabel('section', opt.key)"></option>
                                                                            </template>
                                                                        </select></div>
                                                                    <div class="col-md-4"><label class="small text-muted" x-text="t('Address')"></label>
                                                                        <input class="form-control form-control-sm" x-model="row.data.address"></div>
                                                                    <div class="col-md-4"><label class="small text-muted" x-text="t('Solution')"></label>
                                                                        <input class="form-control form-control-sm" x-model="row.data.solution"></div>
                                                                    <div class="col-md-3"><label class="small text-muted" x-text="t('Source of Money')"></label>
                                                                        <select class="form-select form-select-sm" x-model="row.data.source_of_money">
                                                                            <option value="">--</option>
                                                                            <template x-for="opt in activeOptions('source')" :key="'ai-src-' + opt.key">
                                                                                <option :value="opt.key" x-text="optionLabel('source', opt.key)"></option>
                                                                            </template>
                                                                        </select></div>
                                                                    <div class="col-md-3"><label class="small text-muted" x-text="t('Follower')"></label>
                                                                        <select class="form-select form-select-sm" x-model="row.data.follower">
                                                                            <option value="">--</option>
                                                                            <template x-for="(label, key) in followerOptions" :key="key">
                                                                                <option :value="key" x-text="label"></option>
                                                                            </template>
                                                                        </select></div>
                                                                    <div class="col-md-12"><label class="small text-muted" x-text="t('Notes')"></label>
                                                                        <textarea class="form-control form-control-sm" rows="1" :value="aiNotesText(row.data.notes)" @input="row.data.notes = $event.target.value.split('\n')"></textarea></div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </tbody>
                                        </template>
                                        <tr x-show="!visibleRows().length">
                                            <td colspan="10" class="text-center py-4 text-muted" x-text="t('No rows match this filter.')"></td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                            <!-- footer -->
                            <div class="card-footer bg-white d-flex align-items-center justify-content-between flex-wrap gap-2 py-3">
                                <div class="small text-muted">
                                    <span x-text="t(':count patients · :attention need attention', { count: aiRows.length, attention: attentionCount() })"></span>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-secondary" @click="backToAddStep()">
                                        <i class="bi bi-arrow-left me-1"></i><span x-text="t('Back')"></span>
                                    </button>
                                    <button class="btn btn-success" @click="importReviewedRows()" :disabled="aiImporting || !importableCount() || !aiSaveReady()">
                                        <span x-show="aiImporting" class="spinner-border spinner-border-sm me-1" x-cloak></span>
                                        <span x-text="aiImporting ? t('Saving...') : t('Import :count patients', { count: importableCount() })"></span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- ================= STEP 3: DONE ================= -->
                        <div class="card shadow border-0" x-show="aiStep === 'done'" x-cloak>
                            <div class="card-body text-center p-4">
                                <i class="bi bi-check-circle-fill text-success fs-1"></i>
                                <h4 class="fw-semibold mt-2">
                                    <span x-text="t(':count patients added', { count: aiResult.added })"></span>
                                </h4>
                                <p class="text-muted mb-2" x-show="aiResult.skipped.length" x-cloak>
                                    <span x-text="t(':count rows were skipped:', { count: aiResult.skipped.length })"></span>
                                </p>
                                <div class="list-group mx-auto mb-3 text-start" style="max-width: 640px; max-height: 40vh; overflow-y: auto" x-show="aiResult.skipped.length" x-cloak>
                                    <template x-for="(skip, i) in aiResult.skipped" :key="i">

                                            <div class="d-flex justify-content-between gap-2">

                                            </div>
                                        </div>
                                    </template>
                                </div>
                                <div class="d-flex justify-content-center gap-2 flex-wrap">
                                    <button type="button" class="btn btn-outline-secondary" x-show="aiResult.skipped.length" @click="downloadSkippedCsv()">

                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

                        <!-- row source popup (info icon) -->
                        <div class="position-fixed bottom-0 start-0 end-0 p-3" style="z-index:1055; pointer-events:none"

                            <div class="card shadow mx-auto" style="max-width:640px; pointer-events:auto"
                                @click.away="aiRowSource = null">

                                    <div class="d-flex justify-content-between align-items-start gap-2">
                                        <div class="small" style="white-space:pre-wrap" x-text="aiRowSource"></div>
                                        <button type="button" class="btn-close" @click="aiRowSource = null" :aria-label="t('Close')"></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                <div class="row justify-content-center">
                    <div class="col-lg-8 col-md-10">

                        <a href="#" class="btn btn-link text-decoration-none mb-3 p-0" @click="navigate('patients')">
                            <i class="bi bi-arrow-left"></i> <span x-text="editingPatient ? t('Cancel and Return to Directory') : t('Back to Patients Directory')"></span>
                        </a>

                        <div class="card shadow border-0 mb-5">

                                <h5 class="card-title mb-0">
                                    <template x-if="editingPatient">
                                        <span>
                                            <i class="bi bi-pencil-square me-2"></i>
                                            <span x-text="t('Modify Patient File: :name', {name: editingPatient.name})"></span>
                                        </span>
                                    </template>
                                    <template x-if="!editingPatient">
                                        <span>
                                            <i class="bi bi-person-plus-fill me-2"></i><span x-text="t('Patient Intake Registry')"></span>
                                        </span>
                                    </template>
                                </h5>
                            </div>

                            <div class="card-body p-4 bg-white">

                                    <div class="mb-4">

                                            </div>

                                            <input type="file" class="d-none" multiple accept="image/*,application/pdf" @change="onPatientAttach($event)">
                                        </label>
                                        <div class="form-text text-muted" x-text="t('Images and PDF files, up to 10 MB each. Files upload immediately and are saved with the patient.')"></div>

                                        <template x-if="patientAttachments.length">
                                            <div class="row g-2 mt-1">
                                                <template x-for="(att, idx) in patientAttachments" :key="idx">
                                                    <div class="col-12 col-md-6">
                                                        <div class="border rounded p-2 d-flex align-items-center gap-2 bg-white">
                                                            <template x-if="attachmentIsImage(att) && att.url">
                                                                <img :src="attachmentUrl(att, 80)" alt="" class="rounded" style="width: 44px; height: 44px; object-fit: cover;">
                                                            </template>
                                                            <template x-if="!attachmentIsImage(att) || !att.url">
                                                                <span class="d-inline-flex align-items-center justify-content-center bg-light rounded" style="width: 44px; height: 44px;">
                                                                    <i class="bi bi-file-earmark-pdf-fill text-danger fs-4" x-show="!attachmentIsImage(att)"></i>
                                                                    <i class="bi bi-image text-primary fs-4" x-show="attachmentIsImage(att)"></i>
                                                                </span>
                                                            </template>
                                                            <div class="flex-grow-1 overflow-hidden">
                                                                <div class="small fw-semibold text-truncate" x-text="att.name"></div>
                                                                <div class="small text-muted">
                                                                    <span x-text="formatFileSize(att.size)"></span>
                                                                    <span x-show="att.uploading" x-cloak>· <span x-text="t('Uploading... :percent%', { percent: att.progress || 0 })"></span></span>
                                                                    <span x-show="att.error" x-cloak class="text-danger">· <span x-text="att.error"></span></span>
                                                                </div>
                                                            </div>
                                                            <span x-show="att.uploading" x-cloak class="spinner-border spinner-border-sm text-primary"></span>
                                                            <button type="button" class="btn btn-sm btn-outline-danger" @click="removeAttachment(idx)" :title="t('Remove')">
                                                                <i class="bi bi-trash"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>

                                    <hr class="my-4">

                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-light border px-4" @click="navigate('patients')">
                                            <span x-text="editingPatient ? t('Discard Changes') : t('Reset Fields')"></span>
                                        </button>
                                        <button type="submit" class="btn btn-success px-5 shadow-sm">
                                            <i class="bi bi-check2-circle me-1"></i>
                                            <span x-text="editingPatient ? t('Update Patient File') : t('Register Patient')"></span>
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- USER FORM PAGE -->
            <div x-show="currentPage === 'user-form'" x-cloak>
                <div class="row justify-content-center">
                    <div class="col-md-6">

                        <div class="mb-3">
                            <a href="#" class="text-decoration-none text-muted" @click="navigate('users')">
                                <i class="bi bi-arrow-left"></i> <span x-text="t('Back to Users List')"></span>
                            </a>
                        </div>

                        <div class="card shadow-sm border-0">
                            <div class="card-header bg-primary text-white py-3">
                                <h5 class="card-title mb-0 fw-bold">
                                    <template x-if="editingUser">
                                        <span><i class="bi bi-person-gear me-2"></i><span x-text="t('Edit User')"></span> — <span x-text="editingUser.name"></span></span>
                                    </template>
                                    <template x-if="!editingUser">
                                        <span><i class="bi bi-person-plus-fill me-2"></i><span x-text="t('Register New Staff/Admin')"></span></span>
                                    </template>
                                </h5>
                            </div>

                            <div class="card-body p-4">
                                <form @submit.prevent="submitUserForm()">

                                    <div class="mb-3">
                                        <label for="uf-name" class="form-label fw-semibold" x-text="t('Full Name')"></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                            <input type="text" id="uf-name" class="form-control" x-model="userForm.name" placeholder="e.g. Dr. John Doe" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="uf-email" class="form-label fw-semibold" x-text="t('Email Address')"></label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                            <input type="email" id="uf-email" class="form-control" x-model="userForm.email" placeholder="name@clinic.com" :disabled="!!editingUser" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="uf-password" class="form-label fw-semibold">
                                            <span x-text="editingUser ? t('New Password') : t('Password')"></span>
                                            <template x-if="editingUser">
                                                <span class="text-muted fw-normal" x-text="t('(leave blank to keep current)')"></span>
                                            </template>
                                        </label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                            <input type="password" id="uf-password" class="form-control" x-model="userForm.password" placeholder="••••••••" :required="!editingUser">
                                        </div>
                                    </div>

                                    <div class="mb-4 pt-2">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" role="switch" id="is_admin" x-model="userForm.is_admin">
                                            <label class="form-check-label fw-semibold ms-2" for="is_admin">
                                                <span x-text="t('Grant Administrator Privileges')"></span>
                                            </label>
                                        </div>
                                        <div class="form-text ms-4 text-muted">
                                            <span x-text="t('Admins can manage system settings, users, and delete clinic data records.')"></span>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label for="uf-section" class="form-label fw-semibold" x-text="t('Section')"></label>
                                        <select id="uf-section" class="form-select" x-model="userForm.section">
                                            <option value="" x-text="t('— None (Super Admin) —')"></option>
                                            <template x-if="userForm.section && !activeOptions('section').some(o => o.key === userForm.section)">
                                                <option :value="userForm.section" x-text="optionLabel('section', userForm.section)"></option>
                                            </template>
                                            <template x-for="opt in activeOptions('section')" :key="'uf-sec-' + opt.key">
                                                <option :value="opt.key" x-text="optionLabel('section', opt.key)"></option>
                                            </template>
                                        </select>
                                        <div class="form-text text-muted" x-text="t('Leave empty if this user is a Super Admin.')"></div>
                                    </div>

                                    <hr class="text-muted opacity-25">

                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                                        <button type="button" class="btn btn-light me-md-2" @click="navigate('users')"><span x-text="t('Cancel')"></span></button>
                                        <button type="submit" class="btn btn-primary px-4">
                                            <i class="bi bi-save me-1"></i> <span x-text="editingUser ? t('Update User') : t('Save User')"></span>
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE BOTTOM BAR -->
    <nav class="mobile-bottom-bar d-lg-none" x-show="isLoggedIn" x-cloak>
        <div class="d-flex justify-content-around align-items-center h-100">
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'dashboard' }" @click="navigate('dashboard')">
                <i class="bi bi-speedometer2"></i>
                <small x-text="t('Dashboard')"></small>
            </button>
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'patients' }" @click="navigate('patients')">
                <i class="bi bi-people"></i>
                <small x-text="t('Patients')"></small>
            </button>
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'patient-form' }" @click="openPatientForm()">
                <i class="bi bi-plus-circle-fill"></i>
                <small x-text="t('Add')"></small>
            </button>
            <button class="bottom-bar-item" x-show="isSuperAdmin" :class="{ 'active': currentPage === 'prices' }" @click="navigate('prices')">
                <i class="bi bi-currency-dollar"></i>
                <small x-text="t('Prices')"></small>
            </button>
            <button class="bottom-bar-item" x-show="isSuperAdmin" :class="{ 'active': currentPage === 'users' }" @click="navigate('users')">
                <i class="bi bi-person-badge"></i>
                <small x-text="t('Users')"></small>
            </button>
        </div>
    </nav>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
