                <!-- ROW DRAWER -->
                <div class="offcanvas offcanvas-end" :class="{ show: drawerOpen }" tabindex="-1" style="width:min(640px, 95vw); visibility:visible;" x-show="drawerOpen" x-cloak>
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" x-text="t('importAgent.review.drawer.title')"></h5>
                        <button type="button" class="btn-close" @click="closeDrawer()" :aria-label="t('Cancel')"></button>
                    </div>
                    <div class="offcanvas-body" x-show="drawerRow">
                        <template x-if="drawerRow">
                            <div>
                                <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="badge" :class="statusChip(drawerRow).cls" x-text="statusChip(drawerRow).label"></span>
                                        <template x-for="(badge, badgeIndex) in rowBadges(drawerRow)" :key="badgeIndex">
                                            <span class="badge text-bg-light border" x-text="badge"></span>
                                        </template>
                                        <span class="text-muted small" x-text="'#' + drawerRow.seq"></span>
                                    </div>
                                    <div class="d-flex gap-1">
                                        <button type="button" class="btn btn-sm btn-outline-secondary" @click="showSource(drawerRow, null)" x-text="t('importAgent.review.drawer.openSource')"></button>
                                        <button type="button" class="btn btn-sm btn-outline-success" @click="markRow(drawerRow)" x-text="t('importAgent.review.markReviewed')"></button>
                                    </div>
                                </div>

                                <!-- row issues (spec 10.4) -->
                                <template x-if="cellIssueList(drawerRow, null).length > 0">
                                    <div class="mb-2"><span class="badge text-bg-warning" x-text="cellIssueList(drawerRow, null).join(' · ')"></span></div>
                                </template>

                                <!-- field editors -->
                                <div class="row g-2">
                                    <template x-for="field in fields" :key="field.key">
                                        <div class="col-md-6">
                                            <label class="form-label small mb-0 d-flex justify-content-between" x-text="fieldLabel(field.key)">
                                                <button type="button" class="btn btn-sm btn-link p-0 text-body-secondary" x-show="drawerRow.cells?.[field.key]?.origin === 'user'" @click="revertCell(drawerRow, field.key)" :title="t('importAgent.review.cell.revert')"><i class="bi bi-arrow-counterclockwise small"></i></button>
                                            </label>
                                            <template x-if="editorType(field.key) === 'select'">
                                                <select class="form-select form-select-sm" :value="drawerFieldValue(drawerRow, field.key)" @change="onEnumChange(drawerRow, field.key, $event.target.value)">
                                                    <option value="">--</option>
                                                    <template x-for="optionItem in editorOptions(field.key)" :key="optionItem.value">
                                                        <option :value="optionItem.value" x-text="optionItem.label" :selected="String(optionItem.value) === String(drawerFieldValue(drawerRow, field.key))"></option>
                                                    </template>
                                                </select>
                                            </template>
                                            <template x-if="editorType(field.key) === 'date'">
                                                <input type="text" class="form-control form-control-sm" dir="ltr" placeholder="dd/mm/yyyy"
                                                    :value="drawerFieldValue(drawerRow, field.key)" @change="drawerFieldChange(drawerRow, field.key, $event.target.value)">
                                            </template>
                                            <template x-if="editorType(field.key) === 'number'">
                                                <input type="number" step="any" class="form-control form-control-sm" dir="ltr"
                                                    :value="drawerFieldValue(drawerRow, field.key)" @change="drawerFieldChange(drawerRow, field.key, $event.target.value)">
                                            </template>
                                            <template x-if="editorType(field.key) === 'text'">
                                                <input type="text" class="form-control form-control-sm"
                                                    :value="drawerFieldValue(drawerRow, field.key)" @change="drawerFieldChange(drawerRow, field.key, $event.target.value)">
                                            </template>
                                            <template x-if="editorType(field.key) === 'notes'">
                                                <div>
                                                    <template x-for="(note, noteIndex) in noteList(drawerRow)" :key="noteIndex">
                                                        <div class="d-flex gap-1 mb-1">
                                                            <input type="text" class="form-control form-control-sm" :value="note" @change="noteChange(drawerRow, noteIndex, $event.target.value)">
                                                            <button type="button" class="btn btn-sm btn-outline-danger py-0" @click="noteRemove(drawerRow, noteIndex)"><i class="bi bi-x"></i></button>
                                                        </div>
                                                    </template>
                                                    <button type="button" class="btn btn-sm btn-outline-secondary py-0" @click="noteAdd(drawerRow)"><i class="bi bi-plus"></i></button>
                                                </div>
                                            </template>
                                            <div class="small" x-show="cellIssueList(drawerRow, field.key).length > 0">
                                                <span class="text-danger small" x-text="cellIssueList(drawerRow, field.key).join(' · ')"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <!-- duplicate panel (spec 10.6) -->
                                <template x-if="partnerRow || drawerRow.dup || drawerRow.collapsed">
                                    <div class="border rounded p-2 mt-3">
                                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                                            <span class="fw-semibold small" x-text="dupKindLabel(drawerRow.dup?.kind) || t('importAgent.review.dup.possible')"></span>
                                            <template x-if="drawerRow.collapsed">
                                                <span class="badge text-bg-secondary" x-text="t('importAgent.review.dup.collapsed')"></span>
                                            </template>
                                        </div>
                                        <template x-if="partnerRow">
                                            <div class="small mt-1">
                                                <span class="text-muted me-1" x-text="t('importAgent.review.dup.partner')"></span>
                                                <span class="fw-semibold" x-text="partnerRow.cells?.name?.value ?? ''"></span>
                                                <span class="text-muted ms-2" x-text="partnerRow.cells?.national_id?.value ?? ''"></span>
                                                <span class="badge ms-2" :class="statusChip(partnerRow).cls" x-text="statusChip(partnerRow).label"></span>
                                            </div>
                                        </template>
                                        <template x-for="action in ['fill', 'keep', 'skip']" :key="action">
                                            <button type="button" class="btn btn-sm me-1 mt-2" :class="drawerRow.dup?.action === action ? 'btn-primary' : 'btn-outline-secondary'"
                                                @click="setDupAction(drawerRow, action)" x-text="t('importAgent.review.dup.' + action)"></button>
                                        </template>
                                        <template x-if="drawerRow.dup?.action === 'skip' && drawerRow.dup?.kind === 'in_batch'">
                                            <button type="button" class="btn btn-sm btn-outline-secondary mt-2" @click="keepDupRow(drawerRow)" x-text="t('importAgent.review.dup.keepThis')"></button>
                                        </template>
                                    </div>
                                </template>

                                <div class="d-flex gap-2 mt-3 flex-wrap">
                                    <button type="button" class="btn btn-outline-danger btn-sm" @click="removeRow(drawerRow)" x-show="!drawerRow.removed" x-text="t('Delete')"></button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" @click="restoreRow(drawerRow)" x-show="drawerRow.removed" x-text="t('importAgent.review.tray.restore')"></button>
                                    <button type="button" class="btn btn-outline-secondary btn-sm" @click="closeDrawer()" x-text="t('importAgent.review.drawer.backToGrid')"></button>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="offcanvas-backdrop fade show" @click="closeDrawer()" x-show="drawerOpen" x-cloak style="position:fixed;inset:0"></div>
                </div>

                <!-- SOURCE DRAWER -->
                <div class="offcanvas offcanvas-end" :class="{ show: sourceOpen }" tabindex="-1" style="width:min(560px, 95vw); visibility:visible;" x-show="sourceOpen" x-cloak>
                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title" x-text="t('importAgent.review.source.title')"></h5>
                        <button type="button" class="btn-close" @click="sourceOpen = false" :aria-label="t('Cancel')"></button>
                    </div>
                    <div class="offcanvas-body">
                        <template x-if="sourceModel && sourceModel.kind === 'manual'">
                            <p class="small text-muted" x-text="t('importAgent.review.source.manual')"></p>
                        </template>
                        <template x-if="sourceModel && sourceModel.kind === 'sheet'">
                            <div class="table-responsive small">
                                <table class="table table-sm table-bordered">
                                    <thead><tr><template x-for="(header, hIndex) in sourceModel.sheet.header" :key="hIndex"><th x-text="header"></th></template></tr></thead>
                                    <tbody>
                                        <template x-for="line in sourceModel.lines" :key="line.id">
                                            <tr :class="line.cited ? 'table-success' : ''">
                                                <template x-for="(cellText, cIndex) in line.text.split(' | ')" :key="cIndex"><td x-text="cellText"></td></template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template x-if="sourceModel && sourceModel.kind === 'image'">
                            <div>
                                <p class="small text-muted" x-text="t('importAgent.review.source.imageNote')"></p>
                                <div class="d-flex flex-column gap-2">
                                    <template x-for="image in (sourceModel.images || [])" :key="image.id">
                                        <img :src="image.dataUrl" class="img-fluid rounded border" :alt="image.id">
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template x-if="sourceModel && sourceModel.kind === 'text'">
                            <ol class="ia-source-lines small">
                                <template x-for="line in sourceModel.lines" :key="line.id">
                                    <li :class="line.cited ? 'ia-cited' : ''">
                                        <template x-for="segment in highlightSegments(line.text, sourceModel.highlight)" :key="segment.start">
                                            <mark x-show="segment.match" x-text="segment.text"></mark><span x-show="!segment.match" x-text="segment.text"></span>
                                        </template>
                                    </li>
                                </template>
                            </ol>
                        </template>
                    </div>
                </div>

                <!-- CONFIRMATION MODAL (spec 10.9) -->
                <div class="modal" :class="{ 'd-block': confirmOpen }" tabindex="-1" x-cloak style="background-color:rgba(0,0,0,.5)">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" x-text="t('importAgent.review.confirm.title')"></h5>
                                <button type="button" class="btn-close" @click="confirmOpen = false" :aria-label="t('Cancel')"></button>
                            </div>
                            <div class="modal-body">
                                <template x-if="confirmCounts">
                                    <div class="small">
                                        <p class="fw-semibold mb-2" x-text="t('importAgent.review.confirm.summary', { importable: confirmCounts.importable })"></p>
                                        <div><i class="bi bi-person-plus me-2"></i><span x-text="t('importAgent.review.confirm.new', { count: confirmCounts.fresh })"></span></div>
                                        <div><i class="bi bi-person-down me-2"></i><span x-text="t('importAgent.review.confirm.fill', { count: confirmCounts.fill })"></span></div>
                                        <div class="mt-2 text-muted" x-text="t('importAgent.review.confirm.skipped', { errors: confirmCounts.skippedErrors, dups: confirmCounts.skippedDups, removed: removedCount })"></div>
                                        <div class="mt-1" :class="confirmCounts.unreviewed > 0 ? 'text-danger' : 'text-muted'" x-text="t('importAgent.review.confirm.unreviewed', { count: confirmCounts.unreviewed })"></div>
                                    </div>
                                </template>
                                <p class="small text-muted mt-2" x-text="confirmNote"></p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" @click="confirmOpen = false" x-text="t('Cancel')"></button>
                                <button type="button" class="btn btn-primary" @click="confirmImportNow()" :disabled="confirmImportDisabled" :title="confirmImportTitle()">
                                    <i class="bi bi-box-arrow-down me-1"></i><span x-text="t('importAgent.review.confirm.import', { count: confirmCounts ? confirmCounts.importable : 0 })"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- BULK VALUE MODAL (spec 10.5) -->
                <div class="modal" :class="{ 'd-block': bulkOpen }" tabindex="-1" x-cloak style="background-color:rgba(0,0,0,.5)">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" x-text="t('importAgent.review.bulk.title', { count: bulkCount })"></h5>
                                <button type="button" class="btn-close" @click="bulkOpen = false" :aria-label="t('Cancel')"></button>
                            </div>
                            <div class="modal-body">
                                <label class="form-label small" x-text="t('importAgent.review.bulk.field')"></label>
                                <select class="form-select form-select-sm mb-2" x-model="bulkField">
                                    <option value="">--</option>
                                    <template x-for="field in bulkFields" :key="field.key">
                                        <option :value="field.key" x-text="fieldLabel(field.key)"></option>
                                    </template>
                                </select>
                                <template x-if="bulkField">
                                    <div>
                                        <template x-if="editorType(bulkField) === 'select'">
                                            <select class="form-select form-select-sm" x-model="bulkValue">
                                                <option value="">--</option>
                                                <template x-for="optionItem in editorOptions(bulkField)" :key="optionItem.value">
                                                    <option :value="optionItem.value" x-text="optionItem.label"></option>
                                                </template>
                                            </select>
                                        </template>
                                        <template x-if="editorType(bulkField) === 'date'">
                                            <input type="text" class="form-control form-control-sm" dir="ltr" placeholder="dd/mm/yyyy" x-model="bulkValue">
                                        </template>
                                        <template x-if="editorType(bulkField) === 'number'">
                                            <input type="number" step="any" class="form-control form-control-sm" dir="ltr" x-model="bulkValue">
                                        </template>
                                        <template x-if="editorType(bulkField) === 'text'">
                                            <input type="text" class="form-control form-control-sm" x-model="bulkValue">
                                        </template>
                                    </div>
                                </template>
                                <div class="btn-group btn-group-sm mt-3" role="group">
                                    <button type="button" class="btn" :class="bulkMode === 'blanks' ? 'btn-primary' : 'btn-outline-secondary'" @click="bulkMode = 'blanks'" x-text="t('importAgent.review.bulk.blanks')"></button>
                                    <button type="button" class="btn" :class="bulkMode === 'overwrite' ? 'btn-primary' : 'btn-outline-secondary'" @click="bulkMode = 'overwrite'" x-text="t('importAgent.review.bulk.overwrite')"></button>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" @click="bulkOpen = false" x-text="t('Cancel')"></button>
                                <button type="button" class="btn btn-primary" @click="applyBulk()" :disabled="!bulkField" x-text="t('importAgent.review.bulk.apply')"></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CSS + small helpers -->
                <style>
                    .ia-grid { table-layout: fixed; }
                    .ia-grid .ia-col-status { width: 96px; }
                    .ia-grid .ia-col-actions { width: 64px; }
                    .ia-cell-error { background-color: #fdf0ef; }
                    .ia-cell-warn { background-color: #fff8e6; }
                    .ia-cell-info { background-color: #eef4fd; }
                    .ia-cell-source { background-color: #f2fdf5; }
                    .ia-cited { background-color: #e9f7ec; }
                    [dir="rtl"] .ia-grid { direction: rtl; }

                    /* v6 review: Simple/Advanced, inline record, strips */
                    /* Alpine's x-show writes an inline `display: none`. Bootstrap's
                       display utilities (.d-flex, .d-block, ...) carry !important and
                       would beat Alpine, leaving the element permanently visible.
                       Keep display utilities off x-show elements; this rule keeps
                       that mistake harmless instead of silently breaking the UI. */
                    [x-show][style*="display: none"] { display: none !important; }
                    .simple-table td, .simple-table th { padding-top: .7rem; padding-bottom: .7rem; }
                    .ia-review .table > :not(caption) > * > * { vertical-align: middle; }
                    .ia-row-bad > td { background-color: #fdf0ef !important; }
                    .ia-row-check > td { background-color: #fff8e6 !important; }
                    .ia-row-dup > td { background-color: #f0f7ff !important; }
                    .record-panel { background: #fff; }
                    .record-panel h6 { font-size: .95rem; }
                    .quote-box {
                        background: #f8f9fa;
                        border-inline-start: 3px solid #6ea8fe;
                        font-size: .82rem;
                    }
                    .sticky-import { position: sticky; bottom: 0; z-index: 50; }
                    .ia-advanced-table th { white-space: nowrap; }
                    .ia-advanced-table td { font-size: .875rem; }
                    [dir="rtl"] .ia-review .btn i.me-1 { margin-right: 0 !important; margin-left: .25rem !important; }
                    @media (max-width: 767.98px) {
                        .ia-review .sticky-import { position: static; }
                    }
                </style>
            </div>

            <!-- SETTINGS PAGE (Super Admin only) -->
            <div x-show="currentPage === 'settings'" x-cloak>
                <div class="row mb-3">
                    <div class="col-12">
                        <h2 class="text-secondary fw-bold"><i class="bi bi-gear-fill me-2 text-primary"></i><span x-text="t('Settings')"></span></h2>
                        <p class="text-muted mb-0" x-text="t('Manage clinic option lists, user accounts, and AI import settings.')"></p>
                    </div>
                </div>

                <!-- Settings tabs (#16): Clinic options, Users, AI & Import -->
                <ul class="nav nav-tabs mb-4" role="tablist" @keydown="settingsTabKeydown($event)">
                    <li class="nav-item" role="presentation">
                        <button type="button" id="settings-tab-options" class="nav-link" :class="{ active: settingsTab === 'options' }" role="tab" :aria-selected="settingsTab === 'options' ? 'true' : 'false'" aria-controls="settings-panel-options" @click="openSettingsTab('options')" x-text="t('Clinic Options')"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" id="settings-tab-users" class="nav-link" :class="{ active: settingsTab === 'users' }" role="tab" :aria-selected="settingsTab === 'users' ? 'true' : 'false'" aria-controls="settings-panel-users" @click="openSettingsTab('users')" x-text="t('Users')"></button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button type="button" id="settings-tab-ai" class="nav-link" :class="{ active: settingsTab === 'ai' }" role="tab" :aria-selected="settingsTab === 'ai' ? 'true' : 'false'" aria-controls="settings-panel-ai" @click="openSettingsTab('ai')" x-text="t('AI &amp; Import')"></button>
                    </li>
                </ul>

                <!-- Clinic Options tab -->
                <div id="settings-panel-options" role="tabpanel" aria-labelledby="settings-tab-options" x-show="settingsTab === 'options'" tabindex="0">
                    <p class="text-muted small" x-text="t('These lists feed the patient form, filters, dashboard and Excel export. Deactivating an option hides it from new selections while existing patients keep their value.')"></p>

                    <!-- Editable option lists -->
                    <template x-for="kind in optionKinds" :key="kind">
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white py-3 d-flex align-items-center">
                            <i class="bi me-2 text-primary fs-5" :class="optionKindIcon(kind)"></i>
                            <h5 class="mb-0 fw-semibold" x-text="optionKindLabel(kind)"></h5>
                        </div>
                        <div class="card-body">
                            <template x-if="settingsOptions[kind].length === 0">
                                <div class="text-muted small mb-2" x-text="t('No options yet.')"></div>
                            </template>
                            <template x-for="row in settingsOptions[kind]" :key="row.id">
                                <div class="row g-2 align-items-center border-bottom py-2" :class="row.active ? '' : 'opacity-50'">
                                    <div class="col-12 col-md-4">
                                        <input type="text" class="form-control form-control-sm" x-model="row.label_en" @input="row._dirty = true" :placeholder="t('English label')">
                                    </div>
                                    <div class="col-12 col-md-4">
                                        <input type="text" class="form-control form-control-sm" dir="rtl" x-model="row.label_ar" @input="row._dirty = true" :placeholder="t('Arabic label')">
                                    </div>
                                    <div class="col-6 col-md-2">
                                        <div class="form-check form-switch mb-0">
                                            <input class="form-check-input" type="checkbox" :id="'opt-active-' + row.id" x-model="row.active" @change="row._dirty = true">
                                            <label class="form-check-label small" :for="'opt-active-' + row.id" x-text="t('Active')"></label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-md-2 text-end">
                                        <div class="d-inline-flex gap-1">
                                            <button type="button" class="btn btn-sm btn-primary" x-show="row._dirty" x-cloak @click="saveOption(kind, row)" :disabled="row._saving || row._removing">
                                                <span x-show="row._saving" class="spinner-border spinner-border-sm" x-cloak></span>
                                                <i class="bi bi-save" x-show="!row._saving"></i>
                                            </button>
                                            <button type="button" class="btn btn-sm btn-outline-danger" @click="removeOption(kind, row)" :disabled="row._saving || row._removing" :title="t('Remove')" :aria-label="t('Remove')">
                                                <span x-show="row._removing" class="spinner-border spinner-border-sm" x-cloak></span>
                                                <i class="bi bi-trash" x-show="!row._removing"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <div class="row g-2 align-items-center mt-3">
                                <div class="col-12 col-md-4">
                                    <input type="text" class="form-control form-control-sm" x-model="newOption[kind].label_en" :placeholder="t('New English label')">
                                </div>
                                <div class="col-12 col-md-4">
                                    <input type="text" class="form-control form-control-sm" dir="rtl" x-model="newOption[kind].label_ar" :placeholder="t('New Arabic label')">
                                </div>
                                <div class="col-12 col-md-4">
                                    <button class="btn btn-sm btn-success" @click="addOption(kind)">
                                        <i class="bi bi-plus-circle me-1"></i><span x-text="t('Add Option')"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                </div>

                <!-- Users tab (#16): the Users page merged into Settings -->
                <div id="settings-panel-users" role="tabpanel" aria-labelledby="settings-tab-users" x-show="settingsTab === 'users'" x-cloak tabindex="0">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                        <div>
                            <h2 class="text-secondary fw-bold mb-0"><i class="bi bi-people-fill me-2 text-primary"></i><span x-text="t('Users Management')"></span></h2>
                            <p class="text-muted small mb-0" x-text="t('Create staff and administrator accounts and assign their section access.')"></p>
                        </div>
                        <button type="button" class="btn btn-success" @click="openUserForm()">
                            <i class="bi bi-person-plus-fill me-1"></i> <span x-text="t('Create New User')"></span>
                        </button>
                    </div>

                    <div class="card shadow-sm border-0">
                        <div class="card-body p-0">
                            <!-- Loading state -->
                            <template x-if="usersLoading">
                                <div class="d-flex align-items-center gap-2 text-muted small py-4 px-4">
                                    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                                    <span x-text="t('Loading users...')"></span>
                                </div>
                            </template>

                            <!-- Error state with retry -->
                            <template x-if="usersError">
                                <div class="alert alert-warning d-flex flex-wrap align-items-center gap-2 my-3 mx-3 mb-0">
                                    <i class="bi bi-exclamation-triangle-fill"></i>
                                    <span x-text="usersError"></span>
                                    <button type="button" class="btn btn-sm btn-outline-secondary ms-auto" @click="loadUsers()" x-text="t('Retry')"></button>
                                </div>
                            </template>

                            <div class="table-responsive" x-show="!usersLoading && !usersError">

                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-light border px-4" @click="navigate('patients')">
                                            <span x-text="editingPatient ? t('Discard Changes') : t('Reset Fields')"></span>
                                        </button>
                                        <button type="submit" class="btn btn-success px-5 shadow-sm">
                                            <i class="bi bi-check2-circle me-1"></i>
                                            <span x-text="editingPatient ? t('Update Patient File') : t('Register Patient')"></span>
                                        </button>
                                    </div>

                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE BOTTOM BAR -->
    <nav class="mobile-bottom-bar d-lg-none" x-show="isLoggedIn" x-cloak>
        <div class="d-flex justify-content-around align-items-center h-100">
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'dashboard' }" @click="navigate('dashboard')">
                <i class="bi bi-speedometer2"></i>
                <small x-text="t('Dashboard')"></small>
            </button>
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'patients' }" @click="navigate('patients')">
                <i class="bi bi-people"></i>
                <small x-text="t('Patients')"></small>
            </button>
            <button class="bottom-bar-item" :class="{ 'active': currentPage === 'patient-form' }" @click="openPatientForm()">
                <i class="bi bi-plus-circle-fill"></i>
                <small x-text="t('Add')"></small>
            </button>
        </div>
    </nav>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
