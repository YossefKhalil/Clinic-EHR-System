<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthCare Clinic</title>
</head>
<body class="bg-light" x-data="app()" x-init="init()">

    <div class="page-loader" x-show="loading" x-cloak>
        <div class="spinner"></div>
    </div>

    <div x-show="!loading" x-cloak>

        <!-- NAVBAR (desktop) -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4" x-show="isLoggedIn">
            <div class="container">
                <span class="navbar-brand" @click="navigate('dashboard')" style="cursor:pointer" :aria-label="t('Dashboard')">
                    <i class="bi bi-heart-pulse-fill"></i>
                </span>
                <!-- Global patient search: one box, no options. Lives outside the
                     collapse so it stays visible in the top bar on mobile instead of
                     hiding behind the hamburger. -->
                <div class="global-search position-relative" @click.outside="closeGlobalSearch({ clearFocus: true })">
                        <div class="position-relative">
                            <i class="bi bi-search global-search-icon" aria-hidden="true"></i>
                            <input
                                type="search"
                                class="form-control global-search-input"
                                x-model="globalSearch"
                                @input.debounce="onGlobalInput()"
                                @focus="globalSearchFocused = true"
                                @keydown="onGlobalKeydown($event)"
                                :placeholder="t('Search patients...')"
                                :aria-label="t('Search patients...')"
                                autocomplete="off"
                            >
                            <span class="global-search-spinner spinner-border spinner-border-sm text-light" x-show="globalSearchLoading" x-cloak></span>
                        </div>
                        <div class="global-search-menu list-group shadow" x-show="globalSearchFocused && globalSearch && (globalSuggestions().length || globalSearchLoading)" x-cloak>
                            <template x-for="(patient, index) in globalSuggestions()" :key="patient.id">
                                <button type="button" class="list-group-item list-group-item-action global-search-item"
                                    :class="{ 'active': index === globalSearchSelectedIndex }"
                                    @click="pickGlobalResult(patient)"
                                    @mousemove="globalSearchSelectedIndex = index"
                                >
                                    <div class="d-flex align-items-center gap-2">
                                        <i class="bi bi-person-circle text-primary fs-5"></i>
                                        <div class="flex-grow-1 text-start">
                                            <div class="fw-semibold" x-text="patient.name"></div>
                                            <div class="small text-muted d-flex flex-wrap gap-2">
                                                <span x-show="patient.national_id"><i class="bi bi-credit-card-2-front"></i> <span x-text="patient.national_id"></span></span>
                                                <span x-show="patient.mobile"><i class="bi bi-telephone"></i> <span x-text="patient.mobile"></span></span>
                                                <span x-show="patient.section"><i class="bi bi-building"></i> <span x-text="optionLabel('section', patient.section)"></span></span>
                                                <span x-show="patient.governorate"><i class="bi bi-geo-alt"></i> <span x-text="patient.governorate"></span></span>
                                            </div>
                                        </div>
                                        <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'" x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                    </div>
                                </button>
                            </template>
                            <button type="button" class="list-group-item list-group-item-action text-primary fw-semibold global-search-item" @click="runGlobalList()">
                                <i class="bi bi-arrow-right-short"></i>
                                <span x-text="t('See all results')"></span>
                            </button>
                        </div>
                    </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'dashboard' }" @click="navigate('dashboard')" style="cursor:pointer">
                                <i class="bi bi-speedometer2 me-1"></i><span x-text="t('Dashboard')"></span>
                            </span>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link" :class="{ 'active fw-semibold': currentPage === 'patients' }" @click="navigate('patients')" style="cursor:pointer">
                                <i class="bi bi-people me-1"></i><span x-text="t('Patients')"></span>
                            </span>
                        </li>
                        <li class="nav-item ms-2 dropdown">
                            <a class="nav-link px-2 dropdown-toggle d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" :title="profile?.name || user?.email || 'User'" :aria-label="profile?.name || user?.email || 'User'">
                                <i class="bi bi-person-circle fs-5"></i>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <span class="dropdown-item-text fw-semibold small" x-text="profile?.name || user?.email || 'User'"></span>
                                </li>
                                <li>
                                    <span class="dropdown-item-text text-muted small" x-text="user?.email"></span>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li x-show="isSuperAdmin">
                                    <button type="button" class="dropdown-item" :class="{ active: currentPage === 'settings' }" @click="navigate('settings')">
                                        <i class="bi bi-gear me-2"></i><span x-text="t('Settings')"></span>
                                    </button>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <button class="dropdown-item text-danger" @click="logout()">
                                        <i class="bi bi-box-arrow-right me-2"></i><span x-text="t('Logout')"></span>
                                    </button>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item ms-2">
                            <button class="btn btn-sm btn-outline-light fw-semibold" @click="toggleLocale()">
                                <i class="bi bi-translate me-1"></i><span x-text="localeLabel"></span>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container page-container">

            <!-- Global alert bar (showAlert). Auto-hides after a few seconds. -->
            <div class="alert alert-dismissible fade show" :class="'alert-' + alertType" x-show="alertMessage" x-cloak x-transition role="alert" aria-live="polite">
                <span x-text="alertMessage"></span>
                <button type="button" class="btn-close" @click="alertMessage = null" aria-label="Close"></button>
            </div>

            <!-- LOGIN PAGE -->
            <div x-show="currentPage === 'login'" x-cloak>
                <div class="d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
                    <div>
                        <a href="#" @click.prevent="navigate('dashboard')" x-cloak>
                            <i class="bi bi-heart-pulse-fill text-muted" style="font-size:3.5rem"></i>
                        </a>
                    </div>
                    <div class="w-100 mt-4 px-4 py-4 bg-white shadow overflow-hidden rounded" style="max-width: 28rem;">
                        <form @submit.prevent="handleLogin()">
                            <div class="alert alert-danger py-2" x-show="loginError" x-cloak x-transition role="alert" aria-live="assertive">
                                <div class="d-flex align-items-start gap-2">
                                    <i class="bi bi-exclamation-circle-fill mt-1"></i>
                                    <span x-text="loginError"></span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" x-text="t('Email')"></label>
                                <input id="email" type="email" class="form-control" x-model="loginForm.email" required autofocus autocomplete="username">
                            </div>
                            <div class="mt-4 mb-3">
                                <label class="form-label" x-text="t('Password')"></label>
                                <input id="password" type="password" class="form-control" x-model="loginForm.password" required autocomplete="current-password">
                            </div>
                            <div class="d-flex justify-content-end mt-4">
                                <button type="submit" class="btn btn-primary" :disabled="loginLoading">
                                    <span x-show="loginLoading" class="spinner-border spinner-border-sm me-1"></span>
                                    <span x-text="t('Log in')"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD PAGE -->
            <div x-show="currentPage === 'dashboard'" x-cloak>
                <!-- Welcome Banner -->
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div>
                        <h2 class="fw-bold text-secondary mb-0">
                            <i class="bi bi-speedometer2 me-2 text-primary"></i><span x-text="t('Dashboard')"></span>
                        </h2>
                        <small class="text-muted">
                            <span x-text="t('Welcome back,')"></span>
                            <strong x-text="profile?.name || user?.email"></strong>
                            <span>(<span x-text="roleLabel()"></span>)</span>
                        </small>
                    </div>
                    <span class="text-muted small"><i class="bi bi-calendar3 me-1"></i><span x-text="currentDate"></span></span>
                </div>

                <!-- Stats Cards (issue #14): the three numeric cards become
                     whole-card navigation targets (real buttons, 44px+ on
                     mobile); Section/Source stay plain cards and render
                     their entries in a grid below 768px. Desktop >=992px
                     keeps the 4-up row. -->
                <div class="row g-4 mb-4">

                    <!-- Total Patients -->
                    <div class="col-12 col-md-6 col-lg-3">
                        <button type="button" class="card stat-card stat-link border-0 shadow-sm h-100" @click="navigate('patients')" :aria-label="t('Manage') + ': ' + t('Total Patients')">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="stat-icon bg-primary bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-people-fill fs-2 text-primary" aria-hidden="true"></i>
                                </div>
                                <div class="stat-text">
                                    <div class="stat-value fs-2 fw-bold text-dark" x-text="stats.total"></div>
                                    <div class="text-muted small" x-text="t('Total Patients')"></div>
                                    <span class="stat-hint text-primary small"><span x-text="t('Manage')"></span> <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Completed -->
                    <div class="col-6 col-lg-3">
                        <button type="button" class="card stat-card stat-link border-0 shadow-sm h-100" @click="navigate('patients')" :aria-label="t('View') + ': ' + t('Completed')">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="stat-icon bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-check-circle-fill fs-2 text-success" aria-hidden="true"></i>
                                </div>
                                <div class="stat-text">
                                    <div class="stat-value fs-2 fw-bold text-dark" x-text="stats.completed"></div>
                                    <div class="text-muted small" x-text="t('Completed')"></div>
                                    <span class="stat-hint text-success small"><span x-text="t('View')"></span> <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Pending -->
                    <div class="col-6 col-lg-3">
                        <button type="button" class="card stat-card stat-link border-0 shadow-sm h-100" @click="navigate('patients')" :aria-label="t('View') + ': ' + t('Pending')">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="stat-icon bg-danger bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-exclamation-circle-fill fs-2 text-danger" aria-hidden="true"></i>
                                </div>
                                <div class="stat-text">
                                    <div class="stat-value fs-2 fw-bold text-danger" x-text="stats.pending"></div>
                                    <div class="text-muted small" x-text="t('Pending')"></div>
                                    <span class="stat-hint text-danger small"><span x-text="t('View')"></span> <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Sections: one entry per configured section -->
                    <div class="col-12 col-md-6 col-lg-3" x-show="isSuperAdmin || profile?.section">
                        <div class="card stat-card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="stat-icon bg-info bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-buildings fs-2 text-info" aria-hidden="true"></i>
                                </div>
                                <div class="stat-text">
                                    <div class="stat-entries">
                                        <template x-for="entry in sectionStatEntries()" :key="'sec-' + entry.key">
                                            <div class="stat-entry">
                                                <span class="stat-entry-value fs-3 fw-bold" :class="'text-' + sectionColor(entry.key)" x-text="entry.count"></span>
                                                <div class="stat-entry-label text-muted small" x-text="entry.label"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <hr class="text-muted opacity-25 my-2">
                                    <div class="text-muted small" x-text="t('By Section')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Sources: one entry per configured source of money -->
                    <div class="col-12 col-lg-3">
                        <div class="card stat-card border-0 shadow-sm h-100">
                            <div class="card-body d-flex align-items-center gap-3 p-4">
                                <div class="stat-icon bg-success bg-opacity-10 rounded-3 p-3 flex-shrink-0">
                                    <i class="bi bi-cash-coin fs-2 text-success" aria-hidden="true"></i>
                                </div>
                                <div class="stat-text">
                                    <div class="stat-entries">
                                        <template x-for="entry in sourceStatEntries()" :key="'src-' + entry.key">
                                            <div class="stat-entry">
                                                <span class="stat-entry-value fs-3 fw-bold" :class="'text-' + sourceColor(entry.key)" x-text="entry.count"></span>
                                                <div class="stat-entry-label text-muted small" x-text="entry.label"></div>
                                            </div>
                                        </template>
                                    </div>
                                    <hr class="text-muted opacity-25 my-2">
                                    <div class="text-muted small" x-text="t('By Source of Money')"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Financial Summary (super admin): the Prices page (#15) merged into the dashboard -->
                <div class="card border-0 shadow-sm mb-4" x-show="isSuperAdmin" x-cloak>
                    <div class="card-header bg-white border-bottom py-3 d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-currency-dollar me-2 text-primary"></i><span x-text="t('Financial Summary')"></span></h5>
                        <span class="text-muted small" x-text="t('Financial summary across all patients')"></span>
                    </div>
                    <div class="card-body p-4">
                        <!-- A failed summary request never takes the dashboard down: warning + retry. -->
                        <div class="alert alert-warning d-flex flex-wrap align-items-center gap-2 mb-0" x-show="priceStatsError">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <span x-text="t('The financial summary could not be loaded.')"></span>
                            <button type="button" class="btn btn-sm btn-outline-secondary ms-auto" @click="loadPriceStats()" x-text="t('Retry')"></button>
                        </div>

                        <!-- Loading state -->
                        <div class="text-center text-muted py-3" x-show="!priceStatsError && !priceStats">
                            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                            <span x-text="t('Loading the financial summary...')"></span>
                        </div>

                        <!-- Empty state: nothing priced yet -->
                        <div class="text-center text-muted py-3" x-show="priceStats && !hasFinancialData()">
                            <i class="bi bi-cash-stack fs-2 d-block mb-2"></i>
                            <span x-text="t('No financial data recorded yet.')"></span>
                        </div>

                        <!-- Grand total, By Section, By Source of Money -->
                        <div class="row g-4" x-show="hasFinancialData()">
                            <div class="col-lg-4">
                                <div class="card h-100 border-0 bg-primary text-white shadow-sm">
                                    <div class="card-body d-flex align-items-center gap-3 p-4">
                                        <i class="bi bi-cash-stack fs-2"></i>
                                        <div>
                                            <div class="small opacity-75" x-text="t('Grand Total')"></div>
                                            <div class="fs-4 fw-bold"><span x-text="formatMoney(priceStats?.grandTotal)"></span> <span class="small fw-normal opacity-75" x-text="t('EGP')"></span></div>
                                            <div class="small opacity-75"><span x-text="priceStats?.totalPatients ?? 0"></span> <span x-text="t('patients')"></span></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-4">
                                <div class="card h-100 border-0 shadow-sm">
                                    <div class="card-body p-0">
                                        <h6 class="fw-semibold text-secondary px-3 py-3 mb-0 border-bottom d-flex align-items-center gap-2">
                                            <i class="bi bi-building text-primary"></i><span x-text="t('By Section')"></span>
                                        </h6>
                                        <div class="fin-summary-grid p-2">
                                            <template x-for="entry in sectionFinancialEntries()" :key="'fin-sec-' + entry.key">
                                                <div class="fin-entry">
                                                    <div class="rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0" :class="'bg-' + sectionColor(entry.key)" style="width:32px;height:32px;">
                                                        <i class="bi" :class="sectionIcon(entry.key)"></i>
                                                    </div>
                                                    <div class="fin-entry-label">
                                                        <div class="fw-semibold text-truncate" x-text="entry.label"></div>
                                                        <div class="small text-muted"><span x-text="entry.count"></span> <span x-text="t('patients')"></span></div>
                                                    </div>
                                                    <div class="fin-entry-total">
                                                        <div class="fw-bold" :class="'text-' + sectionColor(entry.key)" x-text="formatMoney(entry.total)"></div>
                                                        <div class="small text-muted" x-text="t('EGP')"></div>
                                                    </div>
                                                </div>
                                            </template>
                                            <div class="small text-muted px-2 py-2" x-show="sectionFinancialEntries().length === 0" x-text="t('No financial data recorded yet.')"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-4">
                                <div class="card h-100 border-0 shadow-sm">
                                    <div class="card-body p-0">
                                        <h6 class="fw-semibold text-secondary px-3 py-3 mb-0 border-bottom d-flex align-items-center gap-2">
                                            <i class="bi bi-wallet2 text-primary"></i><span x-text="t('By Source of Money')"></span>
                                        </h6>
                                        <div class="fin-summary-grid p-2">
                                            <template x-for="entry in sourceFinancialEntries()" :key="'fin-src-' + entry.key">
                                                <div class="fin-entry">
                                                    <div class="rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0" :class="'bg-' + sourceColor(entry.key)" style="width:32px;height:32px;">
                                                        <i class="bi" :class="sourceIcon(entry.key)"></i>
                                                    </div>
                                                    <div class="fin-entry-label">
                                                        <div class="fw-semibold text-truncate" x-text="entry.label"></div>
                                                        <div class="small text-muted"><span x-text="entry.count"></span> <span x-text="t('patients')"></span></div>
                                                    </div>
                                                    <div class="fin-entry-total">
                                                        <div class="fw-bold" :class="'text-' + sourceColor(entry.key)" x-text="formatMoney(entry.total)"></div>
                                                        <div class="small text-muted" x-text="t('EGP')"></div>
                                                    </div>
                                                </div>
                                            </template>
                                            <div class="small text-muted px-2 py-2" x-show="sourceFinancialEntries().length === 0" x-text="t('No financial data recorded yet.')"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Patients -->
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
                        <h5 class="mb-0 fw-semibold"><i class="bi bi-clock-history me-2 text-primary"></i><span x-text="t('Recent Patients')"></span></h5>
                        <a href="#" class="btn btn-sm btn-outline-primary" @click="navigate('patients')"><span x-text="t('View All')"></span></a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient')"></th>
                                        <th class="py-3" x-text="t('Problem')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Visit Date')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in recentPatients" :key="patient.id">
                                        <tr>
                                            <td class="ps-4">
                                                <a href="#" class="fw-semibold text-dark text-decoration-none" @click="showPatient(patient)" x-text="patient.name"></a>
                                            </td>
                                            <td class="text-muted" x-text="patient.problem ? (patient.problem.length > 60 ? patient.problem.substring(0,60)+'…' : patient.problem) : ''"></td>
                                            <td>
                                                <span class="badge" :class="patient.is_completed ? 'bg-success' : 'bg-secondary'">
                                                    <span x-text="patient.is_completed ? t('Completed') : t('Pending')"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <template x-if="patient.visit_date">
                                                    <span class="badge bg-light text-dark border" x-text="formatDate(patient.visit_date)"></span>
                                                </template>
                                                <template x-if="!patient.visit_date">
                                                    <span class="text-muted small"></span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="recentPatients.length === 0">
                                        <td colspan="4" class="text-center py-4 text-muted" x-text="t('No patients recorded yet.')"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PATIENTS PAGE -->
            <div x-show="currentPage === 'patients'" x-cloak>
                <div class="row mb-4 align-items-center">
                    <div class="col-md-6">
                        <h2 class="text-secondary fw-bold mb-0">
                            <i class="bi bi-people-fill me-2 text-primary"></i><span x-text="t('Patients Management')"></span>
                        </h2>
                    </div>
                    <div class="col-md-6 text-end">
                        <button class="btn btn-success shadow-sm me-2" @click="exportPatients()" :disabled="exporting">
                            <span x-show="exporting" class="spinner-border spinner-border-sm me-1" x-cloak></span>
                            <i class="bi bi-file-earmark-spreadsheet me-1" x-show="!exporting"></i>
                            <span x-text="exporting ? t('Preparing...') : t('Excel')"></span>
                        </button>
                        <!-- The split-button group classes are conditional
                             (issue #17): with the import caret hidden there is
                             only one member, so the control must keep a normal
                             button's radius in both LTR and RTL instead of
                             carrying the 'rounded-end' patch-up hack. -->
                        <div class="shadow-sm me-2" :class="importEnabled ? 'btn-group' : ''">
                            <button type="button" class="btn btn-primary" @click="openPatientForm()">
                                <i class="bi bi-person-plus-fill me-1"></i> <span x-text="t('Add New Patient')"></span>
                            </button>
                            <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false" x-show="importEnabled" x-cloak :aria-label="t('Add New Patient')"></button>
                            <ul class="dropdown-menu dropdown-menu-end" style="min-width:19rem">
                                <template x-if="importEnabled">
                                    <li>
                                        <button type="button" class="dropdown-item fw-semibold" @click="openNewImport()">
                                            <i class="bi bi-stars me-2 text-primary"></i><span x-text="t('Import from file or paste')"></span>
                                        </button>
                                    </li>
                                </template>
                                <template x-if="importEnabled && importOpenJobs.length > 0">
                                    <li><hr class="dropdown-divider"></li>
                                </template>
                                <template x-for="job in (importEnabled ? importVisibleJobs : [])" :key="job.id">
                                    <li class="d-flex align-items-center gap-1 px-2">
                                        <button type="button" class="dropdown-item text-secondary flex-grow-1 text-start"
                                            @click="continueImport(job)">
                                            <i class="bi bi-arrow-counterclockwise me-2"></i><span x-text="t('Continue import')"></span>
                                            <span class="badge text-bg-light border ms-1 fw-normal" x-text="t('importAgent.wizard.status.' + job.status)"></span>
                                            <span class="small text-muted ms-1" x-text="importJobLabel(job)"></span>
                                        </button>
                                        <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none p-0 px-1"
                                            @click.stop="cancelImport(job)" :title="t('importAgent.wizard.cancel')" :aria-label="t('importAgent.wizard.cancel')">
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    </li>
                                </template>
                                <template x-if="importEnabled && importOpenJobs.length > 3">
                                    <li>
                                        <button type="button" class="dropdown-item text-secondary small" @click="importJobsExpanded = !importJobsExpanded">
                                            <i class="bi bi-chevron-down me-2" x-show="!importJobsExpanded"></i>
                                            <i class="bi bi-chevron-up me-2" x-show="importJobsExpanded"></i>
                                            <span x-text="importJobsExpanded ? t('importAgent.wizard.lessImports') : t('importAgent.wizard.moreImports', { count: importOpenJobs.length - 3 })"></span>
                                        </button>
                                    </li>
                                </template>
                                <template x-if="importEnabled && importOpenJobs.length > 0">
                                    <li>
                                        <button type="button" class="dropdown-item text-danger small" @click="clearAllImports()">
                                            <i class="bi bi-trash me-2"></i><span x-text="t('importAgent.wizard.clearAllImports')"></span>
                                        </button>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Filters toolbar (issue #13): every filter lives behind one
                     Filters control. Desktop: anchored popover. Mobile: bottom
                     sheet. The chips show the APPLIED filters; the panel stages
                     edits until Apply. The toolbar acts on outside clicks for
                     both the popover and the sheet, so the wrapper owns
                     @click.outside (clicking the button/scrim is inside it). -->
                <div class="filter-toolbar mb-4" @click.outside="showFilters && closeFilters()">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <button type="button" id="patientFiltersToggle" x-ref="patientFiltersToggle"
                            aria-haspopup="dialog" aria-controls="patientFiltersPanel"
                            :aria-expanded="showFilters ? 'true' : 'false'"
                            :class="(showFilters || activeFilterCount()) ? 'btn-primary' : 'btn-outline-secondary'"
                            class="btn filter-toggle"
                            @click="showFilters ? closeFilters() : openFilters()">
                            <i class="bi bi-funnel-pe"></i>
                            <span x-text="t('Filters')"></span>
                            <span class="badge text-bg-light border" x-show="activeFilterCount()" x-cloak x-text="activeFilterCount()"></span>
                        </button>
                        <button type="button" class="btn filter-clear-all text-secondary" x-show="activeFilterCount()" x-cloak @click="clearAllFilters()">
                            <i class="bi bi-x-circle"></i><span x-text="t('Clear all')"></span>
                        </button>
                    </div>

                    <!-- Applied-filter chips (removed one without reopening the panel) -->
                    <div class="filter-chips d-flex flex-wrap gap-2 mt-2" x-show="activeFilterCount()" x-cloak :aria-label="t('Active filters')">
                        <template x-for="chip in appliedFilterChips()" :key="chip.key">
                            <span class="chip">
                                <span class="chip-label" x-text="chip.label"></span>
                                <button type="button" class="chip-remove" :aria-label="chip.aria" @click="removeAppliedFilter(chip.key)">
                                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                                </button>
                            </span>
                        </template>
                    </div>

                    <div class="filter-scrim" x-show="showFilters" x-cloak @click="closeFilters()"></div>

                    <div id="patientFiltersPanel" x-ref="filterPanel" class="filter-panel" role="dialog" aria-modal="true"
                        :aria-label="t('Filters')" x-show="showFilters" x-cloak
                        @keydown="filtersPanelKeydown($event)">
                        <div class="filter-panel-header d-flex align-items-center justify-content-between">
                            <h6 class="mb-0 fw-semibold" x-text="t('Filters')"></h6>
                            <button type="button" class="btn-close" :aria-label="t('Close')" @click="closeFilters()"></button>
                        </div>
                        <form class="filter-panel-body" @submit.prevent="applyFilters()">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label mb-1" for="patientFilters.search" x-text="t('Search')"></label>
                                    <input type="search" id="patientFilters.search" class="form-control" x-model="filterDraft.search" :placeholder="t('Search any patient field...')">
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label class="form-label mb-1" for="patientFilters.status" x-text="t('Status')"></label>
                                    <select id="patientFilters.status" class="form-select" x-model="filterDraft.is_completed">
                                        <option value="" x-text="t('All')"></option>
                                        <option value="false" x-text="t('Pending')"></option>
                                        <option value="true" x-text="t('Completed')"></option>
                                    </select>
                                </div>
                                <div class="col-6 col-sm-3">
                                    <label class="form-label mb-1" for="patientFilters.dateFrom" x-text="t('Registered From')"></label>
                                    <input type="date" id="patientFilters.dateFrom" class="form-control" x-model="filterDraft.date_from">
                                </div>
                                <div class="col-6 col-sm-3">
                                    <label class="form-label mb-1" for="patientFilters.dateTo" x-text="t('Registered To')"></label>
                                    <input type="date" id="patientFilters.dateTo" class="form-control" x-model="filterDraft.date_to">
                                </div>
                            </div>

                            <div x-show="isSuperAdmin" x-cloak>
                                <div class="filter-scope-heading" x-text="t('Scope')"></div>
                                <div class="row g-3">
                                    <div class="col-12 col-sm-4">
                                        <label class="form-label mb-1" for="patientFilters.follower" x-text="t('Follower')"></label>
                                        <select id="patientFilters.follower" class="form-select" x-model="filterDraft.follower">
                                            <option value="" x-text="t('-- All Followers --')"></option>
                                            <template x-for="opt in activeOptions('follower')" :key="'fl-' + opt.key">
                                                <option :value="opt.key" x-text="optionLabel('follower', opt.key)"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="col-12 col-sm-4">
                                        <label class="form-label mb-1" for="patientFilters.section" x-text="t('Section')"></label>
                                        <select id="patientFilters.section" class="form-select" x-model="filterDraft.section">
                                            <option value="" x-text="t('-- All Sections --')"></option>
                                            <template x-for="opt in activeOptions('section')" :key="'fs-' + opt.key">
                                                <option :value="opt.key" x-text="optionLabel('section', opt.key)"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="col-12 col-sm-4">
                                        <label class="form-label mb-1" for="patientFilters.source" x-text="t('Source of Money')"></label>
                                        <select id="patientFilters.source" class="form-select" x-model="filterDraft.source_of_money">
                                            <option value="" x-text="t('-- All Sources --')"></option>
                                            <template x-for="opt in activeOptions('source')" :key="'fo-' + opt.key">
                                                <option :value="opt.key" x-text="optionLabel('source', opt.key)"></option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <!-- Sticky actions on the mobile sheet -->
                            <div class="filter-panel-footer">
                                <button type="button" class="btn btn-outline-secondary filter-panel-reset" @click="resetFilters()" x-text="t('Reset')"></button>
                                <button type="submit" class="btn btn-primary filter-panel-apply" x-text="t('Apply')"></button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light border-bottom text-muted">
                                    <tr>
                                        <th class="ps-4 py-3" x-text="t('Patient Name')"></th>
                                        <th class="py-3" x-text="t('National ID')"></th>
                                        <th class="py-3" x-text="t('Mobile No.')"></th>
                                        <th class="py-3" x-text="t('Governorate')"></th>
                                        <th class="py-3" x-text="t('Status')"></th>
                                        <th class="py-3" x-text="t('Follower')"></th>
                                        <th class="py-3" x-text="t('Source')"></th>
                                        <th class="py-3" x-text="t('Section')"></th>
                                        <th class="py-3" x-text="t('Registered Date')"></th>
                                        <th class="text-end pe-4 py-3" x-text="t('Actions')"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="patient in patients" :key="patient.id">
                                        <tr>
                                            <td class="ps-4">
                                                <span class="fw-bold text-dark d-block" x-text="patient.name"></span>
                                            </td>
                                            <td><code x-text="patient.national_id"></code></td>
                                            <td>
                                                <template x-if="patient.mobile">
                                                    <span><i class="bi bi-telephone text-muted me-1"></i><span x-text="patient.mobile"></span></span>
                                                </template>
                                                <template x-if="!patient.mobile">
                                                    <span class="text-muted"><em x-text="t('None')"></em></span>
                                                </template>
                                            </td>
                                            <td>
                                                <span class="badge bg-light text-dark border px-2 py-1">
                                                    <i class="bi bi-geo-alt-fill text-danger me-1"></i><span x-text="patient.governorate || 'N/A'"></span>
                                                </span>
                                            </td>
                                            <td>
                                                <button class="btn btn-sm px-2 py-1" :class="patient.is_completed ? 'btn-success' : 'btn-outline-secondary'" @click="toggleStatus(patient)">
                                                    <template x-if="patient.is_completed">
                                                        <span><i class="bi bi-check-circle-fill me-1"></i><span x-text="t('Completed')"></span></span>
                                                    </template>
                                                    <template x-if="!patient.is_completed">
                                                        <span><i class="bi bi-circle me-1"></i><span x-text="t('Pending')"></span></span>
                                                    </template>
                                                </button>
                                            </td>
                                            <td>
                                                <span class="text-secondary fs-7"><i class="bi bi-person-badge me-1"></i><span x-text="followerLabel(patient.follower)"></span></span>
                                            </td>
                                            <td>
                                                <span class="text-secondary fs-7"><i class="bi bi-cash-coin me-1"></i><span x-text="patient.source_of_money ? optionLabel('source', patient.source_of_money) : ''"></span></span>
                                            </td>
                                            <td>
                                                <span class="text-secondary fs-7"><i class="bi bi-building me-1"></i><span x-text="patient.section ? optionLabel('section', patient.section) : ''"></span></span>
                                            </td>
                                            <td>
                                                <span class="text-muted small" x-text="new Date(patient.created_at).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'})"></span>
                                            </td>
                                            <td class="text-end pe-4">
                                                <div class="btn-group" role="group">
                                                    <button class="btn btn-sm btn-outline-secondary" @click="showPatient(patient)" title="View">
                                                        <i class="bi bi-eye"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-primary" @click="editPatient(patient)" title="Edit">
                                                        <i class="bi bi-pencil-square"></i>
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-danger" @click="removePatient(patient)" title="Delete">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <tr x-show="patientsLoading">
                                        <td colspan="10" class="text-center py-5">
                                            <div class="spinner-border text-primary"></div>
                                        </td>
                                    </tr>
                                    <tr x-show="!patientsLoading && patients.length === 0">
                                        <td colspan="10" class="text-center py-5 text-muted">
                                            <i class="bi bi-folder-x fs-1 text-secondary d-block mb-2"></i>
                                            <span class="fw-semibold" x-text="t('No patients recorded yet.')"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- AI IMPORT AGENT (spec 10): files → extract → review -->
            <div x-show="currentPage === 'import'" x-cloak x-data="importAgentWizard()">
                <!-- The review step has its own header row (mockup screen 3):
                     the page title would be a second title for the same screen. -->
                <div class="d-flex align-items-center flex-wrap gap-2 mb-3" x-show="step !== 'review'">
                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="navigate('patients')">
                        <i class="bi bi-arrow-left me-1"></i><span x-text="t('Patients')"></span>
                    </button>
                    <h2 class="text-secondary fw-bold mb-0 fs-4">
                        <i class="bi bi-stars me-2 text-primary"></i><span x-text="t('importAgent.wizard.title')"></span>
                    </h2>
                </div>

                <div class="alert alert-danger" role="alert" x-show="errorBanner" x-cloak>
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <span x-text="errorBanner ? errorMessage({ messageKey: errorBanner.messageKey, params: errorBanner.params }) : ''"></span>
                        <button type="button" class="btn-close" @click="errorBanner = null" :aria-label="t('Cancel')"></button>
                    </div>
                </div>

                <!-- STEP: ADD (spec 5) -->
                <template x-if="step === 'add'">
                    <div>
                        <div class="card shadow-sm border-0 mb-3" x-show="openJobs.length > 0" x-cloak>
                            <div class="card-body py-2">
                                <div class="small fw-semibold text-muted mb-2" x-text="t('importAgent.wizard.openImports')"></div>
                                <div class="d-flex flex-column gap-1">
                                    <template x-for="job in openJobs" :key="job.id">
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="badge text-bg-light border fw-normal"
                                                x-text="t('importAgent.wizard.status.' + job.status)"></span>
                                            <span class="small text-muted" x-text="openJobLabel(job)"></span>
                                            <button type="button" class="btn btn-sm btn-outline-secondary ms-auto"
                                                @click="resumeJob(job.id)" x-text="t('importAgent.wizard.resume')"></button>
                                            <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none p-0 px-1"
                                                @click="cancelOpenJob(job)" :title="t('importAgent.wizard.cancel')"
                                                :aria-label="t('importAgent.wizard.cancel')">
                                                <i class="bi bi-x-lg"></i>
                                            </button>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <label class="dropzone-hero d-block border border-2 border-dashed rounded-4 text-center px-4 py-5 position-relative" style="cursor:pointer">
                                <span class="dropzone-icon d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3">
                                    <i class="bi bi-cloud-arrow-up fs-2"></i>
                                </span>
                                <span class="d-block fs-4 fw-semibold" x-text="t('importAgent.start.drop')"></span>
                                <span class="d-block text-muted mt-1" x-text="t('importAgent.start.types', { maxFiles })"></span>
                                <span class="btn btn-primary mt-3 px-4"><i class="bi bi-folder2-open me-2"></i><span x-text="t('importAgent.start.choose')"></span></span>
                                <input type="file" class="position-absolute top-0 start-0 w-100 h-100 opacity-0" multiple
                                    @change="onFilesPicked($event)" :aria-label="t('importAgent.start.choose')">
                            </label>

                            <div class="mt-3">
                                <label class="form-label small text-muted mb-1" x-text="t('importAgent.start.pasteLabel')"></label>
                                <textarea class="form-control" rows="2" x-model="pastedText" :placeholder="t('importAgent.start.pastePh')"></textarea>
                            </div>

                            <div class="mt-3">
                                <button type="button" class="btn btn-link btn-sm small p-0 text-decoration-none" @click="showMore = !showMore" :aria-expanded="showMore">
                                    <i class="bi me-1" :class="showMore ? 'bi-chevron-up' : 'bi-chevron-down'"></i><span x-text="t('importAgent.start.more')"></span>
                                </button>
                                <div x-show="showMore" x-cloak class="row g-2 mt-2">
                                    <div class="col-md-5">
                                        <label class="form-label small mb-1 fw-semibold" x-text="t('importAgent.start.sectionLabel')"></label>
                                        <select class="form-select form-select-sm" x-model="section">
                                            <option value="" x-text="t('importAgent.start.sectionNone')"></option>
                                            <template x-for="option in sectionOptions" :key="option.key">
                                                <option :value="option.key" x-text="optionDisplay(option)"></option>
                                            </template>
                                        </select>
                                        <div class="form-text" x-text="t('importAgent.start.sectionHint')"></div>
                                    </div>
                                    <div class="col-md-7">
                                        <label class="form-label small mb-1 fw-semibold" x-text="t('importAgent.start.hints')"></label>
                                        <textarea class="form-control form-control-sm" rows="2" x-model="hints" :maxlength="2000"></textarea>
                                        <div class="form-text" x-text="t('importAgent.start.hintsHint')"></div>
                                    </div>
                                </div>
                            </div>

                            <template x-if="files.length > 0">
                                <ul class="list-unstyled mb-0 mt-3">
                                    <template x-for="file in files" :key="file.id">
                                        <li class="d-flex align-items-center flex-wrap gap-2 py-2 border-top">
                                            <i class="bi" :class="fileIcon(file)"></i>
                                            <span class="fw-semibold text-break" x-text="file.name"></span>
                                            <span class="text-muted small" x-text="formatBytes(file.size ?? 0)"></span>
                                            <template x-if="file.error">
                                                <span class="badge text-bg-danger" x-text="fileErrorLabel(file)"></span>
                                            </template>
                                            <template x-for="(warning, wIndex) in (file.warnings ?? [])" :key="wIndex">
                                                <span class="badge text-bg-warning-subtle border border-warning-subtle text-body fw-normal"
                                                    :title="warning.code" x-text="t('importAgent.warn.' + warning.code, warning.params ?? {})"></span>
                                            </template>
                                            <button type="button" class="btn btn-sm btn-link text-danger ms-auto p-0" @click="removeFile(file.id)" :aria-label="t('importAgent.wizard.removeFile')"><i class="bi bi-x-lg"></i></button>
                                        </li>
                                    </template>
                                </ul>
                            </template>

                            <div class="text-end mt-4">
                                <button type="button" class="btn btn-primary btn-lg" @click="analyze()" :disabled="addBlocked">
                                    <span class="spinner-border spinner-border-sm me-1" x-show="busy" x-cloak></span>
                                    <i class="bi bi-stars me-1" x-show="!busy"></i>
                                    <span x-text="busy ? t('importAgent.wizard.sending') : t('importAgent.start.analyze')"></span>
                                </button>
                            </div>
                        </div>
                        </div>
                    </div>
                </template>

                <!-- STEP: EXTRACTING (spec 9) -->
                <template x-if="step === 'extracting'">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
                                <h5 class="card-title mb-0">
                                    <span class="spinner-border spinner-border-sm text-primary me-2"></span>
                                    <span x-text="banners.some(b => b.code === 'PROVIDER_RATE_LIMITED' || b.code === 'CHUNKS_RATE_LIMITED') ? t('importAgent.progress.waiting') : t('importAgent.progress.working')"></span>
                                </h5>
                                <button type="button" class="btn btn-sm btn-outline-danger" @click="cancelJob()" x-text="t('importAgent.wizard.cancel')"></button>
                            </div>
                            <div class="d-flex justify-content-between small mb-1">
                                <span x-text="t('importAgent.progress.chunks', { done: progress.done, total: progress.total })"></span>
                                <span x-text="progress.tokens ? t('importAgent.progress.tokens', { used: progress.tokens.in + progress.tokens.out, cap: progress.tokens.cap }) : ''"></span>
                            </div>
                            <div class="progress mb-3" style="height:1.2rem">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" :style="'width:' + (progress.total > 0 ? Math.round(100 * progress.done / progress.total) : 0) + '%'"></div>
                            </div>
                            <p class="small text-muted mb-2" x-show="progress.nextLabel" x-text="t('importAgent.progress.next', { label: progress.nextLabel })"></p>
                            <p class="small text-muted mb-2" x-show="banners.some(b => b.code === 'PUMP_DEADLINE')"
                                x-text="t('importAgent.progress.rounds')"></p>
                            <div class="alert alert-warning py-2 small" role="alert" x-show="banners.some(b => b.code !== 'CHUNKS_FAILED' && b.code !== 'PUMP_DEADLINE' || (b.code === 'CHUNKS_FAILED' && failedChunks.length === 0))">
                                <template x-for="(banner, bIndex) in banners" :key="bIndex">
                                    <div>
                                        <div x-text="bannerText(banner)"></div>
                                        <div class="small text-muted mt-1" x-show="banner.model" x-text="banner.model"></div>
                                        <div class="font-monospace text-break mt-1" x-show="banner.detail" x-text="banner.detail"></div>
                                        <div class="small text-muted mt-1" x-show="banner.retryAfterMs" x-text="bannerRetryText(banner)"></div>
                                        <div class="small mt-1" :class="banner.freeDaily && !(banner.freeDaily.remaining > 0) ? 'text-danger fw-semibold' : 'text-muted'"
                                            x-show="banner.freeDaily" x-text="bannerQuotaText(banner)"></div>
                                    </div>
                                </template>
                                <button type="button" class="btn btn-sm btn-outline-warning mt-2" x-show="banners.some(b => b.code === 'CHUNKS_RATE_LIMITED' || b.code === 'DATA_POLICY_BLOCKED' || b.code === 'CHUNKS_FAILED')"
                                    @click="navigate('settings')" x-text="t('importAgent.warn.openSettings')"></button>
                            </div>
                            <div class="alert alert-danger py-2 small" role="alert" x-show="pumpFailed" x-cloak>
                                <div x-text="pumpError ? errorMessage(pumpError) : t('importAgent.error.INTERNAL')"></div>
                                <div class="small text-muted mt-1" x-show="pumpError?.code" x-text="pumpError?.code"></div>
                                <button type="button" class="btn btn-sm btn-outline-danger mt-2 me-2" @click="resumeImport()"
                                    x-text="t('importAgent.progress.resume')"></button>
                            </div>
                            <button type="button" class="btn btn-sm btn-outline-warning" @click="retryFailed()" x-show="progress.failed > 0"
                                x-text="t('importAgent.review.retryChunk') + ' (' + progress.failed + ')'"></button>
