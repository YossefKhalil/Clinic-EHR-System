name: CI

on:
  push:
    branches: [master, ai-import-rebuild]
  pull_request:
  workflow_dispatch:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check Edge Functions
        run: npm run check:edge

      - name: Registry/schema check
        run: npm run check:registry

      - name: Locale check
        run: npm run check:i18n

      - name: Test (coverage gate on import-core)
        run: npm run test:coverage

      - name: Build
        run: npm run build
