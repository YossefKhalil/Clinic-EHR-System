name: Deploy Edge Functions

# Keeps the deployed Edge Functions in sync with supabase/functions on master.
# Issue #8 was caused by drift: the repo had the fix but the hosted function
# was an older revision. Deploying on every change to this folder stops that.
#
# Required repository secret:
#   SUPABASE_ACCESS_TOKEN - personal access token from
#     https://supabase.com/dashboard/account/tokens (starts with sbp_).
#     Add it under Settings -> Secrets and variables -> Actions.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xrotdkccsgdzswvejaki
    steps:
      - uses: actions/checkout@v4

      - name: Check access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set. Create a token at https://supabase.com/dashboard/account/tokens and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy manage-user
        run: supabase functions deploy manage-user --project-ref "$PROJECT_REF"

      # --no-verify-jwt: pg_cron calls this with the shared x-cleanup-secret
      # header (IMPORT_CLEANUP_SECRET); the function authenticates callers
      # itself and fails closed.
      - name: Deploy import-cleanup
        run: supabase functions deploy import-cleanup --no-verify-jwt --project-ref "$PROJECT_REF"
