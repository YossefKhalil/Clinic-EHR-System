name: Deploy Edge Functions

# Keeps the deployed Edge Functions in sync with supabase/functions on master.
# Issue #8 was caused by drift: the repo had the fix but the hosted function
# was an older revision. Deploying on every change to this folder stops that.
#
# Required repository secret:
#   SUPABASE_ACCESS_TOKEN - personal access token from
#     https://supabase.com/dashboard/account/tokens (starts with sbp_).
#     Add it under Settings -> Secrets and variables -> Actions.

on:
  workflow_dispatch:
  push:
    branches: [master, preview, ai-import-rebuild]
    paths:
      - 'supabase/functions/**'
      - 'supabase/schema.sql'
      - '.github/workflows/deploy-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xrotdkccsgdzswvejaki
    steps:
      - uses: actions/checkout@v4

      - name: Check access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set. Create a token at https://supabase.com/dashboard/account/tokens and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The functions read columns the schema owns (users.*, import_rows.*,
      # audit_log.*, ...). Applying the
      # idempotent schema here removes the race with the separate schema
      # workflow: a function can never be deployed before its migration
      # exists (that failure shows up as "column does not exist" and a
      # "SAVE_FAILED" the admin cannot act on).
      - name: Apply schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL is not set - skipping the schema step. Apply supabase/schema.sql before the functions."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --single-transaction \
            --no-psqlrc \
            --file supabase/schema.sql
          echo "Schema applied."
          # The schema must be complete, not just applied: the functions read
          # these objects on every request.
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --no-psqlrc -f supabase/verify-schema.sql
          echo "Schema verified."
          # PostgREST caches the functions it exposes. Without this, a freshly
          # created dashboard_stats()/price_stats() is still reported as
          # "Could not find the function ... in the schema cache" and the
          # dashboard looks empty until the cache expires.
          psql "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --no-psqlrc \
            --command "NOTIFY pgrst, 'reload schema';"
          echo "PostgREST schema cache reload requested."

      - name: Deploy manage-user
        run: supabase functions deploy manage-user --yes --project-ref "$PROJECT_REF"

      # --no-verify-jwt: pg_cron calls this with the shared x-cleanup-secret
      # header (IMPORT_CLEANUP_SECRET); the function authenticates callers
      # itself and fails closed.
      - name: Deploy import-cleanup
        run: supabase functions deploy import-cleanup --yes --no-verify-jwt --project-ref "$PROJECT_REF"

      # Deliberately inert while the CPU-only runtime is rebuilt: it answers
      # `enabled` with false and refuses every job action. Keeping it deployed
      # stops stale clients from reaching a runtime that no longer exists.
      - name: Deploy import-job
        run: supabase functions deploy import-job --yes --project-ref "$PROJECT_REF"

      # Signs Cloudinary uploads and delivery URLs. The default JWT check stays
      # on: only signed-in staff can request a signature. The Cloudinary API
      # key/secret are project secrets (CLOUDINARY_API_KEY / _SECRET /
      # _CLOUD_NAME) and never reach the browser.
      - name: Check Cloudinary secrets
        run: |
          set -euo pipefail
          secrets="$(supabase secrets list --project-ref "$PROJECT_REF")"
          for name in CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            if ! grep -q "$name" <<< "$secrets"; then
              echo "::warning::$name is not set. cloudinary-sign will answer 500 until it is (supabase secrets set)."
            fi
          done

      - name: Deploy cloudinary-sign
        run: supabase functions deploy cloudinary-sign --yes --project-ref "$PROJECT_REF"

      # --no-verify-jwt: the caller is signed out by definition. The function
      # resolves a username (the email local part) to its account email with
      # the service role and performs the password grant, so a username never
      # reveals the address behind it and both failure modes look the same.
      - name: Deploy login
        run: supabase functions deploy login --yes --no-verify-jwt --project-ref "$PROJECT_REF"
