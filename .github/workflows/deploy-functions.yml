name: Deploy Edge Functions

# Keeps the deployed Edge Functions in sync with supabase/functions on master.
# Issue #8 was caused by drift: the repo had the fix but the hosted function
# was an older revision. Deploying on every change to this folder stops that.
#
# Required repository secret:
#   SUPABASE_ACCESS_TOKEN - personal access token from
#     https://supabase.com/dashboard/account/tokens (starts with sbp_).
#     Add it under Settings -> Secrets and variables -> Actions.

on:
  workflow_dispatch:
  push:
    branches: [master, ai-import-rebuild]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xrotdkccsgdzswvejaki
    steps:
      - uses: actions/checkout@v4

      - name: Check access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set. Create a token at https://supabase.com/dashboard/account/tokens and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The functions read columns the schema owns (ai_settings.groq_key_encrypted,
      # ai_settings.model_chain, import_rows.*, ...). Applying the
      # idempotent schema here removes the race with the separate schema
      # workflow: a function can never be deployed before its migration
      # exists (that failure shows up as "column does not exist" and a
      # "SAVE_FAILED" the admin cannot act on).
      - name: Apply schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL is not set - skipping the schema step. Apply supabase/schema.sql before the functions."
            exit 0
          fi
          psql "$SUPABASE_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --single-transaction \
            --no-psqlrc \
            --file supabase/schema.sql
          echo "Schema applied."

      # Provision the encryption secret once. Never rotate it automatically:
      # changing this value makes every stored provider key unreadable.
      - name: Ensure AI settings encryption secret
        run: |
          set -euo pipefail
          secrets="$(supabase secrets list --project-ref "$PROJECT_REF")" || {
            echo "::error::Could not read the project secrets."
            exit 1
          }
          if grep -q 'AI_SETTINGS_ENC_KEY' <<< "$secrets"; then
            echo "AI_SETTINGS_ENC_KEY is already configured."
            exit 0
          fi
          enc_key="$(openssl rand -base64 32)"
          echo "::add-mask::$enc_key"
          supabase secrets set "AI_SETTINGS_ENC_KEY=$enc_key" --project-ref "$PROJECT_REF"
          echo "Generated and stored AI_SETTINGS_ENC_KEY."

      - name: Deploy manage-user
        run: supabase functions deploy manage-user --project-ref "$PROJECT_REF"

      # --no-verify-jwt: pg_cron calls this with the shared x-cleanup-secret
      # header (IMPORT_CLEANUP_SECRET); the function authenticates callers
      # itself and fails closed.
      - name: Deploy import-cleanup
        run: supabase functions deploy import-cleanup --no-verify-jwt --project-ref "$PROJECT_REF"

      # User-facing: verifies the caller's JWT (owner scoping happens in the
      # function itself through auth.uid()). Provider credentials live in
      # ai_settings (encrypted with the AI_SETTINGS_ENC_KEY project secret).
      - name: Deploy import-job
        run: supabase functions deploy import-job --project-ref "$PROJECT_REF"

      # Super-admin-only: owns the encrypted ai_settings row. It verifies the
      # caller and checks users.is_admin itself, so the default JWT check stays
      # on and anon callers are rejected before the handler runs.
      - name: Deploy ai-settings
        run: supabase functions deploy ai-settings --project-ref "$PROJECT_REF"
