name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # A real database query, not the auth health endpoint: GoTrue answers
      # even when the Postgres project is paused, so it never proved that the
      # database was awake. PostgREST still executes this query when RLS
      # returns no rows, which is exactly the activity the pause timer needs.
      - name: Query the database
        run: |
          curl --fail-with-body -sS -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/app_options?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
